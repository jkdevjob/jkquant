<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1320">
<meta name="robots" content="noindex,nofollow">
<title>JK 투자 — 관리자</title>
<style>
:root{
  --bg:#0f1320;--panel:#171c2e;--panel2:#1e2540;--line:#2a3354;
  --ink:#e8ecf7;--dim:#9aa6c9;--faint:#646e93;
  --buy:#36d399;--sell:#f87b8c;--gold:#f5c451;--vio:#8b8cf0;--vio2:#6366d9;--r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-variant-numeric:tabular-nums;/* 숫자는 어디서나 같은 폭 — 목록에서 위아래 자릿수가 저절로 맞는다 */background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.55;padding-bottom:40px;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header{padding:20px 0 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#141a2e,var(--bg))}
.htop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-weight:700}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
h1 .v{color:var(--gold)}
.btbtn{display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 14px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:border-color .15s,color .15s}
.btbtn:hover{border-color:var(--vio);color:var(--vio)}
@media(max-width:460px){.btbtn .bt-txt{display:none}.btbtn{padding:0 12px}}
/* ── 三 메뉴 (전 페이지 공통) ── */
.jkmenu{position:relative;flex-shrink:0}
.jkmenu-btn{height:40px;width:46px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:11px;font-size:19px;font-weight:700;line-height:1;cursor:pointer;letter-spacing:1px}
.jkmenu-btn:hover{border-color:var(--vio);color:var(--vio)}
.jkmenu-pop{position:absolute;right:0;top:47px;z-index:150;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:158px;box-shadow:0 14px 34px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:2px}
.jkmenu-pop[hidden]{display:none}
.jkmenu-pop a{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:8px;color:var(--dim);text-decoration:none;font-size:14px;font-weight:700;white-space:nowrap}
.jkmenu-pop a:hover{background:var(--panel2);color:var(--ink)}
.jkmenu-pop a.cur{color:var(--gold);background:var(--panel2)}
.jkmenu-pop a .mi{width:18px;text-align:center}
/* ── 상단 오른쪽: 사용자 배지 + 메뉴. 다섯 페이지가 같은 줄, 같은 모양이다 ── */
.hright{display:flex;align-items:center;gap:9px;flex-shrink:0}
/* 제목이 길어도 두 줄로 넘어가 헤더가 들쭉날쭉해지지 않게 한다 */
.htop>div:first-child{min-width:0}
.htop .kicker{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbadge{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);white-space:nowrap}
.userbadge img{width:22px;height:22px;border-radius:50%}
.userbadge .lo{color:var(--vio);cursor:pointer;font-weight:700;background:none;border:none;font-size:11.5px;padding:0;white-space:nowrap;font-family:inherit;text-decoration:none}
.lo{background:none;border:none;color:var(--faint);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0}

/* 왼쪽 메뉴 — 기능이 늘어나면 SECTIONS에 한 줄 더하면 된다 */
.layout{display:flex;gap:16px;margin-top:16px;align-items:flex-start}
.nav{display:flex;flex-direction:column;gap:6px;flex:0 0 168px;position:sticky;top:16px}
.nav button{text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:11px;padding:11px 13px;font-size:13px;font-weight:700;cursor:pointer;transition:border-color .15s,color .15s}
.nav button:hover{border-color:var(--vio)}
.nav button.on{background:var(--panel2);border-color:var(--vio2);color:var(--ink)}
.nav button small{display:block;font-size:10.5px;font-weight:600;color:var(--faint);margin-top:1px}
.nav button.soon{opacity:.5;cursor:default}
.nav button.soon:hover{border-color:var(--line)}
.body{flex:1 1 auto;min-width:0}
@media(max-width:700px){
  .layout{flex-direction:column;gap:12px}
  .nav{flex-direction:row;overflow-x:auto;flex:none;width:100%;position:static;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .nav button{flex:0 0 auto;padding:8px 12px}
  .nav button small{display:none}
}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px;margin-bottom:13px}
.card h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:0 0 auto}
.lead{color:var(--dim);font-size:13px;margin-bottom:13px}
.note{font-size:11.5px;color:var(--faint);margin-top:9px;line-height:1.5}
.err{color:var(--sell);font-size:13px}
.ghostbtn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--dim);font-size:12.5px;cursor:pointer}
.ghostbtn:hover{border-color:var(--vio);color:var(--vio)}
.ghostbtn.sm{padding:4px 10px;font-size:11.5px}
.ghostbtn.danger{border-color:rgba(248,123,140,.4);color:var(--sell)}
.ghostbtn.ok{border-color:rgba(54,211,153,.45);color:var(--buy)}
.prim{padding:9px 16px;border-radius:10px;border:none;background:var(--vio2);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.pill b{color:var(--ink)}
input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 11px;font-size:13px;font-family:inherit}

.cfg-tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.cfg-tabs button{flex:0 0 auto;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--dim);font-size:12px;font-weight:700;cursor:pointer}
.cfg-tabs button.on{border-color:var(--vio);color:var(--vio)}
.cfggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cfgfield label{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:11px;font-weight:700;margin:0 0 5px}
.cfgfield label input[type=checkbox]{width:auto;accent-color:var(--vio)}
.cfgfield input,.cfgfield select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 10px;font-size:13px;font-family:inherit}
.cfgfield input:disabled,.cfgfield select:disabled{opacity:.38;cursor:not-allowed}
.cfgfield input:focus,.cfgfield select:focus{outline:none;border-color:var(--vio)}
.cfgfield.on{padding:8px;border:1px solid rgba(139,92,246,.35);border-radius:11px;background:rgba(139,92,246,.05)}
.cfghelp{font-size:10.5px;color:var(--faint);margin-top:4px;line-height:1.45}
.cfgstatus{font-size:12px;color:var(--dim);min-height:18px;margin-top:9px}
.cfgstatus.ok{color:var(--buy)}.cfgstatus.err{color:var(--sell)}
.menu-list{display:grid;gap:8px}
.menu-row{display:grid;grid-template-columns:minmax(170px,1fr) 150px auto;gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.menu-name{font-weight:800;font-size:13px}.menu-name small{display:block;color:var(--faint);font-size:10.5px;font-weight:600;margin-top:2px}
.menu-row select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 9px;font-family:inherit}
.menu-move{display:flex;gap:5px}.menu-move button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--dim);cursor:pointer;font-weight:900}
.menu-move button:disabled{opacity:.3;cursor:default}
@media(max-width:620px){.cfggrid{grid-template-columns:1fr}.menu-row{grid-template-columns:1fr 1fr}.menu-move{justify-content:flex-end}}

.htable-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.htable{width:100%;border-collapse:collapse;font-size:11px;min-width:520px}
.htable th{color:var(--faint);font-weight:700;font-size:10px;padding:3px 4px;line-height:1.2;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.htable td{padding:3px 4px;line-height:1.25;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.htable th:first-child,.htable td:first-child{text-align:left;white-space:normal}
.htable tr.off{opacity:.5}
.tag{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:6px;margin-left:5px;white-space:nowrap}
.tag.admin{background:rgba(139,140,240,.18);color:var(--vio)}
.tag.blocked{background:rgba(248,123,140,.15);color:var(--sell)}
.tag.pending{background:rgba(245,196,81,.15);color:var(--gold)}
.tag.approved{background:rgba(54,211,153,.14);color:var(--buy)}
.note-req{color:var(--dim);font-size:11px;margin-top:2px;white-space:normal;max-width:320px}
.sub{color:var(--faint);font-size:10.5px}

.diag div.d{padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
.diag .ok{color:var(--buy);font-weight:800}
.diag .no{color:var(--sell);font-weight:800}
.diag .det{color:var(--faint)}
pre.rules{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:11px;line-height:1.5;overflow-x:auto;color:var(--dim);margin-top:10px;max-height:300px}

#gate{position:fixed;inset:0;background:linear-gradient(160deg,#0f1320,#171c2e);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#gate .gbox{max-width:380px;width:100%}
#gate .glogo{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
#gate .gsub{color:var(--dim);font-size:13px;margin-bottom:26px;line-height:1.6}
#gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:none;border-radius:12px;padding:13px 20px;font-size:15px;font-weight:700;cursor:pointer;width:100%;justify-content:center}
#gbtn svg{width:20px;height:20px}
#gate .gnote{color:var(--faint);font-size:11.5px;margin-top:18px;line-height:1.6}
</style>

function jkMenuToggle(e){ if(e) e.stopPropagation(); var p=document.getElementById('jkmenuPop'); if(p) p.hidden=!p.hidden; }
function jkMenuClose(){ var p=document.getElementById('jkmenuPop'); if(p) p.hidden=true; }

  <nav class="nav" id="nav"></nav>

<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* 관리자는 운영 화면과 같은 규약 — 계정으로 정한다. 목록도 규칙도 이 주소 하나를 본다. */
const ADMIN_EMAILS=['jk82investing@gmail.com'];
const normEmail=e=>String(e||'').trim().toLowerCase();
let me=null;
const isAdmin=()=>!!me && ADMIN_EMAILS.includes(normEmail(me.email));

/* ── 화면 목록 ────────────────────────────────────────────────────────
   기능을 더할 때는 여기 한 줄과 render 함수 하나만 있으면 된다.
   soon:true 면 자리만 잡아두고 눌러도 안 열린다. */
const SECTIONS=[
  {id:'users', label:'사용자',   sub:'이용 승인·차단', render:renderUsers},
  {id:'menus', label:'메뉴 관리', sub:'공개·숨김·순서', render:renderMenus},
  {id:'defaults', label:'전략 기본값', sub:'운영 탭 신규 세션', render:renderDefaults},
  {id:'diag',  label:'시스템 점검', sub:'API·규칙 상태', render:renderDiag},
  {id:'rules', label:'보안 규칙',  sub:'Firestore',    render:renderRules},
];
let curSec=(location.hash||'#users').slice(1);
function renderNav(){
  $('nav').innerHTML=SECTIONS.map(s=>
    `<button class="${s.id===curSec?'on':''}${s.render?'':' soon'}" onclick="go('${s.id}')">${esc(s.label)}<small>${esc(s.sub)}</small></button>`).join('');
}
function go(id){
  const s=SECTIONS.find(x=>x.id===id); if(!s||!s.render) return;
  curSec=id; history.replaceState(null,'','#'+id);
  renderNav(); $('body').innerHTML=''; s.render($('body'));
}
window.addEventListener('hashchange',()=>{ const id=(location.hash||'#users').slice(1); if(id!==curSec) go(id); });

// ── 1. 사용자 ────────────────────────────────────────────────────────
function fmtWhen(ms){
  const t=+ms||0; if(!t) return '<span class="sub">—</span>';
  const d=new Date(t), p=n=>String(n).padStart(2,'0');
  const days=Math.floor((Date.now()-t)/864e5);
  const rel = days<=0?'오늘' : days===1?'어제' : days<30?days+'일 전' : Math.floor(days/30)+'개월 전';
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}<br><span class="sub">${rel}</span>`;
}
/* 이용 상태는 앱이 보는 것과 같은 판정(JKAccess.decide)으로 보여준다 — 목록과 실제가 갈리지 않게.
   승인 대기 → 승인 · 거절 / 승인 → 승인 취소 · 차단 / 차단 → 차단 해제 */
const ACC_LABEL={pending:'승인 대기', approved:'승인', admin:'관리자', blocked:'차단됨'};
const ACC_ORDER={pending:0, admin:1, approved:2, blocked:3};   // 할 일(승인 대기)이 맨 위
function accState(r){ return window.JKAccess ? JKAccess.decide({email:r.email}, r)
  : (ADMIN_EMAILS.includes(normEmail(r.email))?'admin':r.blocked?'blocked':r.approved===true?'approved':'pending'); }
function renderUsers(el){
  el.innerHTML=`<div class="card"><h3><span class="dot"></span>이용 승인</h3>
    <p class="lead">처음 로그인하면 <b>이용 신청</b>이 접수됩니다. <b>승인</b>한 계정만 앱을 열 수 있고,
      <b>차단</b>은 승인보다 먼저입니다(승인돼 있어도 막힘). 단타 두 화면과 관리자는 승인과 상관없이 나만 봅니다.</p>
    <div class="row" id="u_sum" style="margin-bottom:12px"></div>
    <div id="u_body"><p class="lead">불러오는 중…</p></div>
    <div class="row" style="margin-top:12px"><button class="ghostbtn" onclick="loadUsers()">🔄 새로고침</button></div>
  </div>`;
  loadUsers();

function cfgClone(v){return JSON.parse(JSON.stringify(v));}
function mergeValues(src){
  const out=cfgClone(STRATEGY_DEFAULT_BUILTIN);
  if(!src||typeof src!=='object')return out;
  for(const k of Object.keys(out)) if(src[k]&&typeof src[k]==='object') out[k]={...out[k],...src[k]};
  return out;
}
function normalizeOverrides(src){
  const out={inf:{},vr:{},ma:{},ivs:{},dca:{},asap:{}};
  if(!src||typeof src!=='object')return out;
  for(const tab of Object.keys(out)){
    const allowed=STRATEGY_DEFAULT_BUILTIN[tab]||{}, v=src[tab];
    if(!v||typeof v!=='object')continue;
    for(const key of Object.keys(v)) if(Object.prototype.hasOwnProperty.call(allowed,key)&&v[key]!=null) out[tab][key]=v[key];
  }
  return out;
}
function cfgEq(a,b){return String(a)===String(b);}
function cfgValToAttr(v){return esc(typeof v==='boolean'?(v?'true':'false'):v);}
function cfgToggle(tab,key,on){
  const el=$('cfg_'+tab+'_'+key), box=$('cfg_box_'+tab+'_'+key);

}
function cfgFieldHtml(tab,f,val){

  }else if(type==='bool'){
    ctl='<select id="'+id+'"'+(on?'':' disabled')+'><option value="false"'+(val===false?' selected':'')+'>끔</option><option value="true"'+(val===true?' selected':'')+'>켬</option></select>';
  }else{
    ctl='<input id="'+id+'" type="'+(type==='number'?'number':'text')+'" value="'+esc(val)+'"'+(type==='number'?' step="any"':'')+(on?'':' disabled')+'>';
  }

    +'<input type="checkbox" id="cfg_on_'+tab+'_'+key+'" '+(on?'checked ':'')+'onchange="cfgToggle(\''+tab+'\',\''+key+'\',this.checked)">'
    +esc(label)+'</label>'+ctl+'</div>';

function switchDefaultsTab(k){

function readCurrentDefaultTab(){
  const m=STRATEGY_DEFAULT_META[defaultsTab],vals={...(strategyValues[defaultsTab]||{})}, over={};
  for(const f of m.fields){
    const [key,,type,opts]=f,el=$('cfg_'+defaultsTab+'_'+key);if(!el)continue;
    let v=el.value;
    const sample=STRATEGY_DEFAULT_BUILTIN[defaultsTab][key];
    if(type==='number'||typeof sample==='number'){
      const n=Number(v); v=Number.isFinite(n)?n:sample;
    }else if(typeof sample==='boolean')v=(v==='true');
    if(type==='select'&&opts){
      const hit=opts.find(o=>String(o[0])===String(el.value));if(hit)v=hit[0];
    }
    vals[key]=v;
    const ck=$('cfg_on_'+defaultsTab+'_'+key);
    if(ck&&ck.checked)over[key]=v;
  }
  strategyValues[defaultsTab]=vals;
  strategyOverrides[defaultsTab]=over;

  try{
    await window.fb.setDoc(window.fb.doc(window.fb.db,'users',me.uid),{

    },{merge:true});

  }catch(e){
    const status=$('cfgStatus');if(status){status.className='cfgstatus err';status.textContent='관리 해제 저장 실패 — '+(e.message||e);}

async function applyDefaultsExistingSessions(){
  if(!isAdmin()||!me)return;
  readCurrentDefaultTab();
  const selected=Object.values(strategyOverrides).reduce((a,x)=>a+Object.keys(x||{}).length,0);
  const status=$('cfgStatus');
  if(!selected){if(status){status.className='cfgstatus err';status.textContent='적용할 항목이 없습니다. 먼저 원하는 옵션을 체크하고 저장하세요.';}return;}
  if(status){status.className='cfgstatus';status.textContent='기존 세션 확인 중…';}
  try{
    const ref=window.fb.doc(window.fb.db,'users',me.uid);
    const snap=await window.fb.getDoc(ref);
    if(!snap.exists()) throw new Error('운영 데이터가 없습니다.');
    const doc=snap.data()||{}, sourceState=doc.stateV2||doc.state;
    if(!sourceState||typeof sourceState!=='object') throw new Error('운영 세션 상태를 찾지 못했습니다.');
    const sourceStateJson=JSON.stringify(sourceState), state=JSON.parse(sourceStateJson);
    const tabs=['inf','vr','ma','ivs','dca','asap'];
    let touched=0,paper=0,real=0,generated=0,changedFields=0,recalcPaper=0;
    const detail=[];
    tabs.forEach(tab=>{
      const box=state[tab], defs=strategyOverrides[tab]||{}, keys=Object.keys(defs);
      if(!box||!Array.isArray(box.sessions)||!keys.length)return;
      let tabTouched=0;
      box.sessions.forEach(sess=>{
        if(!sess||typeof sess!=='object')return;
        const prev=sess.settings&&typeof sess.settings==='object'?sess.settings:{};
        const changed=keys.filter(k=>!cfgEq(prev[k],defs[k]));
        if(!changed.length)return;
        touched++;tabTouched++;changedFields+=changed.length;
        const next={...prev}; changed.forEach(k=>{next[k]=cfgClone(defs[k]);});
        sess.settings=next;
        if(sess.paper){
          paper++;
          const affects=changed.some(k=>PAPER_AFFECT_KEYS[tab]&&PAPER_AFFECT_KEYS[tab].has(k));
          if(affects){
            recalcPaper++;
            const h=Array.isArray(sess.hist)?sess.hist:[];
            const kept=h.filter(x=>!(x&&(x.sim||x.auto)));
            generated+=h.length-kept.length;
            sess.hist=kept;
            delete sess.settings.simSig;delete sess.settings.simLast;
            delete sess.settings.cycStart;delete sess.settings.startCyc;delete sess.settings.cycLog;
          }
        }else real++;
      });
      if(tabTouched)detail.push((STRATEGY_DEFAULT_META[tab]||{}).name+' '+tabTouched+'개');
    });
    if(!touched) throw new Error('선택 항목이 이미 같은 값이라 바뀔 기존 세션이 없습니다.');
    const chosen=[];
    tabs.forEach(tab=>{
      const ks=Object.keys(strategyOverrides[tab]||{});
      if(ks.length)chosen.push((STRATEGY_DEFAULT_META[tab]||{}).name+': '+ks.map(k=>{
        const f=(STRATEGY_DEFAULT_META[tab].fields||[]).find(x=>x[0]===k);return f?f[1]:k;
      }).join(', '));
    });
    const msg='선택한 관리자 기본값만 기존 세션에 적용합니다.\n\n'
      +chosen.join('\n')+'\n\n'
      +'변경될 세션 '+touched+'개 ('+detail.join(' · ')+')\n'
      +'· 실계좌 '+real+'개: 거래기록 보존\n'
      +'· 모의투자 '+paper+'개 중 재계산 '+recalcPaper+'개\n'
      +'· 체크하지 않은 옵션은 그대로 유지\n\n계속할까요?';
    if(!confirm(msg)){
      if(status){status.className='cfgstatus';status.textContent='적용을 취소했습니다.';}
      return;
    }
    const now=Date.now(); state._updated=now;
    await window.fb.runTransaction(window.fb.db,async tx=>{
      const latest=await tx.get(ref),d=latest.exists()?(latest.data()||{}):{},currentState=d.stateV2||d.state;
      if(JSON.stringify(currentState)!==sourceStateJson) throw new Error('운영 원장이 다른 기기/탭에서 변경되었습니다. 최신 원장을 다시 불러온 뒤 적용하세요.');
      const nr=(+d.stateV2Rev||0)+1;
      tx.set(ref,{
        stateV2:state,stateV2Updated:now,stateV2Rev:nr,strategyDefaultOverrides:strategyOverrides,strategyDefaultOverridesUpdated:now
      },{merge:true});
    });
    if(status){
      status.className='cfgstatus ok';
      status.textContent='✓ '+touched+'개 세션 · '+changedFields+'개 설정 변경 · 모의 자동기록 '+generated+'건 재계산 대기';
    }
  }catch(e){
    if(status){status.className='cfgstatus err';status.textContent='기존 세션 적용 실패 — '+(e.message||e);}
  }
}

const MENU_ICONS={'/':'🏠','/plan':'🧭','/backtest':'📊','/scalping':'⚡','/claude':'🤖','/paper':'🧪','/ipo':'🎯','/realestate':'🏢','/job':'💼','/admin':'👤'};
const MENU_HARD_ADMIN=new Set(['/scalping','/claude','/admin']);
let menuDraft=[];
let menuSaveTimer=0,menuSaveSeq=0;

function menuDraftConfig(){

async function loadMenus(){

// ── 5. 보안 규칙 ─────────────────────────────────────────────────────
const RULES=`rules_version = '2';

/* JK 투자 — Firestore 보안 규칙
   Firebase 콘솔 → Firestore Database → 규칙 에 이 내용을 붙여넣고 게시한다.

   이용 승인제: 로그인하면 이용 신청이 접수되고(profiles/{uid}.requestedAt), 관리자가 승인해야
   (profiles/{uid}.approved == true) 자기 기록을 열 수 있다. 차단(blocked)은 승인보다 먼저다.
   화면 쪽 판정은 jk-access.js(JKAccess.decide)가 한 곳에서 하고, 이 규칙이 같은 판정으로 데이터를 막는다.
   화면만 가리면 앱을 거치지 않고 데이터를 읽는 걸 막지 못한다 — 진짜 잠금은 이 규칙이다.
   관리자 목록 조회(profiles 전체 읽기)도 규칙이 허용해야 동작한다.

   컬렉션 세 개:
     users/{uid}       — 그 사람의 전략·거래기록 전부. 승인된 본인만 읽고 쓴다. 관리자도 안 본다.
     profiles/{uid}    — 이메일·신청·접속시각·승인 상태. 관리자가 전체를 읽고 승인·차단한다.
     settings/siteMenu — 공용 메뉴 공개범위·순서. 승인 사용자는 읽고 관리자만 쓴다. */

service cloud.firestore {
  match /databases/{database}/documents {

    function isSignedIn()  { return request.auth != null; }
    function isAdmin()     { return isSignedIn() && request.auth.token.email == 'jk82investing@gmail.com'; }
    function isMine(uid)   { return isSignedIn() && request.auth.uid == uid; }
    function myProfile()   { return /databases/$(database)/documents/profiles/$(request.auth.uid); }
    function approved()    {
      // 관리자가 승인했고 차단되지 않은 계정만. 관리자는 이 검사에서 빠진다(자기를 잠그면 복구 불가)
      return isAdmin() || (exists(myProfile())
             && get(myProfile()).data.get('approved', false) == true
             && get(myProfile()).data.get('blocked', false) != true);
    }
    // 승인·차단 칸 — 본인이 건드리면 승인제가 무의미해진다. 관리자만 쓴다
    function adminKeys()   { return ['blocked', 'approved', 'approvedAt', 'approvedBy']; }
    // 이메일 칸은 로그인한 그 계정 것만 — 남의(관리자) 주소로 신청해 목록을 속이지 못하게
    function ownEmail()    { return request.resource.data.get('email', request.auth.token.email) == request.auth.token.email; }

    // 거래기록은 남이 못 본다 — 관리자도 마찬가지다. 승인 전에는 본인도 못 연다
    match /users/{uid} {
      allow read, write: if isMine(uid) && approved();

      // 단타 분봉 아카이브 등 큰 사용자 데이터는 날짜별 하위 문서로 분리한다.
      // 부모 users/{uid}와 동일하게 승인된 본인만 접근할 수 있다.
      match /{document=**} {
        allow read, write: if isMine(uid) && approved();
      }
    }

    match /profiles/{uid} {
      allow get:  if isMine(uid) || isAdmin();
      allow list: if isAdmin();                       // 사용자 목록은 관리자만
      // 본인은 신청·메모·접속 기록만 쓴다
      allow create: if isMine(uid) && ownEmail() && !request.resource.data.keys().hasAny(adminKeys());
      allow update: if isMine(uid) && ownEmail()
                    && !request.resource.data.diff(resource.data).affectedKeys().hasAny(adminKeys());
      allow write:  if isAdmin();                     // 승인·승인 취소·차단은 관리자만
    }

    // 메뉴 정책은 모든 승인 사용자가 같은 값을 읽고, 관리자만 변경한다.
    match /settings/siteMenu {
      allow read:  if approved();
      allow write: if isAdmin();
    }
  }
}`;
function renderRules(el){
  el.innerHTML=`<div class="card"><h3><span class="dot"></span>Firestore 보안 규칙</h3>
    <p class="lead">화면의 승인·차단은 로그인 직후 앱이 스스로 확인해 가리는 수준입니다.
      앱을 거치지 않고 데이터를 읽는 걸 막으려면(<b>승인 안 된 계정은 자기 기록도 못 연다</b>), 그리고 <b>사용자 목록을 열려면</b> 이 규칙이 있어야 합니다.</p>
    <p class="note" style="margin:0 0 10px">Firebase 콘솔 → <b>Firestore Database</b> → <b>규칙</b> 에 붙여넣고 <b>게시</b>를 누르세요.
      저장소의 <b>firestore.rules</b> 와 같은 내용입니다.</p>
    <div class="row"><button class="prim" onclick="copyRules()">📋 복사</button>
      <button class="ghostbtn" onclick="verifyDeployedRules()">🛡️ 실제 권한 검사</button>
      <a class="ghostbtn" href="https://console.firebase.google.com/project/jk-invest/firestore/rules" target="_blank" rel="noopener">콘솔 열기 ↗</a>
      <span id="r_copied" class="sub"></span></div>
    <div id="r_probe" class="note" style="margin:10px 0">실제 권한 검사는 현재 Firebase에 게시된 규칙의 핵심 동작을 읽기 요청으로 검증합니다.</div>
    <pre class="rules" id="r_pre">${esc(RULES)}</pre>
  </div>`;
}
function copyRules(){
  const done=()=>{ const e=$('r_copied'); if(e){ e.textContent='✓ 복사됨'; setTimeout(()=>e.textContent='',2500); } };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(RULES).then(done,done);
  else { const t=document.createElement('textarea'); t.value=RULES; document.body.appendChild(t); t.select();
         try{document.execCommand('copy');}catch(e){} t.remove(); done(); }
}
async function verifyDeployedRules(){
  const out=$('r_probe'),user=window.fb&&window.fb.auth&&window.fb.auth.currentUser;
  if(!out)return;
  if(!user){out.innerHTML='<span style="color:var(--sell)">✗ 로그인 상태가 아닙니다.</span>';return;}
  out.textContent='Firebase 실제 권한을 검사 중…';
  const rows=[];
  const add=(name,ok,detail)=>rows.push('<div style="margin:3px 0;color:'+(ok?'var(--buy)':'var(--sell)')+'">'+(ok?'✓ ':'✗ ')+esc(name)+(detail?' · '+esc(detail):'')+'</div>');
  try{
    const rr=await fetch('/firestore.rules?ts='+Date.now(),{cache:'no-store'}),txt=await rr.text();
    add('배포 파일 ↔ 관리자 표시 규칙 일치',rr.ok&&txt.trim()===RULES.trim(),rr.ok?'정적 배포본 비교':'HTTP '+rr.status);
  }catch(e){add('배포 파일 ↔ 관리자 표시 규칙 일치',false,e.message||String(e));}
  try{
    const snap=await window.fb.getDocs(window.fb.collection(window.fb.db,'profiles'));let n=0;snap.forEach(()=>n++);
    add('관리자 profiles 목록 조회 허용',true,n+'건');
  }catch(e){add('관리자 profiles 목록 조회 허용',false,e.code||e.message||String(e));}
  try{
    const snap=await window.fb.getDoc(window.fb.doc(window.fb.db,'settings','siteMenu'));
    add('메뉴 settings/siteMenu 읽기 허용',true,snap.exists()?'설정 문서 확인':'문서 없음 · 기본값 사용');
  }catch(e){add('메뉴 settings/siteMenu 읽기 허용',false,e.code||e.message||String(e));}
  try{
    await window.fb.getDoc(window.fb.doc(window.fb.db,'users',user.uid));
    add('본인 users 원장 읽기 허용',true,user.uid.slice(0,8)+'…');
  }catch(e){add('본인 users 원장 읽기 허용',false,e.code||e.message||String(e));}
  let denied=false,denyDetail='';
  try{
    await window.fb.getDoc(window.fb.doc(window.fb.db,'users','__jkquant_forbidden_probe_other_uid__'));
    denyDetail='다른 UID 읽기가 허용됨 — 규칙이 너무 넓습니다';
  }catch(e){
    denied=String(e&&e.code||'').includes('permission-denied')||/permission|insufficient/i.test(String(e&&e.message||e));
    denyDetail=denied?'permission-denied 정상':String(e&&e.code||e&&e.message||e);
  }
  add('다른 사용자 users 원장 읽기 차단',denied,denyDetail);
  const pass=rows.filter(x=>x.includes('✓ ')).length===5;
  out.innerHTML='<b>'+(pass?'실제 Firebase 권한 핵심검사 PASS':'실제 Firebase 권한 검사 확인 필요')+'</b>'+rows.join('');
}

// ── 로그인 ───────────────────────────────────────────────────────────
function googleLogin(){
  const err=$('gate_err'); if(err) err.textContent='';
  window.fb.signInWithPopup(window.fb.auth, window.fb.provider)
    .catch(e=>{ if(err) err.textContent=(e&&e.message)||'로그인 실패'; });
}
function doLogout(){ window.fb.signOut(window.fb.auth); }
function renderBadge(){
  const b=$('userbadge'); if(!b) return;
  if(!me){ b.innerHTML=''; return; }
  b.innerHTML=`${me.photoURL?`<img src="${esc(me.photoURL)}" alt="">`:''}<span>${esc(me.displayName||me.email||'')}</span>`
    +` · <button class="lo" onclick="doLogout()">로그아웃</button>`;
}
function boot(){
  window.fb.onAuthStateChanged(window.fb.auth, async user=>{
    me=user||null;
    try{ if(window.JKAccess) JKAccess.setAdmin(isAdmin()); }catch(e){}
    renderBadge();
    if(isAdmin()){
      $('gate').style.display='none';
      try{ if(window.JKAccess) await JKAccess.applyMenuConfig(me,window.fb,{force:true}); }catch(e){ console.warn('menu config',e); }
      renderNav();
      if(!SECTIONS.find(s=>s.id===curSec)) curSec='users';
      go(curSec);
    }else{
      $('gate').style.display='flex';
      $('gate_sub').innerHTML = user
        ? `<b>${esc(user.email||'')}</b> 계정에는 관리자 권한이 없습니다.`
        : '관리자 계정으로 로그인해야 볼 수 있습니다.';
      $('gbtn').textContent = user ? '다른 계정으로 로그인' : 'Google로 로그인';
      if(user) $('gbtn').onclick=()=>{ window.fb.signOut(window.fb.auth).then(googleLogin); };
    }
  });
}
if(window.fb) boot(); else window.addEventListener('fb-ready', boot);
</script>
