<style>
:root{--bg:#0f1320;--surf:#171c2e;--surf2:#1e2540;--border:#2a3354;--border2:#34406a;--text:#e8ecf7;--dim:#9aa6c9;--faint:#6f7ba0;--accent:#d9825b;--green:#36d399;--red:#f87b8c;--gold:#f5c451;--vio:#8b8cf0}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Segoe UI",sans-serif}body{font-size:14px;line-height:1.55}a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}header{padding:20px 0 12px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#141a2e,var(--bg))}
.htop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.htop>div:first-child{min-width:0}.kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.htop h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 0}.htop h1 .v{color:var(--gold)}.ver{font-size:12px;font-weight:400;color:var(--faint);vertical-align:middle}.hright{display:flex;align-items:center;gap:9px;flex-shrink:0}.userbadge{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);white-space:nowrap}.userbadge img{width:22px;height:22px;border-radius:50%}.userbadge .lo{color:var(--vio);cursor:pointer;font-weight:700;background:none;border:none;font-size:11.5px;padding:0;white-space:nowrap;font-family:inherit}
.jkmenu{position:relative;flex-shrink:0}.jkmenu-btn{height:40px;width:46px;display:inline-flex;align-items:center;justify-content:center;background:var(--surf2);border:1px solid var(--border);color:var(--text);border-radius:11px;font-size:19px;font-weight:700;line-height:1;cursor:pointer;letter-spacing:1px}.jkmenu-btn:hover{border-color:var(--vio);color:var(--vio)}
.jkmenu-pop{position:absolute;right:0;top:47px;z-index:100;background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:166px;box-shadow:0 14px 34px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:2px}
.jkmenu-pop[hidden]{display:none}.jkmenu-pop a{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:8px;color:var(--dim);text-decoration:none;font-weight:700}.jkmenu-pop a:hover,.jkmenu-pop a.cur{background:var(--surf2);color:var(--text)}.jkmenu-pop a.cur{color:var(--gold)}.mi{width:18px;text-align:center}
main{padding:22px 0 70px}.hero h2{font-size:23px;margin:0 0 3px}.sub{color:var(--dim);font-size:12px}
.card{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:12px}.card h3{margin:0 0 4px;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}.kpi{background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:10px}.kpi .l{font-size:11px;color:var(--dim)}.kpi .v{font-size:20px;font-weight:900;margin-top:2px}
.tw{overflow-x:auto;margin-top:8px}table{border-collapse:collapse;width:100%;min-width:560px;font-size:12.5px}th,td{border-bottom:1px solid var(--border);padding:7px 8px;text-align:right;white-space:nowrap}th{color:var(--dim);font-weight:700}td:first-child,th:first-child{text-align:left}
.win{color:var(--green)}.loss{color:var(--red)}.good{color:var(--green)}.bad{color:var(--red)}.note{color:var(--faint);font-size:11.5px;margin-top:8px}
.rule{background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:8px;font-size:13px}.rule b{color:var(--gold)}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px;margin-top:14px}.tab{flex:0 0 auto;border:1px solid var(--border);background:var(--surf);color:var(--dim);border-radius:999px;padding:8px 13px;font-weight:800;font-size:13px;cursor:pointer}.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.vs td:first-child{font-weight:800}
table.board{min-width:0}table.board td.nm{white-space:normal;min-width:150px}table.board td,table.board th{padding:7px 6px}.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--border);color:var(--dim);margin-left:6px}
.sec>summary{cursor:pointer;list-style:none}.sec>summary::-webkit-details-marker{display:none}.sec>summary h3:before{content:"▸ ";color:var(--faint)}.sec[open]>summary h3:before{content:"▾ "}
.ops .why,.sec .why{margin:8px 0;padding:8px 10px;border-radius:8px;background:var(--surf2);font-weight:700;font-size:13px;white-space:normal}
.status{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--dim);background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-top:10px}
table.doc td{padding:6px 6px}
.loading{padding:40px;text-align:center;color:var(--dim)}.warn{padding:9px 11px;border-radius:9px;background:rgba(248,123,140,.08);border:1px solid rgba(248,123,140,.25);color:#ffb3be;font-size:12px}
@media(max-width:560px){.wrap{padding:0 11px}.hero h2{font-size:20px}.kpi .v{font-size:17px}}
#gate{position:fixed;inset:0;background:linear-gradient(160deg,#0f1320,#171c2e);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#gate .gbox{max-width:380px;width:100%}#gate .glogo{font-size:26px;font-weight:800;margin-bottom:6px}#gate .gsub{color:var(--dim);font-size:13px;margin-bottom:24px;line-height:1.6}
#gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:none;border-radius:12px;padding:13px 20px;font-size:15px;font-weight:700;cursor:pointer;width:100%;justify-content:center}
#gate .gnote{color:var(--faint);font-size:11.5px;margin-top:18px}

<script>
function jkMenuToggle(e){if(e)e.stopPropagation();var p=document.getElementById("jkmenuPop");if(p)p.hidden=!p.hidden}
document.addEventListener("click",function(e){var m=document.getElementById("jkmenuWrap"),p=document.getElementById("jkmenuPop");if(m&&p&&!m.contains(e.target))p.hidden=true});
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
var NOTRADE="<span class='sub' style='font-weight:700'>매매 없음</span>";
function pct(v,d){if(v==null||!isFinite(v))return "—";v=+v;return (v>=0?"+":"")+v.toFixed(d==null?2:d)+"%"}
function num(v,d){return v==null||!isFinite(v)?"—":(+v).toFixed(d==null?1:d)}
function mddTxt(v){return v==null||!isFinite(v)?"—":(+v).toFixed(0)+"%"}
function cls(v){return v==null?"":(v>=0?"win":"loss")}

// 목표 지표 한 줄 — 거르기(기대값>0 · MDD · 최악일)를 통과해야 달성 빈도를 믿는다
function goalRow(label,z){
  z=z||{};
  return "<tr><td><b>"+esc(label)+"</b></td><td class='win'><b>"+num(z.plus1DaysPerYear,0)+"</b></td><td>"+num(z.plus5WeeksPerYear)+"</td><td class='loss'>"+mddTxt(z.mddPct)+"</td><td class='"+cls(z.weeklyAvgPct)+"'>"+pct(z.weeklyAvgPct)+"</td><td class='loss'>"+pct(z.lossDayAvgPct)+" / "+pct(z.worstDayPct,1)+"</td>"+
    "<td class='"+cls(z.cagrPct)+"'>"+pct(z.cagrPct,0)+"</td><td>"+num(z.tradeDaysPerYear,0)+"</td><td>"+(z.tradeDays?(z.gate?"✅":"❌"):"—")+"</td></tr>";
}
function goalTable(title,rows){
  return "<div class='tw'><table><thead><tr><th>"+esc(title)+"</th><th>+1%↑일/년</th><th>+5%↑주/년</th><th>MDD</th><th>주평균</th><th>손실일 평균 / 최악</th><th>연복리</th><th>매매일/년</th><th>통과</th></tr></thead><tbody>"+rows+"</tbody></table></div>";
}
function dayCell(z,k){z=((z||{})[k])||{};return z.days?"<span class='"+cls(z.dayAvgPnl)+"'>"+pct(z.dayAvgPnl)+"</span> <span class='sub'>t="+num(z.tStatDays,2)+" · "+z.days+"일</span>":"—"}


// ── 탭 설명서: 이 페이지만 보고 따라 할 수 있게 ──

    pick:"전날 밤: 코스피·코스닥 보통주 중 전일 RSI(14)<30 · 전일 거래대금 20억↑ · 주가 1,000원↑ · 관리/투자주의환기·최근 거래정지·가격제한 밖 움직임 제외 → 명단. 08:56: 명단 종목의 예상체결가로 갭 −2%~−29% 인 종목만, 가장 깊은 갭 3종목.",

    pick:"종목은 KODEX 코스닥150레버리지(233740) 하나.",buy:"15:21 예상 종가가 기준가 대비 −3% 이하이면 종가 동시호가 시장가.",sell:"다음 거래일 08:59 장전 동시호가 시장가(시가).",

    proof:"2018-04~2026-09 연 46회, 평균 +0.40%(t=2.8), 기준을 −2→−6% 로 엄격하게 할수록 평균이 커짐, 9개 연도 중 8개 양수.",

  crypto:{title:"③ BTC·ETH 어제 고가 돌파 하루 단타 (비트코인)",what:"오르는 흐름(어제 종가가 20일 평균 위)인 날, 가격이 어제 고가를 뚫는 순간 사서 다음 날 09:00 에 판다. 고가 돌파는 그날 매수세가 강하다는 뜻이라 하루 안에 이어지는 경우가 많다. 보유는 24시간을 넘지 않는다.",

    risk:"보유 24시간 미만 · 손절 −5% · 탭 표시 자금 80%. 과거 MDD −24%, 최악일 −4.2%.",money:"전체 계좌의 코인 칸(30%) 안에서 두 코인 반반 전액.",
    proof:"2018~2026-09 60분봉: 매매일 연 130일, 평균 +0.19%(t=3.5), +1% 달성일 29일/년. 평균 10·20·50일, 앞뒤 절반(2018~22 · 2022~26) 모두 양수. 9개 연도 중 7개 양수.",
    times:"09:00 하루 시작 · 돌파 순간 매수 · 다음 날 09:00 매도 · 텔레그램 09:05(어제 결과·오늘 기준선)"},
  soxl:{title:"④ SOXL 단기 과매도 반등 (최대 5일)",what:"반도체 3배 ETF SOXL 이 장기 상승 흐름(200일 평균 위) 안에서 이틀 사이 급하게 빠지면(RSI(2) < 20) 다음 날 아침에 사서, 반등해 오른 날이 나오면 바로 판다. 대부분 하루~이틀 보유(절반 이상이 다음 날 시가 매도).",

  if(c.status==="holiday")return "<div class='why'>🔒 "+esc(c.date)+" 마감 — 휴장</div>";
  var tr=(c.trades||[]).map(function(x,i){return "<tr><td style='text-align:left;white-space:normal'>"+(i+1)+". <b>"+esc(x.name)+"</b><div class='sub'>"+esc(x.entryTime)+" "+won(x.entryPrice)+" → "+esc(x.exitTime)+" "+won(x.exitPrice)+" · "+esc(x.reason)+"</div></td><td class='"+cls(x.pnlPct)+"'><b>"+pct(x.pnlPct)+"</b><div class='sub'>"+M(x.pnlAmount)+"</div></td></tr>"}).join("");
  var op=(c.open||[]).map(function(x){return "<div class='sub'>· 미청산 "+esc(x.name)+" "+esc(x.entryTime)+" "+won(x.entryPrice)+(x.markPrice?" → "+won(x.markPrice):"")+" "+pct(x.pnlPct)+" ("+esc(x.reason)+")</div>"}).join("");
  return "<div class='card' style='margin-top:8px;border-color:var(--gold)'><h3>🔒 "+esc(c.date)+" 마감 장부 <span class='tag'>텔레그램 결과와 같은 원본</span></h3>"+
    "<div class='sub'>감시 "+(c.watched||0)+" · 후보 "+(c.candidates||0)+" · 진입 "+(c.entries||0)+" · 청산 "+(c.exits||0)+" · 승 "+(c.wins||0)+" · 패 "+(c.losses||0)+" · 승률 "+(c.winRate==null?"—":num(c.winRate,1)+"%")+" · 미청산 "+(c.open||[]).length+"</div>"+
    "<div class='why'>실현 "+pct(c.realizedPct)+" · "+M(c.realizedAmount)+" <span class='sub'>(비용 뺀 순손익)</span></div>"+(c.note?"<div class='sub'>"+esc(c.note)+"</div>":"")+(c.warn?"<div class='warn'>"+esc(c.warn)+"</div>":"")+
    (tr?"<div class='tw'><table class='board'><thead><tr><th style='text-align:left'>종목 · 진입 → 청산 · 사유</th><th>순손익</th></tr></thead><tbody>"+tr+"</tbody></table></div>":"<p class='note'>거래 없음</p>")+op+"</div>";
}
// 탭마다 "오늘 모의 매매이력" — 장중 실시간(현재가 기준 손익)
function liveCard(tab){var h=liveCard0(tab),t=(LIVE&&LIVE.tabs||{})[tab]||{};return h+closedBox(t.closed);}
function liveCard0(tab){
  if(!LIVE)return "<div class='card'><h3>⑤ 오늘 장중 모의 매매이력</h3><div class='sub'>불러오는 중…</div></div>";
  if(LIVE.error)return "<div class='card'><h3>⑤ 오늘 장중 모의 매매이력</h3><div class='warn'>"+esc(LIVE.error)+"</div></div>";
  var t=(LIVE.tabs||{})[tab]||{},rows=t.rows||[];
  var head="<div class='card'><h3>⑤ 오늘 장중 모의 매매이력 <span class='tag'>"+esc(LIVE.today||"")+" "+kstTime(LIVE.asOf)+" 기준</span> <button class='tab' style='padding:4px 10px;font-size:11px' onclick='loadLive()'>새로고침</button></h3><div class='sub'>"+esc(t.note||"")+"</div>";
  if(tab==="opening"&&t.decision){
    var b=t.decision.breadth;head+="<div class='sub' style='margin-top:6px'>08:56 판단: "+esc(t.decision.reason||"")+(b?" · 통과 "+b.qualified+"종목 · v2 매매일 "+(b.v2Signal?"예":"아니오"):"")+"</div>";
  }
  if(tab==="crypto"&&t.basketPct!=null)head+="<div class='kpis'><div class='kpi'><div class='l'>오늘 코인 칸 손익 (두 코인 반반)</div><div class='v "+cls(t.basketPct)+"'>"+pct(t.basketPct)+"</div><div class='sub'>탭 표시(자금 80%) "+pct(t.tabPct)+"</div></div></div>";
  var tdy=t.today;if(tdy&&tdy.noTrade)head+="<div class='kpis'><div class='kpi'><div class='l'>오늘</div><div class='v'>"+NOTRADE+"</div><div class='sub'>"+esc(tdy.why||"")+"</div></div></div>";
  else if(tdy)head+="<div class='kpis'><div class='kpi'><div class='l'>오늘 칸 수익률</div><div class='v "+cls(tdy.tabPct)+"'>"+pct(tdy.tabPct)+"</div></div><div class='kpi'><div class='l'>개별 매매 합계</div><div class='v "+cls(tdy.sumPct)+"'>"+pct(tdy.sumPct)+"</div><div class='sub'>"+(tdy.noTrade?"거래 없음":"거래 "+tdy.trades+"건 · 수익 "+(tdy.wins||0)+" · 손실 "+(tdy.losses||0))+"</div></div><div class='kpi'><div class='l'>계좌 기여 (×"+Math.round(tdy.weight*100)+"%)</div><div class='v "+cls(tdy.accountPct)+"'>"+pct(tdy.accountPct)+"</div></div></div>";
  if(!rows.length)return head+"<p class='note'>오늘은 아직 매매가 없습니다"+(tab==="opening"&&!t.ledgerFound?" (08:56 전이거나 오늘 기록 없음)":"")+".</p></div>";
  var body=rows.map(function(x){
    var buy=x.buyTime?esc(x.buyTime)+" · "+won(x.buyPrice)+(x.buyPriceKind==="예상"?" (예상)":""):"—";
    var sell=x.sellPrice?esc(x.sellTime||"")+" · "+won(x.sellPrice):x.stopPrice?"손절선 "+won(x.stopPrice)+(x.nowPrice?" · 현재 "+won(x.nowPrice):""):x.nowPrice?"현재 "+won(x.nowPrice)+(x.sellTime?" · 매도 "+esc(x.sellTime):""):(x.sellTime?esc(x.sellTime):"");
    return "<tr><td class='nm'><b>"+esc(x.name||x.code)+"</b><div class='sub'>"+esc(x.status||"")+"</div>"+(x.note?"<div class='sub'>"+esc(x.note)+"</div>":"")+"</td>"+
      "<td style='white-space:normal;text-align:left;font-size:12px'>매수 "+buy+(sell?"<br>"+sell:"")+"</td>"+
      "<td><b class='"+cls(x.pnlPct)+"'>"+(x.pnlPct==null?"—":pct(x.pnlPct))+"</b><div class='sub'>"+(x.realized?"확정":(x.pnlPct==null?"":"현재가"))+"</div></td></tr>";
  }).join("");
  if(tab==="soxl"){var u=rows[0]||{},ls=u.lastSession;
    return head+"<div class='kpis'><div class='kpi'><div class='l'>SOXL 상태</div><div class='v' style='font-size:15px'>"+esc(u.status||"")+"</div><div class='sub'>"+esc(u.session||"")+(u.nowPrice?" · 현재 "+won(u.nowPrice):"")+(u.buyPrice?" · 매수 "+won(u.buyPrice):"")+(u.sellPrice?" · 매도 "+won(u.sellPrice):"")+(u.signalClose?" · 판단 종가 "+won(u.signalClose):"")+"</div></div>"+
      "<div class='kpi'><div class='l'>지금 손익 (칸 전액)</div><div class='v "+cls(u.pnlPct)+"'>"+(u.pnlPct==null?"—":pct(u.pnlPct))+"</div></div>"+
      "<div class='kpi'><div class='l'>마지막 확정 세션 "+esc(ls?ls.date:"")+"</div><div class='v "+cls(ls&&ls.pnlPct)+"'>"+(ls&&ls.pnlPct!=null?pct(ls.pnlPct):"—")+"</div><div class='sub'>"+esc(ls?ls.action:"")+" · 칸 전액 기준</div></div></div></div>";}
  return head+"<div class='tw'><table class='board'><thead><tr><th>종목 · 상태</th><th style='text-align:left'>매수 → 매도</th><th>손익(순)</th></tr></thead><tbody>"+body+"</tbody></table></div></div>";
}
async function load(){
  var body=document.getElementById("body");
  try{var t=localStorage.getItem("clTab");if(t)TAB=t}catch(e){}
  try{
    var r=await fetch("/api/claude-lab",{headers:await authHeaders()});var j=await r.json();
    if(!r.ok||!j.ok)throw new Error(j.error||("HTTP "+r.status));
    J=j;showTab(TAB);
    loadLive();
    if(!window.__liveTimer)window.__liveTimer=setInterval(function(){if(!document.hidden&&ME)loadLive()},60000);
  }catch(e){body.innerHTML="<div class='warn'>불러오기 실패: "+esc(e.message||String(e))+"</div>"}
}
// ── 로그인 · 소유자 확인 (단타 GPT 와 같은 규약: /api/owner) ──
var ME=null;
async function authHeaders(){var h={Accept:"application/json"};if(ME){try{h.Authorization="Bearer "+(await ME.getIdToken())}catch(e){}}return h}
function gateShow(msg){document.getElementById("gate").style.display="flex";if(msg)document.getElementById("gate_sub").innerHTML=msg}
function googleLogin(){var e=document.getElementById("gate_err");e.textContent="";window.fb.signInWithPopup(window.fb.auth,window.fb.provider).catch(function(x){e.textContent=(x&&x.message)||"로그인 실패"})}
function doLogout(){window.fb.signOut(window.fb.auth)}
function boot(){
  window.fb.onAuthStateChanged(window.fb.auth,async function(user){
    ME=user||null;var ub=document.getElementById("userbadge");
    if(!user){if(ub)ub.innerHTML="";J=null;LIVE=null;document.getElementById("body").innerHTML="";gateShow("이 화면은 <b>소유자 계정</b>만 볼 수 있습니다.");return}
    var ok=false;
    try{var r=await fetch("/api/owner",{cache:"no-store",headers:{Authorization:"Bearer "+(await user.getIdToken())}});var j=await r.json();ok=!!j.isOwner}catch(e){}
    if(!ok){gateShow("<b>"+esc(user.email||"")+"</b> 계정에는 접근 권한이 없습니다.");var b=document.getElementById("gbtn");b.textContent="다른 계정으로 로그인";
      b.onclick=function(){window.fb.signOut(window.fb.auth).then(googleLogin)};return}
    document.getElementById("gate").style.display="none";
    if(ub)ub.innerHTML=(user.photoURL?"<img src=\""+esc(user.photoURL)+"\" alt=\"\">":"")+"<span>"+esc(user.displayName||user.email||"")+"</span> · <button class=\"lo\" onclick=\"doLogout()\">로그아웃</button>";
    load();
  });
}
if(window.fb)boot();else window.addEventListener("fb-ready",boot);
</script>
