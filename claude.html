<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>단타(클로드) — JK Quant</title>
<style>
:root{--bg:#0f1320;--surf:#171c2e;--surf2:#1e2540;--border:#2a3354;--border2:#34406a;--text:#e8ecf7;--dim:#9aa6c9;--faint:#6f7ba0;--accent:#d9825b;--green:#36d399;--red:#f87b8c;--gold:#f5c451}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Segoe UI",sans-serif}body{font-size:14px;line-height:1.55}a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}header{border-bottom:1px solid var(--border);background:rgba(15,19,32,.96);position:sticky;top:0;z-index:50;backdrop-filter:blur(10px)}
.htop{height:64px;display:flex;align-items:center;justify-content:space-between}.brand .kicker{font-size:10px;letter-spacing:.12em;color:var(--accent);font-weight:900}.brand h1{font-size:19px;margin:1px 0 0}.brand .v{color:var(--gold)}.ver{font-size:12px;font-weight:400;color:var(--faint)}
.jkmenu{position:relative}.jkmenu-btn{height:38px;width:44px;background:var(--surf2);border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:18px;font-weight:700}
.jkmenu-pop{position:absolute;right:0;top:45px;z-index:100;background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:166px;box-shadow:0 14px 34px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:2px}
.jkmenu-pop[hidden]{display:none}.jkmenu-pop a{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:8px;color:var(--dim);text-decoration:none;font-weight:700}.jkmenu-pop a:hover,.jkmenu-pop a.cur{background:var(--surf2);color:var(--text)}.jkmenu-pop a.cur{color:var(--gold)}.mi{width:18px;text-align:center}
main{padding:22px 0 70px}.hero h2{font-size:23px;margin:0 0 3px}.sub{color:var(--dim);font-size:12px}
.card{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:12px}.card h3{margin:0 0 4px;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}.kpi{background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:10px}.kpi .l{font-size:11px;color:var(--dim)}.kpi .v{font-size:20px;font-weight:900;margin-top:2px}
.tw{overflow-x:auto;margin-top:8px}table{border-collapse:collapse;width:100%;min-width:560px;font-size:12.5px}th,td{border-bottom:1px solid var(--border);padding:7px 8px;text-align:right;white-space:nowrap}th{color:var(--dim);font-weight:700}td:first-child,th:first-child{text-align:left}
.win{color:var(--green)}.loss{color:var(--red)}.good{color:var(--green)}.bad{color:var(--red)}.note{color:var(--faint);font-size:11.5px;margin-top:8px}
.rule{background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:8px;font-size:13px}.rule b{color:var(--gold)}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px;margin-top:14px}.tab{flex:0 0 auto;border:1px solid var(--border);background:var(--surf);color:var(--dim);border-radius:999px;padding:8px 13px;font-weight:800;font-size:13px;cursor:pointer}.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.vs td:first-child{font-weight:800}
table.board{min-width:0}table.board td.nm{white-space:normal;min-width:150px}table.board td,table.board th{padding:7px 6px}.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--border);color:var(--dim);margin-left:6px}
.sec>summary{cursor:pointer;list-style:none}.sec>summary::-webkit-details-marker{display:none}.sec>summary h3:before{content:"▸ ";color:var(--faint)}.sec[open]>summary h3:before{content:"▾ "}
.ops .why,.sec .why{margin:8px 0;padding:8px 10px;border-radius:8px;background:var(--surf2);font-weight:700;font-size:13px;white-space:normal}
.status{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--dim);background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-top:10px}
table.doc td{padding:6px 6px}
.loading{padding:40px;text-align:center;color:var(--dim)}.warn{padding:9px 11px;border-radius:9px;background:rgba(248,123,140,.08);border:1px solid rgba(248,123,140,.25);color:#ffb3be;font-size:12px}
@media(max-width:560px){.wrap{padding:0 11px}.hero h2{font-size:20px}.kpi .v{font-size:17px}}
</style>
</head>

<main><div class="wrap">
  <div class="hero">
    <h2>목표: 하루 +1% · 주 +5%</h2>
    <div class="sub">GPT 단타와 같은 4개 탭에 클로드 전략을 하나씩 두고, 같은 기간으로 GPT 기준전략과 비교합니다. 모든 수익률은 수수료·세금·슬리피지를 뺀 순수익, 매매 없는 날은 0%로 셉니다.</div>

<script>
function jkMenuToggle(e){if(e)e.stopPropagation();var p=document.getElementById("jkmenuPop");if(p)p.hidden=!p.hidden}
document.addEventListener("click",function(e){var m=document.getElementById("jkmenuWrap"),p=document.getElementById("jkmenuPop");if(m&&p&&!m.contains(e.target))p.hidden=true});
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function pct(v,d){if(v==null||!isFinite(v))return "—";v=+v;return (v>=0?"+":"")+v.toFixed(d==null?2:d)+"%"}
function num(v,d){return v==null||!isFinite(v)?"—":(+v).toFixed(d==null?1:d)}
function mddTxt(v){return v==null||!isFinite(v)?"—":(+v).toFixed(0)+"%"}
function cls(v){return v==null?"":(v>=0?"win":"loss")}

// 목표 지표 한 줄 — 거르기(기대값>0 · MDD · 최악일)를 통과해야 달성 빈도를 믿는다
function goalRow(label,z){
  z=z||{};
  return "<tr><td><b>"+esc(label)+"</b></td><td class='win'><b>"+num(z.plus1DaysPerYear,0)+"</b></td><td>"+num(z.plus5WeeksPerYear)+"</td><td class='loss'>"+mddTxt(z.mddPct)+"</td><td class='"+cls(z.weeklyAvgPct)+"'>"+pct(z.weeklyAvgPct)+"</td><td class='loss'>"+pct(z.lossDayAvgPct)+" / "+pct(z.worstDayPct,1)+"</td>"+
    "<td class='"+cls(z.cagrPct)+"'>"+pct(z.cagrPct,0)+"</td><td>"+num(z.tradeDaysPerYear,0)+"</td><td>"+(z.tradeDays?(z.gate?"✅":"❌"):"—")+"</td></tr>";
}
function goalTable(title,rows){
  return "<div class='tw'><table><thead><tr><th>"+esc(title)+"</th><th>+1%↑일/년</th><th>+5%↑주/년</th><th>MDD</th><th>주평균</th><th>손실일 평균 / 최악</th><th>연복리</th><th>매매일/년</th><th>통과</th></tr></thead><tbody>"+rows+"</tbody></table></div>";
}
function dayCell(z,k){z=((z||{})[k])||{};return z.days?"<span class='"+cls(z.dayAvgPnl)+"'>"+pct(z.dayAvgPnl)+"</span> <span class='sub'>t="+num(z.tStatDays,2)+" · "+z.days+"일</span>":"—"}


// ── 탭 설명서: 이 페이지만 보고 따라 할 수 있게 ──
var DOC={
  opening:{title:"① D-1 갭하락 과매도 (시초가)",what:"오래 빠진 종목이 아침에 한 번 더 크게 갭하락하면, 장중에 되돌리는 경향을 노린다. 시장 전체가 투매하는 날에만 강하다.",
    pick:"전날 밤: 코스피·코스닥 보통주 중 전일 RSI(14)<30 · 전일 거래대금 20억↑ · 주가 1,000원↑ · 관리/투자주의환기·최근 거래정지·가격제한 밖 움직임 제외 → 명단. 08:56: 명단 종목의 예상체결가로 갭 −2%~−29% 인 종목만, 가장 깊은 갭 3종목.",
    buy:"08:59 장전 동시호가 시장가(시가에 체결).",sell:"15:20~15:30 종가 동시호가 시장가(종가에 체결). 장중 손절 없음.",
    risk:"v2: 조건 통과 종목이 5개 이상인 날(시장 투매일)만 '매매일'로 센다. 그 밖의 날은 측정용 모의 주문만.",
    money:"하루 자금을 3종목에 똑같이. 전체 계좌의 국내 칸(30%)을 ②와 나눠 쓴다.",
    proof:"2018~2026 677일: v2 하루 +1.33%(1.5틱, t=3.0), 9개 연도 모두 양수, 같은 날 무작위 갭하락 대비 +1.75%p.",
    times:"08:56 판단 · 08:59 매수 · 15:21 매도 · 15:40 체결 확인 · 텔레그램 08:59/15:40"},
  daytrading:{title:"② 코스닥150 레버리지 하락일 야간 (데이트레이딩)",what:"지수가 하루에 크게 빠진 날 종가에 사서 다음 날 아침 시가에 판다. 급락 다음 날 아침 반등을 노린다. ETF 라 거래세가 없다.",
    pick:"종목은 KODEX 코스닥150레버리지(233740) 하나.",buy:"15:21 예상 종가가 기준가 대비 −3% 이하이면 종가 동시호가 시장가.",sell:"다음 거래일 08:59 장전 동시호가 시장가(시가).",
    risk:"하룻밤 보유. 손절 없음. 최악일 −13%(과거).",money:"①과 같은 날이면 국내 칸을 반씩.",
    proof:"2018-04~2026-09 연 46회, 평균 +0.40%(t=2.8), 기준을 −2→−6% 로 엄격하게 할수록 평균이 커짐, 9개 연도 중 8개 양수.",
    times:"15:21 매수 판단 · 다음날 08:59 매도 · 15:40 체결 확인 · 텔레그램 15:21/15:40"},
  crypto:{title:"③ BTC·ETH 어제 고가 돌파 하루 단타 (비트코인)",what:"오르는 흐름(어제 종가가 20일 평균 위)인 날, 가격이 어제 고가를 뚫는 순간 사서 다음 날 09:00 에 판다. 고가 돌파는 그날 매수세가 강하다는 뜻이라 하루 안에 이어지는 경우가 많다. 보유는 24시간을 넘지 않는다.",
    pick:"업비트 BTC·ETH 두 코인, 반반. 업비트 하루 = 09:00~다음날 09:00.",buy:"어제 종가 > 20일 평균인 날만. 오늘 가격이 어제 고가를 넘는 순간 그 가격에 매수(09시에 이미 넘어 있으면 09시 시가). 못 넘으면 그날은 매매 없음.",sell:"다음 날 09:00 에 무조건 매도. 매수가 대비 −5% 닿으면 즉시 손절.",
    risk:"보유 24시간 미만 · 손절 −5% · 탭 표시 자금 80%. 과거 MDD −24%, 최악일 −4.2%.",money:"전체 계좌의 코인 칸(30%) 안에서 두 코인 반반 전액.",
    proof:"2018~2026-09 60분봉: 매매일 연 130일, 평균 +0.19%(t=3.5), +1% 달성일 29일/년. 평균 10·20·50일, 앞뒤 절반(2018~22 · 2022~26) 모두 양수. 9개 연도 중 7개 양수.",
    times:"09:00 하루 시작 · 돌파 순간 매수 · 다음 날 09:00 매도 · 텔레그램 09:05(어제 결과·오늘 기준선)"},
  soxl:{title:"④ SOXL 단기 과매도 반등 (최대 5일)",what:"반도체 3배 ETF SOXL 이 장기 상승 흐름(200일 평균 위) 안에서 이틀 사이 급하게 빠지면(RSI(2) < 20) 다음 날 아침에 사서, 반등해 오른 날이 나오면 바로 판다. 대부분 하루~이틀 보유(절반 이상이 다음 날 시가 매도).",
    pick:"종목은 SOXL 하나. 미국장 마감 확정 종가로 판단: RSI(2) < 20 이고 종가 > 200일 평균.",buy:"신호가 난 다음 미국장 시가(한국시각 22:30, 서머타임 해제 시 23:30).",sell:"종가가 전날 종가보다 오른 날이 나오면 그다음 미국장 시가에 매도. 오르지 않아도 5거래일 종가 뒤 다음 시가에 무조건 매도 — 5일을 넘기지 않음.",
    risk:"손절 대신 최대 5일 보유로 끊는다(과거 손절을 넣으면 오히려 나빠짐). 탭 표시 자금 50%, 과거 MDD −24%, 최악일 −8%(자금 50% 기준).",money:"전체 계좌의 미국 칸(40%) 안에서 전액.",
    proof:"2011~2026-09(설계): 연 25회 매매, 매매일 평균 +0.18%(t=2.7), +1% 달성일 19일/년, 최근 1년 +1% 달성일 37일 · 누적 +49%. 신호 기준 RSI 10~30 어디서나 양수. 하루 한정(다음 날 무조건 매도)은 0 근처라 그림자로만 둔다.",
    times:"미국장 마감 후 판단(한국 05~06시) · 다음 미국장 시가 매수/매도 · 텔레그램 09:05(지난 세션 결과·오늘 밤 할 일)"}
};
function sec(title,inner,open,id){return "<details class='card sec'"+(open?" open":"")+(id?" id='"+id+"'":"")+"><summary><h3 style='display:inline'>"+title+"</h3></summary><div style='margin-top:8px'>"+inner+"</div></details>"}
function docRow(k,v){return "<tr><td style='width:96px;color:var(--gold);font-weight:800;vertical-align:top'>"+k+"</td><td style='white-space:normal;text-align:left'>"+esc(v)+"</td></tr>"}
function docCard(tab){var d=DOC[tab];if(!d)return "";
  return sec("① 전략 · 종목 선정 규칙 — "+esc(d.title),"<div class='rule'>"+esc(d.what)+"</div><div class='tw'><table class='board doc'><tbody>"+docRow("종목 선정",d.pick)+docRow("자금",d.money)+docRow("근거",d.proof)+"</tbody></table></div>",true);}
function buyCard(tab){var d=DOC[tab];if(!d)return "";
  return sec("③ 매수 타이밍","<div class='tw'><table class='board doc'><tbody>"+docRow("매수",d.buy)+docRow("시간표",d.times)+"</tbody></table></div>",true);}
function sellCard(tab){var d=DOC[tab];if(!d)return "";
  return sec("④ 매도 · 손절 · 리스크","<div class='tw'><table class='board doc'><tbody>"+docRow("매도",d.sell)+docRow("위험 관리",d.risk)+"</tbody></table></div><p class='note'>목표(+1%/일 · +5%/주)를 맞추려고 기준·손절을 임의로 바꾸지 않습니다. 바꿀 때는 그림자 전략으로 먼저 검증합니다.</p>",true);}
var EXEC={opening:"KIS 모의투자(VTS) 실제 주문 · 체결 조회",daytrading:"KIS 모의투자(VTS) 실제 주문 · 체결 조회",crypto:"주문 없음 — 업비트 60분봉 모의 장부",soxl:"주문 없음 — 미국 일봉 모의 장부"};
var MARKET={opening:"코스피·코스닥 보통주 (전일 RSI<30 명단)",daytrading:"KODEX 코스닥150레버리지 233740",crypto:"업비트 KRW-BTC · KRW-ETH (하루 단타)",soxl:"SOXL (반도체 3배)"};
var WEEKKEY={opening:["opening_d1v2"],daytrading:["daytrading_etf"],crypto:["coin_bo_btc","coin_bo_eth"],soxl:["us_soxl"]};
// 탭 맨 위 운영판 — 기준전략 · 오늘 · 왜 · 누적 · 그림자 판정 표본 · 이번 주 · 데이터 날짜
function opsBoard(tab){
  var t=((J.lab||{}).tabs||{})[tab]||{},c=t.claude||{},lt=(LIVE&&LIVE.tabs&&LIVE.tabs[tab])||{},td=lt.today;
  var sm=((J.lab||{}).paper||{}).summary||{},keys=PKEYS[tab]||[],z=sm[keys[0]]||{};
  var wk=(J.lab||{}).week||{},wp=wk.parts||{},wcon=(WEEKKEY[tab]||[]).reduce(function(a,k){return a+(((wp[k]||{}).contribPct)||0)},0),acc=wk.account||{};
  var sh=(((J.lab||{}).shadows||{})[tab]||[]).filter(function(x){return !x.error});

  return "<tr><td>"+esc(label)+"</td><td class='"+cls(z.totalPct)+"'><b>"+pct(z.totalPct,1)+"</b></td><td class='win'><b>"+z.plus1Days+"</b></td><td class='loss'>"+mddTxt(z.mddPct)+"</td><td>"+z.plus5Weeks+"</td><td class='loss'>"+pct(z.worstDayPct,1)+"</td><td class='"+cls(z.weeklyAvgPct)+"'>"+pct(z.weeklyAvgPct)+"</td><td>"+z.tradeDays+"</td><td>"+(z.tradeDays?(z.gate?"✅":"❌"):"—")+"</td></tr>";
}
function vsTable(t){
  var c=t.compare||{},g=t.gpt||{};
  if(!c.window)return "<p class='note'>GPT 기준전략 기록이 아직 없어 비교 구간이 없습니다.</p>";
  return "<div class='sub'>같은 기간 "+esc(c.window[0])+" ~ "+esc(c.window[1])+"</div><div class='tw vs'><table><thead><tr><th>전략</th><th>누적</th><th>+1%↑일</th><th>MDD</th><th>+5%↑주</th><th>최악일</th><th>주평균</th><th>매매일</th><th>통과</th></tr></thead><tbody>"+
    vsRow("🤖 클로드",c.claude)+vsRow("GPT · "+((g.strategyVersions||[]).join(", ")||"기준전략"),c.gpt)+"</tbody></table></div>"+
    "<p class='note'>GPT 기록 "+(g.trades||0)+"건(자체 기록 순손익, 같은 날 여러 건이면 평균). 기간이 짧으면 숫자가 흔들리니 누적일수를 같이 보세요.</p>";
}
function claudeCard(t,extra){
  var c=t.claude||{};
  return "<div class='card'><h3>🤖 "+esc(c.name||"")+"<span class='tag'>"+esc(c.strategyVersion||"")+"</span></h3><div class='rule'>"+esc(c.rule||"")+"</div>"+(extra||"")+
    goalTable("목표 지표",goalRow("설계 표본 (~"+esc(J.lab.designEnd||"")+")",c.design)+goalRow("판정용 (10/1~)",c.outOfSample))+
    "<p class='note'>설계 표본은 규칙을 만들 때 본 기간이라 판정에 쓰지 않습니다.</p></div>"+
    "<div class='card'><h3>⚖️ GPT 기준전략과 비교</h3>"+vsTable(t)+"</div>";
}
function nextSig(t,unit){
  if(t.nextSignals)return "<div class='kpis'>"+Object.keys(t.nextSignals).map(function(m){var n=t.nextSignals[m];return "<div class='kpi'><div class='l'>"+esc(m.replace("KRW-",""))+" 다음 "+unit+" ("+esc(n.basedOn)+" 확정 기준)</div><div class='v "+(n.trendNext?"good":"")+"' style='font-size:15px'>"+(n.trendNext?"돌파 감시":"쉼")+"</div><div class='sub'>"+(n.trendNext?"기준선(어제 고가) "+Math.round(n.levelNext).toLocaleString()+" 넘으면 매수 · ":"")+"종가 "+Math.round(n.prevClose).toLocaleString()+" · 20일 평균 "+Math.round(n.ma).toLocaleString()+"</div></div>"}).join("")+"</div>";
  var n=t.nextSignal;if(!n)return "";
  if(n.action!==undefined){var act={buy:"시가 매수",sell:"시가 매도"}[n.action]||(n.holding?"보유 유지 ("+n.heldDays+"일째)":"쉼");
    return "<div class='kpis'><div class='kpi'><div class='l'>다음 "+unit+" 할 일 ("+esc(n.basedOn)+" 종가 기준)</div><div class='v "+(n.action==="buy"?"good":"")+"'>"+esc(act)+"</div><div class='sub'>종가 "+num(n.close)+" · RSI(2) "+num(n.rsi2,0)+" (매수 &lt; 20) · 200일 평균 "+num(n.ma)+(n.close>n.ma?" 위":" 아래")+"</div></div></div>";}
  return "<div class='kpis'><div class='kpi'><div class='l'>다음 "+unit+" 신호 ("+esc(n.basedOn)+" 종가 기준)</div><div class='v "+(n.holdNext?"good":"")+"'>"+(n.holdNext?"보유":"쉼")+"</div><div class='sub'>종가 "+Math.round(n.signalClose).toLocaleString()+" · 평균 "+Math.round(n.ma).toLocaleString()+"</div></div></div>";
}

    html+="<div class='card'><h3>📅 전일 · 당일 결과 — 모든 전략</h3><div class='sub'>숫자는 순손익 %. 시장마다 자기 마지막 두 거래일(코인은 09시 기준 하루). 갱신 "+esc((dl.generatedAt||"").slice(0,16).replace("T"," "))+"</div>"+

    html+="<div class='card'><h3>📒 모의투자 누적 ("+esc(pp.start||"2026-10-01")+"~)</h3><div class='sub'>날짜별 장부는 한 번만 쓰고 덮어쓰지 않습니다. 국내는 KIS 모의투자 체결, 코인·미국은 일봉 모의 체결입니다. 매매일 20일이 쌓이면 기대(설계 표본)와 비교해 벗어나면 '규칙 점검'으로 표시합니다.</div>"+
      (pp.error?"<div class='warn'>"+esc(pp.error)+"</div>":"")+
      "<div class='tw'><table class='board'><thead><tr><th>전략</th><th>매매일</th><th>+1%↑</th><th>누적</th><th>매매일 평균</th><th>상태</th></tr></thead><tbody>"+prow+"</tbody></table></div></div>";
  }else if(TAB==="opening"||TAB==="daytrading"||TAB==="crypto"||TAB==="soxl"){
    html+=tabPage(TAB,T,gd,et,wl);
  }else{

      "<div class='kpis'><div class='kpi'><div class='l'>+1% 달성일/년</div><div class='v good'>"+num(p.plus1DaysPerYear,0)+"일</div></div><div class='kpi'><div class='l'>+5% 달성주/년</div><div class='v'>"+num(p.plus5WeeksPerYear)+"주</div></div><div class='kpi'><div class='l'>주 평균</div><div class='v "+(p.weeklyAvgPct>=0?"good":"bad")+"'>"+pct(p.weeklyAvgPct)+"</div></div><div class='kpi'><div class='l'>최악의 날 · MDD</div><div class='v bad'>"+pct(p.worstDayPct,1)+" · "+mddTxt(p.mddPct)+"</div></div></div>"+
      goalTable("설계 표본",goalRow("① D-1 v2",(et.d1v2||{}).design)+goalRow("② ETF 하락일 야간",(et.etf||{}).design)+goalRow("①+② 포트폴리오",pf.design))+
      goalTable("판정용 (10/1~)",goalRow("① D-1 v2",(et.d1v2||{}).outOfSample)+goalRow("② ETF 하락일 야간",(et.etf||{}).outOfSample)+goalRow("①+② 포트폴리오",pf.outOfSample))+
      "<p class='note'>이 표는 국내 ①+② 만입니다. 코인·미국까지 합친 전체 계좌는 위 카드에 있습니다.</p></div>";

        "<div class='kpi'><div class='l'>+5% 달성주/년</div><div class='v'>"+num(q.plus5WeeksPerYear)+"주</div><div class='sub'>최근 1년 "+(ly.plus5Weeks||0)+"주</div></div>"+
        "<div class='kpi'><div class='l'>주 평균</div><div class='v good'>"+pct(q.weeklyAvgPct)+"</div><div class='sub'>최근 1년 누적 "+pct(ly.totalPct,1)+"</div></div>"+

var LIVE=null;
async function loadLive(){
  try{var r=await fetch("/api/claude-live",{headers:{Accept:"application/json"}});var j=await r.json();LIVE=(r.ok&&j.ok)?j:{error:j.error||("HTTP "+r.status)};}
  catch(e){LIVE={error:String(e.message||e)}}
  render();
}
function kstTime(iso){try{return new Date(iso).toLocaleTimeString("ko-KR",{timeZone:"Asia/Seoul",hour:"2-digit",minute:"2-digit",hour12:false})}catch(e){return ""}}
function won(v){return v==null||!isFinite(v)?"—":(+v>=1000?Math.round(+v).toLocaleString():(+v).toFixed(2))}
// 탭마다 "오늘 모의 매매이력" — 장중 실시간(현재가 기준 손익)
function liveCard(tab){
  if(!LIVE)return "<div class='card'><h3>⑤ 오늘 장중 모의 매매이력</h3><div class='sub'>불러오는 중…</div></div>";
  if(LIVE.error)return "<div class='card'><h3>⑤ 오늘 장중 모의 매매이력</h3><div class='warn'>"+esc(LIVE.error)+"</div></div>";
  var t=(LIVE.tabs||{})[tab]||{},rows=t.rows||[];
  var head="<div class='card'><h3>⑤ 오늘 장중 모의 매매이력 <span class='tag'>"+esc(LIVE.today||"")+" "+kstTime(LIVE.asOf)+" 기준</span> <button class='tab' style='padding:4px 10px;font-size:11px' onclick='loadLive()'>새로고침</button></h3><div class='sub'>"+esc(t.note||"")+"</div>";
  if(tab==="opening"&&t.decision){
    var b=t.decision.breadth;head+="<div class='sub' style='margin-top:6px'>08:56 판단: "+esc(t.decision.reason||"")+(b?" · 통과 "+b.qualified+"종목 · v2 매매일 "+(b.v2Signal?"예":"아니오"):"")+"</div>";
  }
  if(tab==="crypto"&&t.basketPct!=null)head+="<div class='kpis'><div class='kpi'><div class='l'>오늘 코인 칸 손익 (두 코인 반반)</div><div class='v "+cls(t.basketPct)+"'>"+pct(t.basketPct)+"</div><div class='sub'>탭 표시(자금 80%) "+pct(t.tabPct)+"</div></div></div>";
  var tdy=t.today;if(tdy)head+="<div class='kpis'><div class='kpi'><div class='l'>오늘 칸 수익률</div><div class='v "+cls(tdy.tabPct)+"'>"+pct(tdy.tabPct)+"</div></div><div class='kpi'><div class='l'>개별 매매 합계</div><div class='v "+cls(tdy.sumPct)+"'>"+pct(tdy.sumPct)+"</div><div class='sub'>"+(tdy.noTrade?"거래 없음":"거래 "+tdy.trades+"건")+"</div></div><div class='kpi'><div class='l'>계좌 기여 (×"+Math.round(tdy.weight*100)+"%)</div><div class='v "+cls(tdy.accountPct)+"'>"+pct(tdy.accountPct)+"</div></div></div>";
  if(!rows.length)return head+"<p class='note'>오늘은 아직 매매가 없습니다"+(tab==="opening"&&!t.ledgerFound?" (08:56 전이거나 오늘 기록 없음)":"")+".</p></div>";
  var body=rows.map(function(x){
    var buy=x.buyTime?esc(x.buyTime)+" · "+won(x.buyPrice)+(x.buyPriceKind==="예상"?" (예상)":""):"—";
    var sell=x.sellPrice?esc(x.sellTime||"")+" · "+won(x.sellPrice):x.stopPrice?"손절선 "+won(x.stopPrice)+(x.nowPrice?" · 현재 "+won(x.nowPrice):""):x.nowPrice?"현재 "+won(x.nowPrice)+(x.sellTime?" · 매도 "+esc(x.sellTime):""):(x.sellTime?esc(x.sellTime):"");
    return "<tr><td class='nm'><b>"+esc(x.name||x.code)+"</b><div class='sub'>"+esc(x.status||"")+"</div>"+(x.note?"<div class='sub'>"+esc(x.note)+"</div>":"")+"</td>"+
      "<td style='white-space:normal;text-align:left;font-size:12px'>매수 "+buy+(sell?"<br>"+sell:"")+"</td>"+
      "<td><b class='"+cls(x.pnlPct)+"'>"+(x.pnlPct==null?"—":pct(x.pnlPct))+"</b><div class='sub'>"+(x.realized?"확정":(x.pnlPct==null?"":"현재가"))+"</div></td></tr>";
  }).join("");
  if(tab==="soxl"){var u=rows[0]||{},ls=u.lastSession;
    return head+"<div class='kpis'><div class='kpi'><div class='l'>SOXL 상태</div><div class='v' style='font-size:15px'>"+esc(u.status||"")+"</div><div class='sub'>"+esc(u.session||"")+(u.nowPrice?" · 현재 "+won(u.nowPrice):"")+(u.buyPrice?" · 매수 "+won(u.buyPrice):"")+(u.sellPrice?" · 매도 "+won(u.sellPrice):"")+(u.signalClose?" · 판단 종가 "+won(u.signalClose):"")+"</div></div>"+
      "<div class='kpi'><div class='l'>지금 손익 (칸 전액)</div><div class='v "+cls(u.pnlPct)+"'>"+(u.pnlPct==null?"—":pct(u.pnlPct))+"</div></div>"+
      "<div class='kpi'><div class='l'>마지막 확정 세션 "+esc(ls?ls.date:"")+"</div><div class='v "+cls(ls&&ls.pnlPct)+"'>"+(ls&&ls.pnlPct!=null?pct(ls.pnlPct):"—")+"</div><div class='sub'>"+esc(ls?ls.action:"")+" · 칸 전액 기준</div></div></div></div>";}
  return head+"<div class='tw'><table class='board'><thead><tr><th>종목 · 상태</th><th style='text-align:left'>매수 → 매도</th><th>손익(순)</th></tr></thead><tbody>"+body+"</tbody></table></div></div>";
}
async function load(){
  var body=document.getElementById("body");
  try{var t=localStorage.getItem("clTab");if(t)TAB=t}catch(e){}
  try{
    var r=await fetch("/api/claude-lab",{headers:{Accept:"application/json"}});var j=await r.json();
    if(!r.ok||!j.ok)throw new Error(j.error||("HTTP "+r.status));
    J=j;showTab(TAB);
    loadLive();
    setInterval(function(){if(!document.hidden)loadLive()},60000);
  }catch(e){body.innerHTML="<div class='warn'>불러오기 실패: "+esc(e.message||String(e))+"</div>"}
}
load();
</script>
