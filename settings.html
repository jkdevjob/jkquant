<!doctype html>

<title>JK 투자 — 설정</title>
<style>
:root{--bg:#0f1320;--surf:#171c2e;--surf2:#1e2540;--border:#2a3354;--border2:#34406a;--text:#e8ecf7;--dim:#9aa6c9;--faint:#6f7ba0;--accent:#8b8cf0;--green:#36d399;--red:#f87b8c;--gold:#f5c451}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Segoe UI",sans-serif}body{font-size:14px;line-height:1.55}a{color:inherit}button,input,select{font:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}header{border-bottom:1px solid var(--border);background:rgba(15,19,32,.96);position:sticky;top:0;z-index:50;backdrop-filter:blur(10px)}
.htop{height:64px;display:flex;align-items:center;justify-content:space-between}.brand .kicker{font-size:10px;letter-spacing:.12em;color:var(--accent);font-weight:900}.brand h1{font-size:19px;margin:1px 0 0}.brand .v{color:var(--gold)}
.jkmenu{position:relative}.jkmenu-btn{height:38px;width:44px;background:var(--surf2);border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:18px;font-weight:700}
.jkmenu-pop{position:absolute;right:0;top:45px;z-index:100;background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:166px;box-shadow:0 14px 34px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:2px}.jkmenu-pop[hidden]{display:none}
.jkmenu-pop a{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:8px;color:var(--dim);text-decoration:none;font-weight:700}.jkmenu-pop a:hover,.jkmenu-pop a.cur{background:var(--surf2);color:var(--text)}.jkmenu-pop a.cur{color:var(--gold)}.mi{width:18px;text-align:center}
main{padding:22px 0 70px}.hero{margin-bottom:14px}.hero h2{font-size:23px;margin:0 0 3px}.sub{color:var(--dim);font-size:12px}
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}.tab{flex:0 0 auto;border:1px solid var(--border);background:var(--surf);color:var(--dim);border-radius:999px;padding:8px 14px;font-weight:800;font-size:12px}.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.panel{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:16px}.panel h3{font-size:16px;margin:0 0 4px}.note{font-size:11px;color:var(--dim);line-height:1.6}
.alert-list{display:grid;gap:10px;margin-top:12px}.alert-item{border:1px solid var(--border);background:var(--surf2);border-radius:11px;padding:14px}.alert-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.alert-name{font-size:14px;font-weight:900}.alert-desc{font-size:10px;color:var(--dim);margin-top:4px;line-height:1.55}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:9px;font-weight:900;background:#2b3151;color:var(--dim);white-space:nowrap}.badge.on{color:var(--green);background:rgba(54,211,153,.1);border:1px solid rgba(54,211,153,.25)}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.actions button{border:1px solid var(--border2);background:#353765;color:#fff;border-radius:8px;padding:8px 11px;font-size:11px;font-weight:900}.actions button.secondary{background:transparent;color:var(--dim)}.actions button:disabled{opacity:.45}
.help{font-size:10px;color:var(--dim);line-height:1.55;margin-top:10px;padding-top:9px;border-top:1px solid var(--border)}.server{margin-top:10px;font-size:9px;color:var(--faint)}
@media(max-width:560px){.wrap{padding:0 10px}.hero h2{font-size:20px}.panel{padding:12px}.alert-top{gap:8px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions button:first-child:last-child{grid-column:1/-1}}
</style>
