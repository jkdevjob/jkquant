name: 수영대회 매일 수집

on:
  schedule:
    - cron: "0 23 * * *" # 한국시간 매일 08:00
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect_swim.py"
      - ".github/workflows/swim-collect.yml"
  pull_request:
    paths:
      - "scripts/collect_swim.py"
      - "scripts/test_swim_collect.py"
      - ".github/workflows/swim-collect.yml"
      - "swim.html"

permissions:
  contents: write

concurrency:
  group: swim-competition-collector
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: pip install "requests>=2.32,<3" "beautifulsoup4>=4.12,<5"
      - name: Validate collector
        run: |
          python -m py_compile scripts/collect_swim.py scripts/test_swim_collect.py
          python -m unittest discover -s scripts -p test_swim_collect.py -v
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          soup=BeautifulSoup(Path("swim.html").read_text(encoding="utf-8"),"html.parser")
          js="\n".join(x.get_text() for x in soup.find_all("script") if not x.get("src"))
          Path("/tmp/swim-page.js").write_text(js,encoding="utf-8")
          PY
          node --check /tmp/swim-page.js
      - name: Collect competitions
        if: github.event_name != 'pull_request'
        run: python scripts/collect_swim.py
      - name: Commit upserted data
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/swim/competitions.json data/swim/changes.json; then
            echo "No new data"
            exit 0
          fi
          git config user.name "jkquant-swim-bot"
          git config user.email "jkquant-swim-bot@users.noreply.github.com"
          git add data/swim/competitions.json data/swim/changes.json
          git commit -m "data: refresh swimming competitions [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
