name: One-off Telegram Job Alert Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/job-alert-smoke-test.yml"

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Telegram smoke test
        env:
          AUTOTRADE_KEY: ${{ secrets.AUTOTRADE_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = "https://jkquant.pages.dev/api/job-alert"
          payload = {
              "text": "✅ <b>jkquant 공고 알림 테스트</b>\n\n<b><a href=\"https://www.jobkorea.co.kr/\">[테스트] 공고명 링크 클릭 테스트</a></b>\n공고 제목을 누르면 해당 링크로 이동하도록 변경했습니다.",
              "count": 1,
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={
                  "content-type": "application/json",
                  "x-monitor-key": os.environ["AUTOTRADE_KEY"],
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              body = response.read().decode("utf-8")
              print(body)
              data = json.loads(body)
              if not data.get("ok"):
                  raise SystemExit("Telegram smoke test failed: " + body)
          PY
