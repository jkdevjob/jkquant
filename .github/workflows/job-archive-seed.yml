name: JOB Archive Seed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/job_alert.py"

permissions:
  contents: write

concurrency:
  group: job-archive-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ddgs>=9,<10" "requests>=2.32,<3" "beautifulsoup4>=4.12,<5"
      - name: Validate JOB collector syntax
        run: |
          python -m py_compile scripts/job_alert.py scripts/test_job_alert_logic.py
          python scripts/test_job_alert_logic.py
      - name: Rebuild 180-day archive and long-term history
        env:
          FORCE_JOB_ALERT: "1"
          JOB_ALERT_ARCHIVE_ONLY: "1"
        run: python scripts/job_alert.py
      - name: Publish archive
        shell: bash
        run: |
          set -euo pipefail
          test -f data/job_archive.json
          test -f data/job_history.json
          git config user.name "jkquant-job-bot"
          git config user.email "jkquant-job-bot@users.noreply.github.com"
          git add data/job_archive.json data/job_history.json
          git commit -m "data: rebuild job archive and history" || exit 0
          # 데이터 파일은 이 실행 결과가 정답이다. 최신 main의 코드 변경을
          # 다시 받아온 뒤 재수집 결과 파일만 덮어써 충돌 없이 커밋한다.
          cp data/job_archive.json /tmp/job_archive.json
          cp data/job_history.json /tmp/job_history.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/job_archive.json data/job_archive.json
          cp /tmp/job_history.json data/job_history.json
          git add data/job_archive.json data/job_history.json
          git commit -m "data: rebuild job archive and history" || exit 0
          git push origin HEAD:main
