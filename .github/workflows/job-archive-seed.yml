name: JOB Archive Seed

on:
  push:
    paths:
      - ".github/workflows/job-archive-seed.yml"

permissions:
  contents: write

concurrency:
  group: job-archive-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ddgs>=9,<10" "requests>=2.32,<3" "beautifulsoup4>=4.12,<5"

      - name: Collect last 30 days
        env:
          FORCE_JOB_ALERT: "1"
          JOB_ALERT_ARCHIVE_ONLY: "1"
        run: python scripts/job_alert.py

      - name: Publish archive
        shell: bash
        run: |
          set -euo pipefail
          test -f data/job_archive.json
          git config user.name "jkquant-job-bot"
          git config user.email "jkquant-job-bot@users.noreply.github.com"
          git add data/job_archive.json
          git commit -m "data: seed 30-day job archive [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
