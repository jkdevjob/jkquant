name: 단타 야간 자동연구

# 시초가 + 데이트레이딩 + 비트코인 + SOXL + KIS VTS 체결자료를 하루 한 번 통합 분석한다.
# 라이브 전략은 자동으로 바꾸지 않고, 충분한 표본이 쌓였을 때 검토 후보만 기록/알림한다.

on:
  schedule:
    - cron: "10 10 * * *"    # 19:10 KST · 비트코인은 주말에도 거래
    - cron: "10 11 * * *"    # 20:10 KST backup
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nightly-scalping-research.yml"
      - "scripts/nightly_scalping_research.py"
      - "functions/api/nightly-research-summary.js"
      - "scripts/backtest_soxl_intraday.py"

permissions:
  contents: write

concurrency:
  group: nightly-scalping-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 데이터 브랜치 체크아웃
        uses: actions/checkout@v4
        with:
          ref: scalping-data
          fetch-depth: 0

      - name: 최신 연구 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          path: .app
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 시초가 + 데이트레이딩 + 비트코인 + SOXL + VTS 통합 연구
        env:
          KEY: ${{ secrets.AUTOTRADE_KEY }}
          BASE: https://jkquant.pages.dev
        shell: bash
        run: |
          set -e
          DATE=$(TZ=Asia/Seoul date +%F)
          python .app/scripts/nightly_scalping_research.py

          REPORT="data/nightly-research/latest.json"
          if [ -n "$KEY" ] && [ -f "$REPORT" ]; then
            STATUS=$(curl -sS --max-time 30 -o auto-promotion-response.json -w '%{http_code}'               -X POST -H "x-monitor-key: $KEY" -H "content-type: application/json"               --data-binary @"$REPORT" "$BASE/api/scalping-auto-promotion" || true)
            echo "자동 메인승격 HTTP $STATUS: $(cat auto-promotion-response.json 2>/dev/null || true)"
            if [ "$STATUS" != "200" ]; then
              echo "::warning::자동승격 API 호출 실패 — 연구결과/라이프사이클 저장은 계속 진행"
            fi
          fi

          MARK="data/nightly-research/$DATE-summary-sent.json"
          if [ -n "$KEY" ] && [ -f "$REPORT" ] && [ ! -f "$MARK" ]; then
            SENT=0
            for attempt in $(seq 1 12); do
              STATUS=$(curl -sS --max-time 30 -o nightly-summary-response.json -w '%{http_code}'                 -X POST -H "x-monitor-key: $KEY" -H "content-type: application/json"                 --data-binary @"$REPORT" "$BASE/api/nightly-research-summary" || true)
              echo "Telegram 야간연구 attempt $attempt HTTP $STATUS: $(cat nightly-summary-response.json 2>/dev/null || true)"
              if [ "$STATUS" = "200" ] && jq -e '.ok == true' nightly-summary-response.json >/dev/null 2>&1; then
                jq -n --arg date "$DATE" --arg sentAt "$(TZ=Asia/Seoul date --iso-8601=seconds)"                   '{date:$date,sentAt:$sentAt,source:"nightly-scalping-research"}' > "$MARK"
                SENT=1
                break
              fi
              sleep 10
            done
            [ "$SENT" = "1" ] || echo "Telegram 야간연구 전송 보류 — 20:10 backup이 marker 없이 재시도"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nightly-research
          if git diff --cached --quiet; then
            echo "야간 연구결과 변경 없음"
            exit 0
          fi
          git commit -m "data: nightly scalping research $DATE [skip ci]"
          git pull --rebase origin scalping-data
          PUSH_OK=0
          for attempt in $(seq 1 6); do
            if git push origin scalping-data; then
              PUSH_OK=1
              break
            fi
            echo "scalping-data push 경합 — 재동기화 후 재시도 $attempt/6"
            if ! git pull --rebase origin scalping-data; then
              git rebase --abort >/dev/null 2>&1 || true
            fi
            sleep $((attempt * 2))
          done
          [ "$PUSH_OK" = "1" ] || { echo "scalping-data push 6회 실패"; exit 1; }
