name: 인스타 참고 자료 모으기

# 은퇴노트·매니악 브리핑 표지·내용 개선용 참고 자료(해시태그 인기 게시물 · 참고 계정 반응)를 공식 그래프 API 로 모아
# reel/trends/ig_refs/<날짜>.json 으로 이 브랜치에 커밋한다. 설정(reel/trends/ig_refs.config.json)을 바꿔 푸시하면 돈다.
# 비밀값: IG_ACCESS_TOKEN, IG_USER_ID (은퇴노트 키). 패턴 참고용 — 남의 문구·화면은 쓰지 않는다.

on:
  push:
    branches: [claude/instagram-reel-video-creation-wl16ee]
    paths:
      - "reel/trends/ig_refs.config.json"
      - "reel/trends/ig-refs.mjs"
      - ".github/workflows/ig-refs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ig-refs
  cancel-in-progress: true

env:
  BRANCH: claude/instagram-reel-video-creation-wl16ee

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            reel/trends/ig-refs.mjs
            reel/trends/ig_refs.config.json
            reel/trends/ig_refs/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 모으기
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node reel/trends/ig-refs.mjs
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reel/trends/ig_refs/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "인스타 참고 자료 모음"
          for i in 1 2 3 4 5; do
            if git push -q origin "HEAD:$BRANCH"; then echo "푸시 완료"; exit 0; fi
            cp -r reel/trends/ig_refs "$RUNNER_TEMP/ig_refs"
            git fetch -q --depth=1 --filter=blob:none origin "$BRANCH"
            git reset -q --hard FETCH_HEAD
            mkdir -p reel/trends/ig_refs && cp -r "$RUNNER_TEMP/ig_refs/." reel/trends/ig_refs/
            git add reel/trends/ig_refs/
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "인스타 참고 자료 모음"
            sleep $(( i * 3 ))
          done
          exit 1
