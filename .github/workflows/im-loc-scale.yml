name: Infinite Buy LOC scale-normalized research

on:
  push:
    branches:
      - "research/im-loc-opt-20260929"
    paths:
      - "scripts/research_im_loc_scale.cjs"
      - "scripts/research_im_loc_scale_append.inc.js"
      - ".github/workflows/im-loc-scale.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run capital-normalized LOC research
        shell: bash
        run: |
          mkdir -p research-output-scale
          set +e
          set -o pipefail
          node scripts/research_im_loc_scale.cjs 2>&1 | tee research-output-scale/run.log
          STATUS=$?
          echo "$STATUS" > research-output-scale/exit-code.txt
          exit "$STATUS"
      - name: Persist output
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research-output-scale
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist normalized LOC output [skip ci]"
          git push origin HEAD:"research/im-loc-opt-20260929"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: im-loc-scale-result
          path: research-output-scale/
