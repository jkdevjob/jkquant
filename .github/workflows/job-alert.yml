name: Daejeon Sejong Java AI Job Alert

on:
  schedule:
    # GitHub Actions cron is UTC. 00:00 UTC = 09:00 KST.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-alert-telegram
  cancel-in-progress: false

jobs:
  search-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore seen-job cache
        uses: actions/cache@v4
        with:
          path: .job-alert-cache
          key: job-alert-seen-${{ github.run_id }}
          restore-keys: |
            job-alert-seen-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ddgs>=9,<10"

      - name: Search jobs and send Telegram
        env:
          AUTOTRADE_KEY: ${{ secrets.AUTOTRADE_KEY }}
          JKQUANT_BASE: https://jkquant.pages.dev
        run: python scripts/job_alert.py
