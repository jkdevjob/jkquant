name: Daejeon Sejong Java AI Job Alert

on:
  schedule:
    # GitHub Actions는 정각(00분)에 지연이 커질 수 있어 08:55 KST에 미리 기동한다.
    # 23:55 UTC = 다음 날 08:55 KST.
    - cron: "55 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-alert-telegram
  cancel-in-progress: false

jobs:
  search-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore seen-job cache
        uses: actions/cache@v4
        with:
          path: .job-alert-cache
          key: job-alert-seen-${{ github.run_id }}
          restore-keys: |
            job-alert-seen-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ddgs>=9,<10"

      - name: Wait until 09:00 KST
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          while true; do
            raw=$(TZ=Asia/Seoul date +%H%M)
            hm=$((10#$raw))
            if [ "$hm" -ge 900 ]; then
              break
            fi
            echo "[$(TZ=Asia/Seoul date '+%F %T KST')] 09:00까지 대기"
            sleep 15
          done

      - name: Search jobs and send Telegram
        env:
          AUTOTRADE_KEY: ${{ secrets.AUTOTRADE_KEY }}
          JKQUANT_BASE: https://jkquant.pages.dev
        run: python scripts/job_alert.py
