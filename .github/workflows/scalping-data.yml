name: 단타 분봉 자동수집

# Cloudflare Pages Functions 자체에는 cron이 없어서 GitHub Actions가 장 마감 뒤
# 오늘 거래대금 상위 100종목의 09:00~09:30 KIS 1분봉을 수집한다.
# 데이터는 scalping-data 브랜치에만 쌓고, 일별 universe rank도 함께 저장한다.
# 따라서 나중에 같은 원본으로 Top50 vs Top100을 정확히 비교할 수 있다.
on:
  schedule:
    - cron: "10 7 * * 1-5"   # 16:10 KST (월~금)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/scalping-data.yml"]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 데이터 브랜치 체크아웃
        uses: actions/checkout@v4
        with:
          ref: scalping-data
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 오늘 Top100 09:00~09:30 분봉 수집
        env:
          JKQ_BASE_URL: https://jkquant.pages.dev
          JKQ_UNIVERSE_LIMIT: "100"
        run: python scripts/collect_scalping_data.py

      - name: 데이터 저장
        run: |
          if git diff --quiet -- data/scalping && [ -z "$(git status --porcelain data/scalping)" ]; then
            echo "새 데이터 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scalping
          git commit -m "data: scalping $(TZ=Asia/Seoul date +%F) [skip ci]"
          git pull --rebase origin scalping-data
          git push origin scalping-data
