name: 단타 분봉 자동수집

# 매 영업일 장 마감 뒤 Top100의 09:00~09:30 KIS 1분봉을 저장한다.
# 원본 데이터는 scalping-data 브랜치에 날짜별로 누적하고,
# 같은 원본으로 시초가 눌림→재돌파 전략의 누적 연구 백테스트도 매일 갱신한다.
#
# main 브랜치의 최신 수집/백테스트 스크립트를 별도 체크아웃해 실행하므로
# scalping-data 브랜치에 코드 파일을 복제할 필요가 없다.

on:
  schedule:
    - cron: "10 7 * * 1-5"   # 16:10 KST (월~금)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scalping-data.yml"
      - "scripts/collect_scalping_data.py"
      - "scripts/backtest_opening_rebreak.py"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 데이터 브랜치 체크아웃
        uses: actions/checkout@v4
        with:
          ref: scalping-data
          fetch-depth: 0

      - name: 최신 연구 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          path: .app
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 오늘 Top100 09:00~09:30 분봉 수집
        env:
          JKQ_BASE_URL: https://jkquant.pages.dev
          JKQ_UNIVERSE_LIMIT: "100"
        run: python .app/scripts/collect_scalping_data.py

      - name: 누적 시초가 연구 백테스트
        run: python .app/scripts/backtest_opening_rebreak.py

      - name: 데이터와 연구결과 저장
        run: |
          if git diff --quiet -- data/scalping data/opening-research && [ -z "$(git status --porcelain data/scalping data/opening-research)" ]; then
            echo "새 데이터/연구결과 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scalping data/opening-research
          git commit -m "data: scalping research $(TZ=Asia/Seoul date +%F) [skip ci]"
          git pull --rebase origin scalping-data
          git push origin scalping-data
