name: Telegram New Room Test

on:
  push:
    paths:
      - ".github/workflows/telegram-new-room-test.yml"

permissions:
  contents: read

jobs:
  test-room:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Pages deploy and send test
        env:
          AUTOTRADE_KEY: ${{ secrets.AUTOTRADE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"action":"test-latest-group","text":"✅ JKQuant 새 프로젝트방 연결 테스트입니다. 이 메시지가 보이면 연결 성공입니다."}'
          for i in {1..12}; do
            echo "attempt $i"
            out=$(curl -sS --max-time 20               -X POST               -H "x-monitor-key: $AUTOTRADE_KEY"               -H "content-type: application/json"               --data-binary "$payload"               -w "\n%{http_code}"               https://jkquant.pages.dev/api/job-alert || true)
            body=$(printf "%s" "$out" | head -n -1)
            code=$(printf "%s" "$out" | tail -n 1)
            echo "HTTP $code $body"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          exit 1
