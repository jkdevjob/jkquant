name: 검증

# 배포 전에 반드시 초록이어야 한다.
# PR 작업 중 매 커밋마다 검증을 재실행하지 않는다.
# 완성된 일반 PR을 처음 열거나 Draft를 Ready for review로 전환할 때 1회 검증하고,
# main 반영 후에는 최종 상태를 다시 1회 검증한다. 필요할 때만 수동 실행할 수 있다.
#
# 검사 단계 목록은 .github/check-steps.yml 한 곳에 있다 — 로컬(scripts/check-before-push.cjs)과 여기 조각 4개가
# 같은 목록을 같은 명령으로 돈다(같은 걸 두 군데서 세지 않는다). 조각 배정은 단계의 minutes 힌트로 무거운 것부터
# 가장 덜 찬 조각에 넣는다(node scripts/check-before-push.cjs --list). 필수 상태 검사 이름은 그대로 'check'.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: 검사 조각 ${{ matrix.part }}/4
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 검사 단계 (.github/check-steps.yml · 조각 ${{ matrix.part }}/4)
        run: node scripts/check-before-push.cjs --shard=${{ matrix.part }}/4

  # 조각이 하나라도 빨간불이면 빨간불 — 브랜치 보호의 필수 검사 이름 'check' 를 유지한다.
  check:
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - name: 조각 4개 결과 합치기
        run: |
          echo "조각 결과: ${{ needs.shard.result }}"
          test "${{ needs.shard.result }}" = "success"
