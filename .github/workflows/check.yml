name: 검증

# 배포 전에 반드시 초록이어야 한다. 회귀테스트 헤더의 규약("수정할 때마다 ALL PASS여야 배포")을
# 사람 기억에 맡기지 않고 여기서 강제한다.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: 연구 Python 문법 검사
        run: |
          python -m py_compile scripts/backtest_opening_rebreak.py
          python -m py_compile scripts/backtest_daytrading.py
          python -m py_compile scripts/collect_daytrading_data.py
          python -m py_compile scripts/analyze_vts_reconcile.py

      - name: 연구 서버 JS 문법 검사
        run: |
          node --input-type=module --check < functions/api/_daytrading.js
          node --input-type=module --check < functions/api/daytrading-monitor.js
          node --input-type=module --check < functions/api/daytrading-summary.js
          node --input-type=module --check < functions/api/vts-reconcile.js
          node --input-type=module --check < functions/api/vts-research.js
          node --input-type=module --check < functions/api/vts-summary.js

      - name: VTS 대조는 읽기전용인지 검사
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const v=fs.readFileSync('functions/api/vts-reconcile.js','utf8');
          const k=fs.readFileSync('functions/api/kis.js','utf8');
          const bad=[
            ['/api/kis?op=order&','주문 API 호출'],
            ['method:"POST"','POST 호출'],
            ["method:'POST'",'POST 호출'],
            ['env=real','실전 환경 조회']
          ];
          let fail=0;
          for(const [needle,label] of bad){
            if(v.includes(needle)){ console.error('✗ vts-reconcile: '+label+' 발견: '+needle); fail++; }
          }
          if(!/if\s*\(isReal\(env\)\)\s*return json\(\{ error: "orders 조회는 이 화면에서 KIS 모의투자\(vts\)만 허용합니다\."/.test(k)){
            console.error('✗ KIS orders 조회의 real 차단 가드가 없습니다.'); fail++;
          }
          if(fail)process.exit(1);
          console.log('✓ VTS 대조 경로 read-only / VTS-only');
          NODE

      - name: 단타 KIS는 VTS 전용인지 검사
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('scalping.html','utf8');
          let fail=0;
          const must=[
            ["body:JSON.stringify({env:'vts'",'주문 body에 env=vts 명시'],
            ["if(KIScfg.env!=='vts')",'실계좌 UI 하드블록'],
            ["/api/kis?op=config&env=vts&market=kr",'VTS config 명시'],
            ["/api/kis?op=balance&env=vts&market=kr",'VTS balance 명시']
          ];
          for(const [needle,label] of must){
            if(!s.includes(needle)){ console.error('✗ '+label+' 없음'); fail++; }
          }
          if(fail)process.exit(1);
          console.log('✓ scalping KIS path is explicitly VTS-only');
          NODE

      - name: 전략 SSOT 체크 (문서 기준값·규약 불변식)
        run: |
          node -e "
            const r=require('./strategy-check.js').run();
            r.results.filter(x=>!x.pass).forEach(x=>console.log('  ✗ '+x.n+(x.d?' — '+x.d:'')));
            console.log(r.pass+'/'+r.total+' PASS');
            process.exit(r.fail?1:0);
          "

      - name: 회귀 테스트 (엔진 차분 + UI 배선 + DOM 구조 + 모의 장부)
        run: node regression-check.js index.html backtest.html testdata
