      - name: SOXL 단타 연구 불변식 검사
        run: |
          python - <<'PY'
          from scripts.backtest_soxl_intraday import Params, evaluate_day

          def bar(hm,o,h,l,c,v):
              hh=hm//100
              mm=hm%100
              return {"tEt":f"2026-09-01T{hh:02d}:{mm:02d}:00-04:00","o":o,"h":h,"l":l,"c":c,"v":v}

          bars=[
              bar(930,100,101,99.5,100.2,100),
              bar(935,100.2,101.5,100,101.0,100),
              bar(940,101.0,102.0,100.8,101.5,100),
              bar(945,101.5,103.5,101.4,103.0,220),
              bar(950,103.2,106.0,101.0,103.5,180),
          ]
          hm=955
          while len(bars)<78:
              bars.append(bar(hm,103.5,103.7,103.2,103.5,100))
              mm=hm%100+5
              hh=hm//100
              if mm>=60:
                  hh+=1
                  mm-=60
              hm=hh*100+mm

          day={"sessionDateEt":"2026-09-01","bars":bars}
          t,d=evaluate_day(day,Params("baseline"))
          assert t is not None,(t,d)
          assert t["signalTimeEt"]=="09:45",t
          assert t["entryTimeEt"]=="09:50",t
          assert t["reason"]=="stop_same_bar",t
          assert t["pnlPct"] < -1.2,t
          assert d["action"]=="trade",d
          print("✓ SOXL next-bar entry / same-bar stop-first / evidence")
          PY

