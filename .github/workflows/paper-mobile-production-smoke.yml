name: Production paper mobile cards smoke
on:
  pull_request:
    paths:
      - scripts/paper-mobile-production-smoke.cjs
      - .github/workflows/paper-mobile-production-smoke.yml
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify deployed production UI
        run: node scripts/paper-mobile-production-smoke.cjs
