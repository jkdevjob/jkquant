name: 은퇴노트 인스타 자동 발행

# 은퇴노트 릴스를 인스타그램 API 로 올린다(유튜브는 당분간 Metricool — 유튜브 API 는 구글 감사 전엔 비공개로 잠김).
# 이 파일은 main 이 아니라 claude/instagram-reel-video-creation-wl16ee 브랜치에 있다.
# 매일 새벽 영상 루틴(Claude)이 그날 영상을 큐(reel/queue/queue.json)에 넣고 이 브랜치에 푸시하면 실행되고,
# 작업들이 한국 09:00 · 12:00 · 18:00 까지 기다렸다가 그때 올릴 것만 올린다(작업 하나는 6시간 제한이라 15시 대기 작업을 끼움).
# GitHub 정해진 시각 실행은 이 저장소에서 4~9시간 늦거나 빠진 적이 있어(main 의 swim-collect.yml 기록) 푸시로 깨운다.
# 새 푸시가 오면 앞 실행은 취소되고 새 실행이 이어받는다(각 작업이 게시 직전에 최신 큐를 다시 받는다).
# 같은 영상을 두 번 올리지 않게: 기록(published.json)을 브랜치에 커밋(봇 커밋은 이 workflow 를 다시 깨우지 않음),
# 업로더가 올리기 전에 계정 최근 게시물의 캡션 첫 줄을 한 번 더 확인한다.
# 비밀값: IG_ACCESS_TOKEN, IG_USER_ID, (유튜브 감사 뒤) YT_CLIENT_ID·YT_CLIENT_SECRET·YT_REFRESH_TOKEN — GOOGLE_* 는 블로그용이라 쓰지 않음 (Settings → Secrets and variables → Actions). 발행을 끄려면 publish.config.json 의 enabled 를 false.

on:
  push:
    branches: [claude/instagram-reel-video-creation-wl16ee]
    paths:
      - "reel/queue/queue.json"
      - "reel/queue/publish.config.json"
      - "reel/publish-social.mjs"
      - ".github/workflows/retire-note-publish.yml"
  workflow_dispatch:
    inputs:
      dry:
        description: "점검만(키가 통하는지·지금 올릴 것만 확인, 올리지 않음)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: retire-note-publish
  cancel-in-progress: true

env:
  BRANCH: claude/instagram-reel-video-creation-wl16ee

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            reel/publish-social.mjs
            reel/queue/queue.json
            reel/queue/publish.config.json
            reel/queue/published.json
            reel/queue/last_run.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 점검
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: cd reel && node publish-social.mjs --dry
      - name: 유튜브 키 점검(올리지 않음)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: cd reel && node publish-social.mjs --dry --only yt | sed -n 1,2p || true

  slot-0900:
    needs: check
    if: ${{ !cancelled() && !inputs.dry }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SLOT: "09:00"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            reel/publish-social.mjs
            reel/queue/queue.json
            reel/queue/publish.config.json
            reel/queue/published.json
            reel/queue/last_run.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 게시 시각까지 기다리기
        run: |
          target=$(TZ=Asia/Seoul date -d "today $SLOT" +%s)
          now=$(date +%s)
          if [ "$target" -gt "$now" ]; then
            echo "한국 $SLOT 까지 $(( (target - now) / 60 ))분 기다림"
            sleep $(( target - now ))
          else
            echo "한국 $SLOT 이 이미 지남 — 바로 확인"
          fi
      - name: 최신 큐 받기
        run: |
          git fetch -q --depth=1 --filter=blob:none origin "$BRANCH"
          git reset -q --hard FETCH_HEAD
          git log -1 --format='큐 커밋 %h %s'
      - name: 게시
        if: ${{ env.SLOT != '15:00' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: cd reel && node publish-social.mjs
      - name: 기록 저장
        if: ${{ !cancelled() && env.SLOT != '15:00' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files="reel/queue/published.json reel/queue/last_run.txt"
          for f in $files; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "기록 변경 없음"; exit 0; fi
          git commit -q -m "인스타 자동 발행 기록 ($SLOT)"
          for i in 1 2 3 4 5; do
            if git push -q origin "HEAD:$BRANCH"; then echo "기록 푸시 완료"; exit 0; fi
            # 그사이 루틴이 브랜치에 푸시했으면 최신 위에 기록 두 파일만 다시 얹는다(기록은 이 workflow 만 쓴다)
            for f in $files; do if [ -f "$f" ]; then cp "$f" "$RUNNER_TEMP/$(basename "$f")"; fi; done
            git fetch -q --depth=1 --filter=blob:none origin "$BRANCH"
            git reset -q --hard FETCH_HEAD
            for f in $files; do if [ -f "$RUNNER_TEMP/$(basename "$f")" ]; then cp "$RUNNER_TEMP/$(basename "$f")" "$f"; git add "$f"; fi; done
            if git diff --cached --quiet; then echo "기록 변경 없음"; exit 0; fi
            git commit -q -m "인스타 자동 발행 기록 ($SLOT)"
            sleep $(( i * 3 ))
          done
          echo "기록 푸시 5회 실패"; exit 1

