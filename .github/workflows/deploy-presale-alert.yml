name: 신규분양 웹푸시 Worker 배포

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/presale-alert/**"
      - ".github/workflows/deploy-presale-alert.yml"

permissions:
  contents: write

concurrency:
  group: deploy-presale-alert
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cloudflare 배포 자격증명 확인
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          [ -n "$CF_TOKEN" ] || { echo "CLOUDFLARE_API_TOKEN GitHub Secret 없음"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "CLOUDFLARE_ACCOUNT_ID GitHub Secret 없음"; exit 1; }

      - name: 신규분양 평가 로직 단위테스트
        run: node --test tests/presale-score.test.mjs tests/ipo-score.test.mjs tests/scalping-push.test.mjs tests/approval-notification.test.mjs

      - name: Worker + Cron + Durable Object 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: npx --yes wrangler@4 deploy --config worker/presale-alert/wrangler.jsonc

      - name: Pages 서버와 같은 단타 신호 인증키를 Worker Secret으로 설정
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MONITOR_KEY: ${{ secrets.AUTOTRADE_KEY }}
        shell: bash
        run: |
          [ -n "$MONITOR_KEY" ] || { echo "AUTOTRADE_KEY GitHub Secret 없음"; exit 1; }
          printf '%s' "$MONITOR_KEY" | npx --yes wrangler@4 secret put MONITOR_KEY --config worker/presale-alert/wrangler.jsonc

      - name: 내 Gmail로 승인 메일 발송 설정 (선택)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GMAIL_SCRIPT_URL: ${{ secrets.GMAIL_SCRIPT_URL }}
          GMAIL_SCRIPT_SECRET: ${{ secrets.GMAIL_SCRIPT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GMAIL_SCRIPT_URL}" ] || [ -z "${GMAIL_SCRIPT_SECRET}" ]; then
            echo "::notice::개인 Gmail 승인메일 비활성: GMAIL_SCRIPT_URL 및 GMAIL_SCRIPT_SECRET 미등록"
            exit 0
          fi
          [[ "${GMAIL_SCRIPT_URL}" =~ ^https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec$ ]] || {
            echo "::error::GMAIL_SCRIPT_URL은 Google Apps Script /exec URL이어야 합니다"; exit 1;
          }
          if [ "${#GMAIL_SCRIPT_SECRET}" -lt 32 ]; then
            echo "::error::GMAIL_SCRIPT_SECRET은 최소 32자여야 합니다"; exit 1
          fi
          printf '%s' "${GMAIL_SCRIPT_URL}" | npx --yes wrangler@4 secret put GMAIL_SCRIPT_URL --config worker/presale-alert/wrangler.jsonc
          printf '%s' "${GMAIL_SCRIPT_SECRET}" | npx --yes wrangler@4 secret put GMAIL_SCRIPT_SECRET --config worker/presale-alert/wrangler.jsonc

      - name: 승인 이메일 발신 설정 (GitHub Secrets에 있을 때만)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APPROVAL_FROM_EMAIL: ${{ secrets.APPROVAL_FROM_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY}" ] || [ -z "${APPROVAL_FROM_EMAIL}" ]; then
            echo "::warning::승인 이메일 발송 준비 미완료: GitHub Secrets RESEND_API_KEY, APPROVAL_FROM_EMAIL 설정 필요"
            exit 0
          fi
          printf '%s' "${RESEND_API_KEY}" | npx --yes wrangler@4 secret put RESEND_API_KEY --config worker/presale-alert/wrangler.jsonc
          printf '%s' "${APPROVAL_FROM_EMAIL}" | npx --yes wrangler@4 secret put APPROVAL_FROM_EMAIL --config worker/presale-alert/wrangler.jsonc

      - name: workers.dev 주소를 웹앱 설정에 기록
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          SUBDOMAIN="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python -c 'import json,sys; print(json.load(sys.stdin)["result"]["subdomain"])')"
          URL="https://jkquant-presale-alert.${SUBDOMAIN}.workers.dev"
          python - "$URL" <<'PY'
          import json,sys
          p="data/realestate/gpt/push-config.json"
          url=sys.argv[1]
          with open(p,"w",encoding="utf-8") as f:
              json.dump({"workerUrl":url,"updatedBy":"deploy-presale-alert"},f,ensure_ascii=False,indent=2)
              f.write("\n")
          PY
          if git diff --quiet -- data/realestate/gpt/push-config.json; then
            echo "push-config 변경 없음: $URL"
            exit 0
          fi
          git config user.name "jkquant-presale-push-bot"
          git config user.email "jkquant-presale-push-bot@users.noreply.github.com"
          git add data/realestate/gpt/push-config.json
          git commit -m "config: 신규분양 웹푸시 Worker 주소 갱신"
          git pull --rebase origin main
          git push origin HEAD:main
