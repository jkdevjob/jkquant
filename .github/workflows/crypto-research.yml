name: 비트코인 단타 연구 데이터

# Upbit KRW-BTC 5분봉 원본은 UTC 일자 단위로 저장한다.
# 연구 백테스트는 인접 UTC 파일을 합쳐 KST 00:00~23:55 달력일로 재구성한다.
# 최초 실행은 최근 365일을 백필하고, 이후에는 최근 2일을 겹쳐 받아 누락을 방지한다.
# 데이터와 연구 결과는 scalping-data 브랜치에만 누적한다.

on:
  schedule:
    - cron: "20 0 * * *"   # 09:20 KST, 전일 확정 연구 1회 (장중 모의매매는 Worker 담당)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/crypto-research.yml"
      - "scripts/collect_crypto_data.py"
      - "scripts/backtest_crypto_orb.py"
      - "scripts/build_scalping_trend.py"

permissions:
  contents: write

concurrency:
  group: crypto-research-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 데이터 브랜치 체크아웃
        uses: actions/checkout@v4
        with:
          ref: scalping-data
          fetch-depth: 0

      - name: 최신 연구 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          path: .app
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: KRW-BTC 5분봉 수집
        env:
          JKQ_CRYPTO_MARKET: KRW-BTC
          JKQ_CRYPTO_UNIT: "5"
          JKQ_CRYPTO_BACKFILL_DAYS: "365"
        run: python .app/scripts/collect_crypto_data.py

      - name: 00시 ORB · 22시 신규진입 누적 연구 백테스트
        run: |
          python .app/scripts/backtest_crypto_orb.py
          python .app/scripts/build_scalping_trend.py

      # 사용자 Telegram은 GitHub schedule에서 보내지 않는다.
      # BTC 장중 신호와 00:05 KST 마감 ⑤⑥은 global-intraday Worker가 담당한다.

      - name: 데이터와 연구결과 저장
        run: |
          if git diff --quiet -- data/crypto data/crypto-research data/scalping-trend && [ -z "$(git status --porcelain data/crypto data/crypto-research data/scalping-trend)" ]; then
            echo "새 비트코인 데이터/연구결과 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto data/crypto-research data/scalping-trend
          git commit -m "data: bitcoin scalping research $(TZ=Asia/Seoul date +%F) [skip ci]"
          git pull --rebase origin scalping-data
          git push origin scalping-data
