name: 비트코인 단타 연구 데이터

# Upbit KRW-BTC 5분봉을 UTC 일자 단위로 저장한다.
# UTC 00:00 = KST 09:00 이므로 파일 한 개가 연구용 09:00 세션 경계와 정확히 맞는다.
# 최초 실행은 D-3 설계기간(2023-07~)을 덮도록 최근 1200일을 백필하고, 이후에는 최근 2일을 겹쳐 받아 누락을 방지한다.
# 데이터와 연구 결과는 scalping-data 브랜치에만 누적한다.

on:
  schedule:
    - cron: "20 0 * * *"   # 09:20 KST, 전 UTC 일자는 완전히 확정된 뒤
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/crypto-research.yml"
      - "scripts/collect_crypto_data.py"
      - "scripts/backtest_crypto_orb.py"

permissions:
  contents: write

concurrency:
  group: crypto-research-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 데이터 브랜치 체크아웃
        uses: actions/checkout@v4
        with:
          ref: scalping-data
          fetch-depth: 0

      - name: 최신 연구 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          path: .app
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: KRW-BTC 5분봉 수집
        env:
          JKQ_CRYPTO_MARKET: KRW-BTC
          JKQ_CRYPTO_UNIT: "5"
          JKQ_CRYPTO_BACKFILL_DAYS: "1200"
        run: python .app/scripts/collect_crypto_data.py

      - name: 09시 ORB 누적 연구 백테스트
        run: python .app/scripts/backtest_crypto_orb.py

      - name: ⑤ 매매이력 + ⑥ 검증분석 Telegram
        env:
          KEY: ${{ secrets.AUTOTRADE_KEY }}
          BASE: https://jkquant.pages.dev
        shell: bash
        run: |
          set -e
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "코드 push 실행 — Pages 배포와 경합하지 않도록 Telegram 발송은 다음 정기/수동 실행에서 수행"
            exit 0
          fi
          REPORT="data/crypto-research/latest.json"
          [ -f "$REPORT" ] || { echo "BTC 연구 리포트 없음"; exit 0; }
          DATE=$(jq -r '.to // empty' "$REPORT")
          [ -n "$DATE" ] || { echo "BTC 리포트 기준일 없음"; exit 0; }
          MARK="data/crypto-research/$DATE-summary-sent.json"
          if [ -f "$MARK" ]; then
            echo "$DATE BTC Telegram 이미 전송됨"
            exit 0
          fi
          [ -n "$KEY" ] || { echo "AUTOTRADE_KEY GitHub Secret 없음"; exit 1; }
          SENT=0
          for attempt in $(seq 1 6); do
            STATUS=$(curl -sS --max-time 30 -o crypto-summary-response.json -w '%{http_code}' \
              -X POST -H "x-monitor-key: $KEY" -H "content-type: application/json" \
              --data-binary @"$REPORT" "$BASE/api/scalping-daily-summary?strategy=crypto" || true)
            echo "BTC Telegram attempt $attempt HTTP $STATUS: $(cat crypto-summary-response.json 2>/dev/null || true)"
            if [ "$STATUS" = "200" ] && jq -e '.ok == true' crypto-summary-response.json >/dev/null 2>&1; then
              jq -n --arg date "$DATE" --arg sentAt "$(TZ=Asia/Seoul date --iso-8601=seconds)" \
                '{date:$date,sentAt:$sentAt,strategy:"crypto",sections:[5,6]}' > "$MARK"
              SENT=1
              break
            fi
            sleep 10
          done
          [ "$SENT" = "1" ] || { echo "BTC Telegram 전송 실패"; exit 1; }

      - name: 데이터와 연구결과 저장
        run: |
          if git diff --quiet -- data/crypto data/crypto-research && [ -z "$(git status --porcelain data/crypto data/crypto-research)" ]; then
            echo "새 비트코인 데이터/연구결과 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto data/crypto-research
          git commit -m "data: bitcoin scalping research $(TZ=Asia/Seoul date +%F) [skip ci]"
          git pull --rebase origin scalping-data
          git push origin scalping-data
