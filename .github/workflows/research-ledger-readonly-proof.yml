name: Research paper settings OFF proof
on:
  push:
    branches: [fix/intraday-session-close-20261022]
    paths: [.github/workflows/research-ledger-readonly-proof.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Persist requested OFF settings and verify original evidence
        env:
          MONITOR_KEY: ${{ secrets.AUTOTRADE_KEY }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,hashlib
          base='https://jkquant-opening-scheduler.mumae4.workers.dev'
          def request(url,body=None,authorized=True):
              headers={'User-Agent':'JKQuant-settings-off-proof/1.0','Accept':'application/json'}
              if authorized:headers['x-monitor-key']=os.environ['MONITOR_KEY']
              if body is not None:headers['Content-Type']='application/json'
              req=urllib.request.Request(url,data=None if body is None else json.dumps(body).encode(),headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:return r.status,r.read().decode()
              except urllib.error.HTTPError as e:return e.code,e.read().decode()
          def api(path,body=None):
              status,raw=request(base+path,body)
              assert status==200,'worker status '+str(status)
              data=json.loads(raw);assert data.get('ok'),'worker operation failed'
              return data
          original=api('/event-history?kind=opening&from=2026-10-22&to=2026-10-22')
          digest=lambda x:hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert len(original.get('ledgers') or [])==1,'original ledger missing'
          before=digest(original.get('ledgers'))
          first=api('/paper-settings')['settings']
          expected={'gpt_opening','gpt_daytrading','gpt_closing30','gpt_closing_bet','gpt_crypto','gpt_soxl','gpt_tenbagger'}
          assert set(first['strategies'])==expected,'strategy catalog mismatch'
          print('INITIAL_STATE',json.dumps({'revision':first['revision'],'enabled':{k:v['enabled'] for k,v in first['strategies'].items()}},sort_keys=True))
          saved=api('/paper-settings',{'allOff':True,'expectedRevision':first['revision']})['settings']
          loaded=api('/paper-settings')['settings']
          assert loaded==saved and loaded['revision']==first['revision']+1,'saved setting mismatch'
          assert all(v['enabled'] is False for v in loaded['strategies'].values()),'not all OFF'
          print('PERSISTED_OFF',json.dumps(loaded,sort_keys=True))
          after=api('/event-history?kind=opening&from=2026-10-22&to=2026-10-22')
          assert digest(after.get('ledgers'))==before,'original ledger changed'
          print('ORIGINAL_PRESERVED',json.dumps({'ledgers':len(after.get('ledgers') or []),'sha256':before}))
          for url in [base+'/paper-settings','https://jkquant.pages.dev/api/paper-trading-settings']:
              status,raw=request(url,authorized=False);assert status==401,'anonymous access '+str(status)
              print('ANONYMOUS_BLOCKED',url,status)
          status,page=request('https://jkquant.pages.dev/settings',authorized=False)
          assert status==200 and 'v1.5.0' in page and 'data-settings-tab="paper"' in page and 'settings-paper-trading.js?v=1.0.0' in page,'settings deploy mismatch'
          status,page=request('https://jkquant.pages.dev/scalping',authorized=False)
          assert status==200 and 'id="scVer">v1.47.0<' in page,'research deploy mismatch'
          print('DEPLOYED_VERSIONS','settings=1.5.0 research=1.47.0')
          print('NO_BROKER_ORDER_OR_NOTIFICATION_CALLED')
          PY
