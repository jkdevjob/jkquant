name: Research ledger read-only proof
on:
  push:
    branches: [fix/intraday-session-close-20261022]
    paths: [.github/workflows/research-ledger-readonly-proof.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read original opening evidence and patched quote routes
        env:
          MONITOR_KEY: ${{ secrets.AUTOTRADE_KEY }}
        run: |
          python - <<'PY'
          import os,json,subprocess,datetime,collections,urllib.parse
          from zoneinfo import ZoneInfo
          def get(url,timeout=30):
              r=subprocess.run(['curl','--silent','--show-error','--fail-with-body','--max-time',str(timeout),'--user-agent','JKQuant-readonly-proof/1.1','-H','x-monitor-key: '+os.environ['MONITOR_KEY'],url],capture_output=True,text=True,timeout=timeout+5)
              try:return json.loads(r.stdout)
              except Exception:raise RuntimeError('source response unavailable '+str(r.returncode))
          date=datetime.datetime.now(ZoneInfo('Asia/Seoul')).date().isoformat()
          opening=get('https://jkquant-opening-scheduler.mumae4.workers.dev/event-history?kind=opening&from=2026-10-22&to=2026-10-22')
          for l in opening.get('ledgers') or []:
              scans=l.get('scans') or [];events=l.get('events') or [];main=l.get('mainVariant') or 'baseline'
              print('OPENING_ORIGINAL',json.dumps({'date':l.get('date'),'mainVariant':main,'updatedAt':l.get('updatedAt'),'scans':len(scans),'targets':[s.get('targetHm') for s in scans],'partialScans':sum(bool(s.get('partial')) for s in scans),'quoteErrors':sum(s.get('quoteErrors') or 0 for s in scans),'failedShards':sum(len(s.get('failed') or []) for s in scans),'eventsByVariant':dict(collections.Counter(e.get('variant')+':'+str(e.get('stage')) for e in events)),'mainEvents':sum(e.get('variant')==main for e in events)},ensure_ascii=False))
          runtime=get('https://jkquant-global-intraday-scheduler.mumae4.workers.dev/runtime')
          print('GLOBAL_RUNTIME',json.dumps(runtime,ensure_ascii=False))
          archive=get('https://jkquant.pages.dev/api/closing30-archive?date=2026-10-22')
          for l in archive.get('ledgers') or ([archive['ledger']] if archive.get('ledger') else []):
              events=l.get('events') or []
              print('CLOSING_ORIGINAL',json.dumps({'date':l.get('date'),'scans':[{k:s.get(k) for k in ['targetHm','partial','quoteErrors','eventCount']} for s in l.get('scans') or []],'stages':dict(collections.Counter(str(e.get('kind'))+':'+str(e.get('stage')) for e in events)),'events':len(events)},ensure_ascii=False))
          research=[]
          for shard in range(5):
              part=get('https://jkquant.pages.dev/api/opening-monitor?serverHistory=1&shard='+str(shard)+'&shards=5&limit=100&mainVariant=baseline',60)
              research.append({'shard':shard,'ok':part.get('ok'),'error':part.get('error'),'universe':part.get('universe'),'trades':len(part.get('operationalTrades') or []),'quoteErrors':part.get('errors'),'entryTimes':[x.get('entryTime') for x in part.get('operationalTrades') or []]})
          print('OPENING_RECONSTRUCTION_QA',json.dumps(research,ensure_ascii=False))
          base='https://f4ea434e.jkquant.pages.dev'
          scan=get(base+'/api/closing30-monitor?op=scan&kind=day&date='+date,150)
          print('PATCH_SCAN',json.dumps({k:scan.get(k) for k in ['ok','error','date','kind','scanned','valid','partial','cutoff','errors']},ensure_ascii=False))
          if scan.get('ok'):
              assert scan.get('scanned')==50 and not scan.get('partial') and not scan.get('errors'),'Top50 scan incomplete'
              universe=get(base+'/api/universe?limit=100')
              codes=[str(x.get('code')) for x in universe.get('universe') or [] if len(str(x.get('code','')))==6 and str(x.get('code','')).isdigit()][:35]
              assert len(codes)==35
              prices=get(base+'/api/closing30-monitor?op=prices&stage=overnight_entry&date='+date+'&codes='+','.join(codes),150)
              print('PATCH_PRICES',json.dumps({'ok':prices.get('ok'),'count':len(prices.get('prices') or []),'missing':prices.get('missing'),'errors':prices.get('errors'),'priceTimes':sorted(set(x.get('priceAt','') for x in prices.get('prices') or []))},ensure_ascii=False))
              assert prices.get('ok') and len(prices.get('prices') or [])==35 and not prices.get('errors') and prices.get('missing')==0,'35 prices incomplete'
          PY
