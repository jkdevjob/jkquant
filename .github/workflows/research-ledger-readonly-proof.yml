name: Research read-only audit 2026-10-23
on:
  push:
    branches: [fix/intraday-session-close-20261022]
    paths: [.github/workflows/research-ledger-readonly-proof.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read original monitoring, paper ledgers, OFF settings and recent alert metadata
        env:
          MONITOR_KEY: ${{ secrets.AUTOTRADE_KEY }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,collections,hashlib
          date='2026-10-23'
          bases={k:'https://jkquant-'+v+'-scheduler.mumae4.workers.dev' for k,v in [('opening','opening'),('daytrading','daytrading'),('global','global-intraday')]}
          def get(url,auth=True):
              headers={'Accept':'application/json','Cache-Control':'no-cache','User-Agent':'JKQuant-readonly-audit/1.0'}
              if auth:headers['x-monitor-key']=os.environ['MONITOR_KEY']
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=25) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print('READ_ERROR',url.split('?')[0].split('/')[-1],e.code);return {}
              except Exception as e:
                  print('READ_ERROR',type(e).__name__);return {}
          urls={
            'opening':bases['opening']+'/events?date='+date,
            'closing':bases['opening']+'/closing-ledger?date='+date,
            'daytrading':bases['daytrading']+'/paper?date='+date,
            'btc':bases['global']+'/paper?strategy=crypto&date='+date,
            'soxl':bases['global']+'/paper?strategy=soxl&date=2026-10-22'}
          for kind,url in urls.items():
              d=get(url);l=d.get('ledger') or {}
              fields=['targetHm','capturedAt','scheduledTime','partial','okShards','quoteErrors','failed','lagMs']
              out={k:l.get(k) for k in ['date','updatedAt','mode','mainVariant','strategyVersion','decision']}
              out['scans']=[{k:s.get(k) for k in fields} for s in l.get('scans',[])]
              out['eventCounts']=dict(collections.Counter((e.get('kind','opening')+':'+e.get('variant','main')+':'+e.get('stage','?')) for e in l.get('events',[])))
              out['tradeCounts']=dict(collections.Counter(t.get('status','?') for t in l.get('trades',[])))
              out['hash']=hashlib.sha256(json.dumps(l,sort_keys=True,separators=(',',':')).encode()).hexdigest()
              if kind=='opening':
                  present={int(s.get('targetHm',0)) for s in l.get('scans',[])}
                  out['missing']=[x for x in range(904,931) if x not in present]
              print('ORIGINAL',kind,json.dumps(out,sort_keys=True,ensure_ascii=False))
          settings=get(bases['opening']+'/paper-settings').get('settings') or {}
          print('PAPER_OFF',json.dumps({'revision':settings.get('revision'),'enabled':{k:v.get('enabled') for k,v in settings.get('strategies',{}).items()}},sort_keys=True))
          for key,base in bases.items():
              b=get(base+'/broker-status')
              print('BROKER_STATUS',key,json.dumps(b,sort_keys=True))
          for key,url in [('push','https://jkquant-presale-alert.mumae4.workers.dev/health'),('latest','https://jkquant-presale-alert.mumae4.workers.dev/latest')]:
              d=get(url,False)
              if key=='latest':
                  rows=d.get('alerts') or ([d['alert']] if d.get('alert') else [])
                  d={'alerts':[{k:x.get(k) for k in ['type','stage','title','url','createdAt']} for x in rows]}
              else:
                  d={k:d.get(k) for k in ['lastChecks','lastDeliveries','lastTelegramDeliveries','topicSubscriptions']}
              print('PUSH',key,json.dumps(d,sort_keys=True,ensure_ascii=False))
          print('READ_ONLY_NO_ORDER_NO_ALERT_NO_SETTINGS_WRITE')
          PY
