name: SOXL 단타 연구 자동수집

# 미국 정규장 종료 뒤 SOXL 5분봉을 누적하고, 기준전략 + 그림자 변형을 같은 원본으로 재검증한다.
# 21:15 UTC = KST 06:15. 미국 서머타임/표준시 모두 정규장 종료 뒤 실행된다.
# 연구 전용이며 주문 API를 호출하지 않는다.

on:
  schedule:
    - cron: "15 21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/soxl-research.yml"
      - "scripts/collect_soxl_data.py"
      - "scripts/backtest_soxl_intraday.py"
      - "functions/api/soxl-research.js"
      - "scalping.html"

permissions:
  contents: write

concurrency:
  group: soxl-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 데이터 브랜치 체크아웃
        uses: actions/checkout@v4
        with:
          ref: scalping-data
          fetch-depth: 0

      - name: 최신 연구 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          path: .app
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SOXL 5분봉 수집 + 누적 연구
        env:
          KEY: ${{ secrets.AUTOTRADE_KEY }}
          BASE: https://jkquant.pages.dev
          JKQ_SOXL_WORKER_URL: https://jkquant-global-intraday-scheduler.mumae4.workers.dev
          JKQ_MONITOR_KEY: ${{ secrets.AUTOTRADE_KEY }}
        shell: bash
        run: |
          set -e
          COLLECT_OK=1
          HAVE_ARCHIVE=0
          if find data/soxl/SOXL/5m -maxdepth 1 -name '*.json.gz' -print -quit 2>/dev/null | grep -q .; then
            HAVE_ARCHIVE=1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$HAVE_ARCHIVE" = "1" ]; then
            echo "코드 push 실행 — 기존 SOXL 아카이브가 있어 외부수집은 건너뛰고 코드/연구만 재검증"
          elif ! python .app/scripts/collect_soxl_data.py; then
            COLLECT_OK=0
            echo "::warning::Yahoo SOXL 수집 실패(예: 429). 기존 누적자료를 보존하고 연구/요약을 계속합니다."
          fi

          CHANGED=0
          if [ -n "$(git status --porcelain -- data/soxl)" ]; then
            CHANGED=1
          fi

          if [ "$CHANGED" = "1" ] || [ "$GITHUB_EVENT_NAME" = "push" ] || [ ! -f data/soxl-research/latest.json ]; then
            python .app/scripts/backtest_soxl_intraday.py
          else
            if [ "$COLLECT_OK" = "0" ]; then
              echo "새 SOXL 원본을 못 받음 — 기존 연구결과 유지"
            else
              echo "새 SOXL 원본 없음 — 기존 연구결과 유지"
            fi
          fi

          REPORT="data/soxl-research/latest.json"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "코드 push 실행 — Pages 배포와 경합하지 않도록 Telegram 발송은 다음 정기/수동 실행에서 수행"
          elif [ -f "$REPORT" ]; then
            DATE=$(jq -r '.to // empty' "$REPORT")
            MARK="data/soxl-research/$DATE-summary-sent.json"
            if [ -n "$DATE" ] && [ ! -f "$MARK" ]; then
              if [ -z "$KEY" ]; then
                echo "AUTOTRADE_KEY GitHub Secret 없음"
                exit 1
              fi
              SENT=0
              for attempt in $(seq 1 6); do
                STATUS=$(curl -sS --max-time 30 -o soxl-summary-response.json -w '%{http_code}' \
                  -X POST -H "x-monitor-key: $KEY" -H "content-type: application/json" \
                  --data-binary @"$REPORT" "$BASE/api/scalping-daily-summary?strategy=soxl" || true)
                echo "SOXL Telegram attempt $attempt HTTP $STATUS: $(cat soxl-summary-response.json 2>/dev/null || true)"
                if [ "$STATUS" = "200" ] && jq -e '.ok == true' soxl-summary-response.json >/dev/null 2>&1; then
                  jq -n --arg date "$DATE" --arg sentAt "$(TZ=Asia/Seoul date --iso-8601=seconds)" \
                    '{date:$date,sentAt:$sentAt,strategy:"soxl",sections:[5,6]}' > "$MARK"
                  SENT=1
                  break
                fi
                sleep 10
              done
              [ "$SENT" = "1" ] || { echo "SOXL Telegram 전송 실패"; exit 1; }
            else
              echo "SOXL Telegram 이미 전송됨 또는 기준일 없음"
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -e data/soxl ] && git add -A -- data/soxl || true
          [ -e data/soxl-research ] && git add -A -- data/soxl-research || true
          if git diff --cached --quiet; then
            echo "새 SOXL 데이터/연구결과 없음"
            exit 0
          fi
          DATE=$(TZ=America/New_York date +%F)
          git commit -m "data: SOXL intraday research $DATE [skip ci]"
          git pull --rebase origin scalping-data
          PUSH_OK=0
          for attempt in $(seq 1 6); do
            if git push origin scalping-data; then
              PUSH_OK=1
              break
            fi
            echo "scalping-data push 경합 — 재동기화 후 재시도 $attempt/6"
            if ! git pull --rebase origin scalping-data; then
              git rebase --abort >/dev/null 2>&1 || true
            fi
            sleep $((attempt * 2))
          done
          [ "$PUSH_OK" = "1" ] || { echo "scalping-data push 6회 실패"; exit 1; }
