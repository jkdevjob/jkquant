name: Deep LOC regime research

on:
  push:
    branches: ["research/deep-loc-regime"]
    paths:
      - "backtest.html"
      - "scripts/research_deep_loc_regime.mjs"
      - ".github/workflows/deep-loc-regime-research.yml"
  workflow_dispatch:

concurrency:
  group: deep-loc-regime-research
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local full-page server
        run: |
          python3 -m http.server 8000 >/tmp/jkq-http.log 2>&1 &
          sleep 2
      - name: Run full backtest.html A/B regime research
        run: node scripts/research_deep_loc_regime.mjs
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-loc-regime-result
          path: deep-loc-regime-result.json
          if-no-files-found: warn
