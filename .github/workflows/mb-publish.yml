        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            reel/publish-social.mjs
            reel/queue/queue.json
            reel/queue/mb/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 게시 시각까지 기다리기
        run: |
