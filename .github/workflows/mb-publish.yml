name: 매니악 브리핑 인스타 자동 발행

# 매니악 브리핑(@maniacbriefing) 릴스를 인스타그램 API 로 올린다. 업로더는 은퇴노트와 같은 reel/publish-social.mjs(--channel mb).
# 큐·기록: reel/queue/mb/(queue.json·publish.config.json·published.json·last_run.txt). 비밀값: MB_IG_ACCESS_TOKEN, MB_IG_USER_ID.
# 매니악 브리핑 영상 루틴(Claude)이 큐를 이 브랜치에 푸시하면 실행되고, 한국 08:30 · 20:30 까지 기다렸다가 그때 올릴 것만 올린다
# (작업 하나 6시간 제한이라 14:30 까지 기다리기만 하는 작업을 끼움). 새 푸시가 오면 앞 실행은 취소되고 새 실행이 이어받는다.
# 같은 영상을 두 번 올리지 않게: 기록 커밋(봇 커밋은 다시 깨우지 않음) + 계정 최근 게시물 캡션 첫 줄 확인.
# 발행을 끄려면 reel/queue/mb/publish.config.json 의 enabled 를 false.

on:
  push:
    branches: [claude/instagram-reel-video-creation-wl16ee]
    paths:
      - "reel/queue/mb/**"
      - "reel/publish-social.mjs"
      - ".github/workflows/mb-publish.yml"
  workflow_dispatch:
    inputs:
      dry:
        description: "점검만(키가 통하는지·지금 올릴 것만 확인, 올리지 않음)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mb-publish
  cancel-in-progress: true

env:
  BRANCH: claude/instagram-reel-video-creation-wl16ee

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            reel/publish-social.mjs
            reel/queue/queue.json
            reel/queue/mb/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 점검
        env:
          IG_ACCESS_TOKEN: ${{ secrets.MB_IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.MB_IG_USER_ID }}
        run: cd reel && node publish-social.mjs --dry --channel mb

  slot-0830:
    needs: check
    if: ${{ !cancelled() && !inputs.dry }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SLOT: "08:30"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            reel/publish-social.mjs
            reel/queue/queue.json
            reel/queue/mb/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 게시 시각까지 기다리기
        run: |
          target=$(TZ=Asia/Seoul date -d "today $SLOT" +%s)
          now=$(date +%s)
          if [ "$target" -gt "$now" ]; then
            echo "한국 $SLOT 까지 $(( (target - now) / 60 ))분 기다림"
            sleep $(( target - now ))
          else
            echo "한국 $SLOT 이 이미 지남 — 바로 확인"
          fi
      - name: 최신 큐 받기
        run: |
          git fetch -q --depth=1 --filter=blob:none origin "$BRANCH"
          git reset -q --hard FETCH_HEAD
          git log -1 --format='큐 커밋 %h %s'
      - name: 게시
        if: ${{ env.SLOT != '14:30' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.MB_IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.MB_IG_USER_ID }}
        run: cd reel && node publish-social.mjs --channel mb
      - name: 기록 저장
        if: ${{ !cancelled() && env.SLOT != '14:30' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files="reel/queue/mb/published.json reel/queue/mb/last_run.txt"
          for f in $files; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "기록 변경 없음"; exit 0; fi
          git commit -q -m "매니악 브리핑 인스타 자동 발행 기록 ($SLOT)"
          for i in 1 2 3 4 5; do
            if git push -q origin "HEAD:$BRANCH"; then echo "기록 푸시 완료"; exit 0; fi
            # 그사이 루틴이 브랜치에 푸시했으면 최신 위에 기록 두 파일만 다시 얹는다(기록은 이 workflow 만 쓴다)
            for f in $files; do if [ -f "$f" ]; then cp "$f" "$RUNNER_TEMP/$(basename "$f")"; fi; done
            git fetch -q --depth=1 --filter=blob:none origin "$BRANCH"
            git reset -q --hard FETCH_HEAD
            for f in $files; do if [ -f "$RUNNER_TEMP/$(basename "$f")" ]; then cp "$RUNNER_TEMP/$(basename "$f")" "$f"; git add "$f"; fi; done
            if git diff --cached --quiet; then echo "기록 변경 없음"; exit 0; fi
            git commit -q -m "매니악 브리핑 인스타 자동 발행 기록 ($SLOT)"
            sleep $(( i * 3 ))
          done
          echo "기록 푸시 5회 실패"; exit 1

  wait-1430:
