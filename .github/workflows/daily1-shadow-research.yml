name: 일 +1% 그림자전략 모의연구

# 네 단타 탭에 하나씩 추가한 +1% 연구 후보를 매일 재계산한다.
# 주문/계좌 API는 호출하지 않는다. 2026-10-01 이후 데이터는 prospective paper 로 누적한다.
# 오전 실행: BTC 전일 확정 + 미국장 SOXL 반영
# 오후 실행: 한국 시초가/데이트레이딩 당일 확정 반영

on:
  schedule:
    - cron: "30 21 * * 1-5"    # 06:30 KST Tue-Sat · 미국장 SOXL 확정 반영
    - cron: "45 0 * * *"      # 09:45 KST daily · BTC/보조 재계산
    - cron: "30 8 * * 1-5"    # 17:30 KST weekdays
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily1-shadow-research.yml"
      - "scripts/daily1_shadow_lab.py"
      - "functions/api/daily1-shadow.js"
      - "scalping.html"

permissions:
  contents: write

concurrency:
  group: daily1-shadow-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 데이터 브랜치 체크아웃
        uses: actions/checkout@v4
        with:
          ref: scalping-data
          fetch-depth: 0

      - name: 최신 연구 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          path: .app
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 네 탭 +1% 그림자 모의전략 재계산
        run: python .app/scripts/daily1_shadow_lab.py

      - name: 결과 저장
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily1-shadow
          if git diff --cached --quiet; then
            echo "그림자 모의연구 결과 변경 없음"
            exit 0
          fi
          git commit -m "data: daily1 shadow paper $(TZ=Asia/Seoul date +%F) [skip ci]"
          git pull --rebase origin scalping-data
          git push origin scalping-data
