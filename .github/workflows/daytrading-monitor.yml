name: 데이트레이딩 수동 백업감시

# 정규 09:55 스냅샷 + 10:00~14:31 매분 감시는 Cloudflare Worker가 담당한다.
# 이 GitHub workflow는 장애 시 사람이 수동 실행하는 비상 fallback 전용이며 자동 schedule은 없다.
# 실제 주문은 하지 않는다.

on:
  workflow_dispatch:

concurrency:
  group: daytrading-monitor-manual
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 데이트레이딩 기준+shadow 장중 감시
        env:
          KEY: ${{ secrets.AUTOTRADE_KEY }}
          BASE: https://jkquant.pages.dev
        shell: bash
        run: |
          set -e
          if [ -z "$KEY" ]; then
            echo "AUTOTRADE_KEY GitHub Secret 이 없습니다."
            exit 1
          fi

          dow=$(TZ=Asia/Seoul date +%u)
          raw=$(TZ=Asia/Seoul date +%H%M)
          hm=$((10#$raw))
          if [ "$dow" -gt 5 ]; then echo "주말 — 종료"; exit 0; fi

          if [ "$hm" -lt 950 ] || [ "$hm" -gt 1431 ]; then
            echo "장중 감시 시간 밖 수동 실행 — 종료"
            exit 0
          fi

          last=""
          echo "데이트레이딩 기준전략 + shadow 자동감시 준비"
          while true; do
            raw=$(TZ=Asia/Seoul date +%H%M)
            hm=$((10#$raw))
            if [ "$hm" -gt 1431 ]; then
              echo "14:31 이후 — 종료"
              exit 0
            fi
            if [ "$hm" -ge 1000 ] && [ "$raw" != "$last" ]; then
              last="$raw"
              echo "[$(TZ=Asia/Seoul date '+%F %T KST')] Top100 데이트레이딩 스캔"
              pids=""
              for shard in 0 1 2 3 4; do
                curl -sS --max-time 55 -H "x-monitor-key: $KEY"                   "$BASE/api/daytrading-monitor?shard=$shard&shards=5"                   -o "day-$shard.json" &
                pids="$pids $!"
              done
              for p in $pids; do wait "$p" || true; done
              for shard in 0 1 2 3 4; do
                echo "shard $shard: $(cat day-$shard.json 2>/dev/null || echo no-response)"
              done
            fi
            sleep 5
          done
