main{padding:22px 0 70px}.hero{display:flex;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:14px}.hero h2{font-size:23px;margin:0 0 3px}.sub{color:var(--dim);font-size:12px}

.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}.tab{flex:0 0 auto;border:1px solid var(--border);background:var(--surf);color:var(--dim);border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px;cursor:pointer}.tab.on{background:var(--accent);border-color:var(--accent);color:white}

.summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0 11px;color:var(--dim);font-size:12px}.cards{display:grid;gap:9px}.card{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:13px}.card:hover{border-color:var(--border2)}
.cardtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.titleline{display:flex;align-items:baseline;gap:7px;min-width:0;flex-wrap:wrap}.title{font-size:15px;font-weight:900;line-height:1.4;text-decoration:none}.title:hover{color:var(--gold)}.company-inline{font-size:11px;font-weight:700;color:var(--dim);white-space:nowrap}.card-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}.date{font-size:11px;color:var(--faint);white-space:nowrap}.scrap-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surf2);color:var(--faint);cursor:pointer;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}.scrap-btn:hover{border-color:var(--gold);color:var(--gold)}.scrap-btn.on{color:var(--gold);border-color:rgba(245,196,81,.55);background:rgba(245,196,81,.10)}.apply-btn{height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surf2);color:var(--faint);cursor:pointer;font-size:11px;font-weight:800;padding:0 9px;white-space:nowrap}.apply-btn:hover{border-color:var(--green);color:var(--green)}.apply-btn.on{color:var(--green);border-color:rgba(54,211,153,.55);background:rgba(54,211,153,.10)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{font-size:10.5px;padding:3px 7px;border-radius:999px;background:var(--surf2);color:var(--dim);border:1px solid var(--border)}.tag.hot{color:var(--gold)}.tag.ai{color:#aeb0ff}.tag.reg{color:var(--green)}.tag.pay{color:#ffadbe}.tag.closed{color:var(--red);border-color:rgba(248,123,140,.35)}.tag.active{color:var(--green)}.tag.applied{color:var(--green);border-color:rgba(54,211,153,.45);background:rgba(54,211,153,.08)}
.desc{margin-top:9px;color:var(--dim);font-size:12px;line-height:1.6}.src{margin-top:8px;color:var(--faint);font-size:11px}.empty,.loading{padding:45px 18px;text-align:center;color:var(--dim);background:var(--surf);border:1px solid var(--border);border-radius:12px}.more{display:flex;justify-content:center;margin-top:14px}.warn{padding:9px 11px;border-radius:9px;background:rgba(248,123,140,.08);border:1px solid rgba(248,123,140,.25);color:#ffb3be;font-size:11px;margin-bottom:10px}
@media(max-width:850px){.hero{align-items:flex-start;flex-direction:column}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}

<script>
function jkMenuToggle(e){if(e)e.stopPropagation();var p=document.getElementById("jkmenuPop");if(p)p.hidden=!p.hidden}
function jkMenuClose(){var p=document.getElementById("jkmenuPop");if(p)p.hidden=true}
document.addEventListener("click",function(e){var m=document.getElementById("jkmenuWrap");if(m&&!m.contains(e.target))jkMenuClose()});
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
var CAT_LABEL={java_ai:"Java·AI",regular_dev:"개발자 정규직",salary500:"월500+",salary450:"월450~499",short_term:"단기알바",scrap:"스크랩",applied:"지원완료"};
var DATA={jobs:[],sourceStatuses:{},currentCount:0,historyCount:0},activeCat="all",shown=50,filtered=[];
var SCRAPS={},APPLICATIONS={};
function scrapKey(j){return String((j&&j.url)||(j&&j.id)||"").trim()}
function applicationKey(j){return scrapKey(j)}
function isApplied(j){var k=applicationKey(j);return !!(k&&APPLICATIONS[k])}
function renderAppliedCount(){var el=document.getElementById("appliedCnt");if(el)el.textContent=Object.keys(APPLICATIONS).length.toLocaleString()}
async function loadApplications(){
  APPLICATIONS={};
  var F=window.jobFb;if(!F||!F.uid){renderAppliedCount();return false}
  try{
    var snap=await F.getDoc(F.doc(F.db,"users",F.uid)),d=snap.exists()?(snap.data()||{}):{},v=d.jobApplications;
    APPLICATIONS=v&&typeof v==="object"&&!Array.isArray(v)?v:{};
    renderAppliedCount();
    if((DATA.jobs||[]).length){syncApplicationSnapshots();applyFilters()}
    return true
  }catch(e){console.error("JOB 지원완료 DB 읽기 실패",e);return false}
}
async function saveApplications(){
  var F=window.jobFb;if(!F||!F.uid)return false;
  try{
    await F.setDoc(F.doc(F.db,"users",F.uid),{jobApplications:APPLICATIONS,jobApplicationsUpdated:Date.now()},{merge:true});
    return true
  }catch(e){console.error("JOB 지원완료 DB 저장 실패",e);return false}
}
window.loadApplications=loadApplications;
function syncApplicationSnapshots(){
  var changed=false;
  (DATA.jobs||[]).forEach(function(j){
    var k=applicationKey(j);
    if(k&&APPLICATIONS[k]){
      APPLICATIONS[k]={appliedAt:APPLICATIONS[k].appliedAt||new Date().toISOString(),job:j};
      changed=true
    }
  });
  if(changed)void saveApplications()
}
function applicationJobs(){
  var current={};
  (DATA.jobs||[]).forEach(function(j){var k=applicationKey(j);if(k)current[k]=j});
  return Object.keys(APPLICATIONS).map(function(k){
    var saved=APPLICATIONS[k]||{};
    return current[k]||saved.job||null
  }).filter(Boolean)
}
async function toggleApplicationByKey(key){
  key=String(key||"");if(!key)return;
  var before=JSON.parse(JSON.stringify(APPLICATIONS));
  if(APPLICATIONS[key])delete APPLICATIONS[key];
  else{
    var job=(DATA.jobs||[]).concat(filtered||[]).find(function(j){return applicationKey(j)===key});
    if(!job)return;
    APPLICATIONS[key]={appliedAt:new Date().toISOString(),job:job}
  }
  renderAppliedCount();applyFilters();
  if(!await saveApplications()){
    APPLICATIONS=before;renderAppliedCount();applyFilters();
    alert("지원완료 상태를 Firebase DB에 저장하지 못했습니다. 변경을 되돌렸습니다.")
  }
}
async function loadScraps(){
  SCRAPS={};
  var F=window.jobFb;if(!F||!F.uid){renderScrapCount();return false}
  try{
    var snap=await F.getDoc(F.doc(F.db,"users",F.uid)),d=snap.exists()?(snap.data()||{}):{},v=d.jobScraps;
    SCRAPS=v&&typeof v==="object"&&!Array.isArray(v)?v:{};
    renderScrapCount();
    if((DATA.jobs||[]).length){syncScrapSnapshots();applyFilters()}
    return true
  }catch(e){console.error("JOB 스크랩 DB 읽기 실패",e);return false}
}
async function saveScraps(){
  var F=window.jobFb;if(!F||!F.uid)return false;
  try{
    await F.setDoc(F.doc(F.db,"users",F.uid),{jobScraps:SCRAPS,jobScrapsUpdated:Date.now()},{merge:true});
    return true
  }catch(e){console.error("JOB 스크랩 DB 저장 실패",e);return false}
}
window.loadScraps=loadScraps;
function isScrapped(j){var k=scrapKey(j);return !!(k&&SCRAPS[k])}
function syncScrapSnapshots(){
  var changed=false;
  (DATA.jobs||[]).forEach(function(j){
    var k=scrapKey(j);
    if(k&&SCRAPS[k]){SCRAPS[k]={savedAt:SCRAPS[k].savedAt||new Date().toISOString(),job:j};changed=true}
  });
  if(changed)void saveScraps()
}
function scrapJobs(){
  var current={};
  (DATA.jobs||[]).forEach(function(j){var k=scrapKey(j);if(k)current[k]=j});
  return Object.keys(SCRAPS).map(function(k){
    var saved=SCRAPS[k]||{};
    return current[k]||saved.job||null
  }).filter(Boolean)
}
function renderScrapCount(){
  var el=document.getElementById("scrapCnt");
  if(el)el.textContent=Object.keys(SCRAPS).length.toLocaleString()
}
async function toggleScrapByKey(key){
  key=String(key||"");
  if(!key)return;
  var before=JSON.parse(JSON.stringify(SCRAPS));
  if(SCRAPS[key])delete SCRAPS[key];
  else{
    var job=(DATA.jobs||[]).concat(filtered||[]).find(function(j){return scrapKey(j)===key});
    if(!job)return;
    SCRAPS[key]={savedAt:new Date().toISOString(),job:job}
  }
  renderScrapCount();applyFilters();
  if(!await saveScraps()){
    SCRAPS=before;renderScrapCount();applyFilters();
    alert("스크랩을 Firebase DB에 저장하지 못했습니다. 변경을 되돌렸습니다.")
  }
}
function effectiveDate(j){return j.postedDate||j.firstSeen||""}
function fmtDate(s){if(!s)return "날짜 미상";var p=s.split("-");return p.length===3?p[0]+"."+p[1]+"."+p[2]:s}
function kstToday(){var d=new Date(Date.now()+9*3600*1000);return d.toISOString().slice(0,10)}
function daysAgo(n){var d=new Date(kstToday()+"T00:00:00Z");d.setUTCDate(d.getUTCDate()-n);return d.toISOString().slice(0,10)}
function oneMonthAgo(){
  var p=kstToday().split("-").map(Number),y=p[0],m=p[1]-1,d=p[2];
  if(m===0){y--;m=12}
  var last=new Date(Date.UTC(y,m,0)).getUTCDate();
  d=Math.min(d,last);
  return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0")
}
function syncDatesFromPeriod(){
  var period=document.getElementById("period").value;
  var from=document.getElementById("fromDate"),to=document.getElementById("toDate");
  if(period==="all"){from.value="";to.value="";return}
  if(period==="custom")return;
  to.value=kstToday();
  from.value=period==="30"?oneMonthAgo():daysAgo(+period)
}
function setDefaultDates(){
  document.getElementById("period").value="30";
  document.getElementById("fromDate").value=oneMonthAgo();
  document.getElementById("toDate").value=kstToday()
}
function tagClass(c){return c==="regular_dev"?"reg":c==="java_ai"?"ai":c.indexOf("salary")===0?"pay":c==="short_term"?"hot":""}
function resetFilters(){
  document.getElementById("keyword").value="";document.getElementById("region").value="";document.getElementById("employment").value="";document.getElementById("jobStatus").value="active";document.getElementById("source").value="";document.getElementById("sort").value="latest";setDefaultDates();shown=+document.getElementById("pageSize").value||50;applyFilters()
}
function renderSources(){
  var names=[].concat.apply([],DATA.jobs.map(function(j){return j.sources||[]})).filter(Boolean).filter(function(v,i,a){return a.indexOf(v)===i}).sort(function(a,b){return a.localeCompare(b,"ko")});
  document.getElementById("source").innerHTML='<option value="">모든 출처</option>'+names.map(function(x){return "<option>"+esc(x)+"</option>"}).join("");
  var failed=Object.keys(DATA.sourceStatuses||{}).filter(function(k){return !(DATA.sourceStatuses[k]||{}).ok});
  document.getElementById("sourceWarn").innerHTML=failed.length?'<div class="warn">⚠️ 이번 수집에서 제한/실패한 사이트: '+esc(failed.join(" · "))+". 다른 사이트에서 확인된 공고는 정상 표시됩니다.</div>":""
}
function isRegularJob(j){
  if((j.employmentTypes||[]).indexOf("정규직")>=0)return true;
  var text=[j.title,j.body].join(" ").toLowerCase();
  return text.indexOf("정규직")>=0||text.indexOf("정규 사원")>=0||text.indexOf("정규사원")>=0
}
function applyFilters(){
  var q=document.getElementById("keyword").value.trim().toLowerCase(),period=document.getElementById("period").value,region=document.getElementById("region").value,employment=document.getElementById("employment").value,jobStatus=document.getElementById("jobStatus").value,source=document.getElementById("source").value,sort=document.getElementById("sort").value,from=document.getElementById("fromDate").value,to=document.getElementById("toDate").value,cutoff=(!from&&/^\d+$/.test(period))?daysAgo(+period):"";
  var sourceJobs=activeCat==="scrap"?scrapJobs():activeCat==="applied"?applicationJobs():(DATA.jobs||[]);
  filtered=sourceJobs.filter(function(j){
    if(activeCat!=="all"&&activeCat!=="scrap"&&activeCat!=="applied"&&(j.categories||[]).indexOf(activeCat)<0)return false;
    if(activeCat==="scrap"&&!isScrapped(j))return false;
    if(activeCat==="applied"&&!isApplied(j))return false;
    var d=effectiveDate(j);if(activeCat!=="scrap"&&activeCat!=="applied"){if(cutoff&&d&&d<cutoff)return false;if(from&&d&&d<from)return false;if(to&&d&&d>to)return false}
    if(region&&(j.locations||[]).indexOf(region)<0)return false;
    if(employment==="regular"&&!isRegularJob(j))return false;
    if(employment==="nonregular"&&isRegularJob(j))return false;
    var st=j.status||"unverified";
    if(jobStatus==="active"&&st!=="active")return false;
    if(jobStatus==="closed"&&st!=="closed")return false;
    if(source&&(j.sources||[]).indexOf(source)<0)return false;
    if(q){var hay=[j.title,j.company,j.body,(j.sources||[]).join(" "),(j.locations||[]).join(" "),(j.categories||[]).map(function(c){return CAT_LABEL[c]||c}).join(" ")].join(" ").toLowerCase();if(hay.indexOf(q)<0)return false}
    return true
  });
  filtered.sort(function(a,b){
    if(sort==="oldest")return effectiveDate(a).localeCompare(effectiveDate(b))||String(a.title).localeCompare(String(b.title),"ko");
    if(sort==="title")return String(a.title).localeCompare(String(b.title),"ko");
    return effectiveDate(b).localeCompare(effectiveDate(a))||String(b.lastSeen||"").localeCompare(String(a.lastSeen||""))||String(a.title).localeCompare(String(b.title),"ko")
  });
  shown=+document.getElementById("pageSize").value||50;renderList()
}
function renderList(){
  document.getElementById("totalCnt").textContent=DATA.jobs.length.toLocaleString();document.getElementById("viewCnt").textContent=filtered.length.toLocaleString();renderScrapCount();renderAppliedCount();document.getElementById("resultText").textContent=filtered.length.toLocaleString()+"건 · "+(activeCat==="all"?"전체":CAT_LABEL[activeCat]||activeCat)+((activeCat==="scrap"||activeCat==="applied")?" · Firebase DB 저장":"")+(DATA.historyCount?" · 장기보관 "+DATA.historyCount.toLocaleString()+"건":"");
  var rows=filtered.slice(0,shown),el=document.getElementById("list");if(!rows.length){el.innerHTML='<div class="empty">조건에 맞는 공고가 없습니다.</div>';document.getElementById("moreBtn").hidden=true;return}
  el.innerHTML=rows.map(function(j){
    var cats=(j.categories||[]).map(function(c){return '<span class="tag '+tagClass(c)+'">'+esc(CAT_LABEL[c]||c)+"</span>"}).join("");
    var loc=(j.locations||[]).map(function(x){return '<span class="tag">'+esc(x)+"</span>"}).join("");
    var salary=j.salary&&j.salary.label?'<span class="tag pay">'+esc(j.salary.label)+"</span>":"";
    var employment=(j.employmentTypes||[]).map(function(x){return '<span class="tag reg">'+esc(x)+"</span>"}).join("");
    var career=j.career?'<span class="tag">'+esc(j.career)+"</span>":"";
    var education=j.education?'<span class="tag">'+esc(j.education)+"</span>":"";
    var st=j.status||"unverified";
    var statusTag='<span class="tag '+(st==="closed"?"closed":st==="active"?"active":"")+'">'+(st==="closed"?"마감":st==="active"?"진행중":"확인불가")+"</span>";
    var deadline=j.deadline?'<span class="tag">마감 '+esc(fmtDate(j.deadline))+"</span>":(j.deadlineSource==="채용시"?'<span class="tag">채용시 마감</span>':"");
    var historyTag=j.archivedAt?'<span class="tag">장기보관</span>':"";
    var company='<span class="company-inline">'+esc((j.company||"").trim()||"업체 비공개")+"</span>";
    var dateLabel=j.postedDate?fmtDate(j.postedDate)+" · "+esc(j.dateSource||"등록일"):fmtDate(j.firstSeen)+" · 최초수집";
    var key=scrapKey(j),scrapped=isScrapped(j),applied=isApplied(j);
    var scrap='<button class="scrap-btn'+(scrapped?' on':'')+'" type="button" data-scrap-key="'+esc(key)+'" aria-label="'+(scrapped?'스크랩 해제':'스크랩')+'" title="'+(scrapped?'스크랩 해제':'스크랩')+'">'+(scrapped?'★':'☆')+'</button>';
    var applyBtn='<button class="apply-btn'+(applied?' on':'')+'" type="button" data-apply-key="'+esc(key)+'" aria-label="'+(applied?'지원완료 해제':'지원완료 표시')+'" title="'+(applied?'지원완료 해제':'지원완료 표시')+'">'+(applied?'✓ 지원완료':'지원완료')+'</button>';
    var appliedTag=applied?'<span class="tag applied">✓ 지원완료</span>':"";
    return '<article class="card"><div class="cardtop"><div class="titleline"><a class="title" href="'+esc(j.url)+'" target="_blank" rel="noopener">'+esc(j.title||"제목 없음")+'</a>'+company+'</div><div class="card-actions"><div class="date">'+dateLabel+'</div>'+applyBtn+scrap+'</div></div><div class="meta">'+appliedTag+statusTag+deadline+employment+career+education+historyTag+cats+loc+salary+'</div>'+(j.body?'<div class="desc">'+esc(j.body)+"</div>":"")+'<div class="src">출처: '+esc((j.sources||[]).join(" / ")||j.source||"-")+" · 마지막 확인 "+esc(j.lastSeen||"-")+(st==="closed"&&j.closeReason?" · "+esc(j.closeReason):"")+"</div></article>"
  }).join("");
  document.getElementById("moreBtn").hidden=shown>=filtered.length
}
function showMore(){shown+=+document.getElementById("pageSize").value||50;renderList()}
document.getElementById("list").addEventListener("click",function(e){
  var a=e.target.closest(".apply-btn");
  if(a){e.preventDefault();e.stopPropagation();toggleApplicationByKey(a.getAttribute("data-apply-key"));return}
  var b=e.target.closest(".scrap-btn");
  if(!b)return;
  e.preventDefault();e.stopPropagation();toggleScrapByKey(b.getAttribute("data-scrap-key"))
});
document.getElementById("tabs").addEventListener("click",function(e){var b=e.target.closest(".tab");if(!b)return;document.querySelectorAll(".tab").forEach(function(x){x.classList.toggle("on",x===b)});activeCat=b.dataset.cat;applyFilters()});
document.getElementById("period").addEventListener("change",function(){syncDatesFromPeriod();applyFilters()});
["keyword","region","employment","jobStatus","source","sort","pageSize"].forEach(function(id){var el=document.getElementById(id);el.addEventListener(id==="keyword"?"input":"change",applyFilters)});
["fromDate","toDate"].forEach(function(id){document.getElementById(id).addEventListener("change",function(){document.getElementById("period").value="custom";applyFilters()})});
renderScrapCount();renderAppliedCount();setDefaultDates();
(function(){
  var ts=Date.now();
  var RAW_BASE="https://raw.githubusercontent.com/jkdevjob/jkquant/main/";
  function fetchJson(url,fallback){
    return fetch(url+(url.indexOf("?")>=0?"&":"?")+"ts="+ts,{cache:"no-store"})
      .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
      .catch(function(){return fallback});
  }
  function newest(a,b){
    a=a||{};b=b||{};
    var at=Date.parse(a.updatedAt||"")||0,bt=Date.parse(b.updatedAt||"")||0;
    return bt>at?b:a;
  }
  var current=Promise.all([
    fetchJson("/data/job_archive.json",null),
    fetchJson(RAW_BASE+"data/job_archive.json",null)
  ]).then(function(x){
    var picked=newest(x[0],x[1]);
    if(!picked)throw new Error("JOB archive를 불러오지 못했습니다.");
    return picked;
  });
  var history=Promise.all([
    fetchJson("/data/job_history.json",{jobs:[],count:0}),
    fetchJson(RAW_BASE+"data/job_history.json",{jobs:[],count:0})
  ]).then(function(x){return newest(x[0],x[1])||{jobs:[],count:0}});
  Promise.all([current,history]).then(function(parts){
    var d=parts[0]||{},hist=parts[1]||{},map={};
    (Array.isArray(d.jobs)?d.jobs:[]).concat(Array.isArray(hist.jobs)?hist.jobs:[]).forEach(function(j){
      var k=scrapKey(j)||String(j.id||"");if(k)map[k]=j
    });
    DATA=d;DATA.currentCount=Array.isArray(d.jobs)?d.jobs.length:0;DATA.historyCount=Array.isArray(hist.jobs)?hist.jobs.length:0;DATA.jobs=Object.keys(map).map(function(k){return map[k]});
    syncScrapSnapshots();syncApplicationSnapshots();renderSources();
    var upd=DATA.updatedAt?new Date(DATA.updatedAt):null;
    document.getElementById("updated").textContent="최근 "+(DATA.rangeDays||180)+"일 + 장기보관 · 중복 제거 · "+(upd&&!isNaN(upd)?"업데이트 "+upd.toLocaleString("ko-KR"):"업데이트 준비 중");
    applyFilters()
  }).catch(function(e){
    document.getElementById("list").innerHTML='<div class="empty">JOB 데이터를 아직 준비 중입니다.<br><span class="sub">'+esc(e.message||e)+"</span></div>";
    document.getElementById("resultText").textContent="데이터 준비 중"
  })
})();
</script>
