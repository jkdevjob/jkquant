name: 은퇴노트 인스타 자동 발행

# 은퇴노트 릴스를 인스타그램 API 로 올린다(유튜브는 당분간 Metricool — 유튜브 API 는 구글 감사 전엔 비공개로 잠김).
# 업로더(reel/publish-social.mjs)·발행 큐(reel/queue/queue.json)·기록은 claude/instagram-reel-video-creation-wl16ee
# 브랜치에 있고 이 파일만 main 에 둔다 — 수동·예약 실행은 기본 브랜치의 workflow 만 되기 때문.
# 비밀값: IG_ACCESS_TOKEN, IG_USER_ID (Settings → Secrets and variables → Actions). 설명: 그 브랜치의 reel/SOCIAL_SETUP.md
#
# 시각 맞추기: 이 저장소에서 GitHub 예약(cron)은 4~9시간 늦거나 빠진 적이 있다(swim-collect.yml 기록).
# 그래서 매일 새벽 영상 루틴(Claude)이 그날 영상을 큐에 넣은 뒤 이 workflow 를 수동 실행(workflow_dispatch)으로 깨우고,
# 작업들이 한국 09:00 · 12:00 · 18:00 까지 기다렸다가 그때 올릴 것만 올린다. 작업 하나는 6시간을 넘을 수 없어
# 12시와 18시 사이에 15시까지 기다리기만 하는 작업을 끼운다.
# 루틴이 못 깨운 날을 위해 예약 실행도 둔다 — 늦게 돌아도 업로더는 게시 시각에서 150분 안 지난 것만 올린다.
# 같은 영상을 두 번 올리지 않게: 실행은 한 번에 하나(concurrency), 기록(published.json)을 브랜치에 커밋,
# 업로더가 올리기 전에 계정 최근 게시물의 캡션 첫 줄을 한 번 더 확인한다.

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "점검만(키가 통하는지·지금 올릴 것만 확인, 올리지 않음)"
        type: boolean
        default: false
  schedule:
    - cron: "41 22 * * *"  # 07:41 KST 예비 깨우기(루틴이 못 깨운 날)
    - cron: "47 1 * * *"   # 10:47 KST 예비
    - cron: "43 7 * * *"   # 16:43 KST 예비

permissions:
  contents: write

concurrency:
  group: retire-note-publish
  cancel-in-progress: false

env:
  BRANCH: claude/instagram-reel-video-creation-wl16ee

jobs:
  check:
    if: ${{ inputs.dry }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            reel/publish-social.mjs
            reel/queue/queue.json
            reel/queue/publish.config.json
            reel/queue/published.json
            reel/queue/last_run.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 점검
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: cd reel && node publish-social.mjs --dry

  slot-0900:
    if: ${{ !inputs.dry }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SLOT: "09:00"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            reel/publish-social.mjs
            reel/queue/queue.json
            reel/queue/publish.config.json
            reel/queue/published.json
            reel/queue/last_run.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 게시 시각까지 기다리기
        run: |
          target=$(TZ=Asia/Seoul date -d "today $SLOT" +%s)
          now=$(date +%s)
          if [ "$target" -gt "$now" ]; then
            echo "한국 $SLOT 까지 $(( (target - now) / 60 ))분 기다림"
            sleep $(( target - now ))
          else
            echo "한국 $SLOT 이 이미 지남 — 바로 확인"
          fi
      - name: 최신 큐 받기
        run: |
          git fetch -q --depth=1 --filter=blob:none origin "$BRANCH"
          git reset -q --hard FETCH_HEAD
          git log -1 --format='큐 커밋 %h %s'
      - name: 게시
        if: ${{ env.SLOT != '15:00' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: cd reel && node publish-social.mjs
      - name: 기록 저장
        if: ${{ !cancelled() && env.SLOT != '15:00' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files="reel/queue/published.json reel/queue/last_run.txt"
          for f in $files; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "기록 변경 없음"; exit 0; fi
          git commit -q -m "인스타 자동 발행 기록 ($SLOT)"
          for i in 1 2 3 4 5; do
            if git push -q origin "HEAD:$BRANCH"; then echo "기록 푸시 완료"; exit 0; fi
            # 그사이 루틴이 브랜치에 푸시했으면 최신 위에 기록 두 파일만 다시 얹는다(기록은 이 workflow 만 쓴다)
            for f in $files; do if [ -f "$f" ]; then cp "$f" "$RUNNER_TEMP/$(basename "$f")"; fi; done
            git fetch -q --depth=1 --filter=blob:none origin "$BRANCH"
            git reset -q --hard FETCH_HEAD
            for f in $files; do if [ -f "$RUNNER_TEMP/$(basename "$f")" ]; then cp "$RUNNER_TEMP/$(basename "$f")" "$f"; git add "$f"; fi; done
            if git diff --cached --quiet; then echo "기록 변경 없음"; exit 0; fi
            git commit -q -m "인스타 자동 발행 기록 ($SLOT)"
            sleep $(( i * 3 ))
          done
          echo "기록 푸시 5회 실패"; exit 1

  slot-1200:
