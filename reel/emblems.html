<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  @font-face { font-family:'Nanum'; font-weight:400; src:url('fonts/nanum-400.woff2') format('woff2'); }
  @font-face { font-family:'Nanum'; font-weight:700; src:url('fonts/nanum-700.woff2') format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Nanum',sans-serif; background:#0a1c2e; padding:40px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:36px; width:1180px; }
  .card { background:radial-gradient(circle at 50% 42%,#14304c,#0c2137); border-radius:32px;
          border:1px solid rgba(210,178,110,.18); aspect-ratio:1/.82;
          display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .card svg { width:200px; height:200px; }
  .card .cap { margin-top:20px; color:#f4f7fb; font-weight:700; font-size:36px; }
  .card .num { color:#d6b676; font-weight:700; font-size:26px; margin-bottom:6px; letter-spacing:3px; }
  .g  { stroke:#d6b676; stroke-width:4.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .gt { stroke:#d6b676; stroke-width:3.5; fill:none; stroke-linecap:round; opacity:.72; }
  .gf { fill:#d6b676; }
</style></head>
<body>
  <div class="grid">
    <div class="card"><div class="num">1</div>
      <svg viewBox="0 0 100 100">
        <path class="gf" d="M29 61 a21 21 0 0 1 42 0 Z"/>
        <path class="g" d="M12 61 H88"/>
        <path class="gt" d="M33 71 H67 M40 80 H60"/>
      </svg><div class="cap">황혼 (노을)</div></div>

    <div class="card"><div class="num">2</div>
      <svg viewBox="0 0 100 100">
        <path class="g" d="M30 46 H62 V60 a13 13 0 0 1 -13 13 H43 a13 13 0 0 1 -13 -13 Z"/>
        <path class="g" d="M62 50 a10 10 0 0 1 0 18"/>
        <path class="g" d="M26 82 H68"/>
        <path class="gt" d="M41 26 q7 6 0 13 M53 26 q7 6 0 13"/>
      </svg><div class="cap">여유 (커피)</div></div>

    <div class="card"><div class="num">3</div>
      <svg viewBox="0 0 100 100">
        <path class="g" d="M50 84 C48 66 52 54 55 47"/>
        <path class="g" d="M55 47 C42 40 30 42 21 51"/>
        <path class="g" d="M55 47 C46 32 35 27 24 27"/>
        <path class="g" d="M55 47 C62 31 73 28 83 33"/>
        <path class="g" d="M55 47 C67 43 77 48 82 57"/>
        <path class="gt" d="M40 86 H72"/>
      </svg><div class="cap">휴양 (야자수)</div></div>

    <div class="card"><div class="num">4</div>
      <svg viewBox="0 0 100 100">
        <path class="g" d="M41 82 L45 46 H55 L59 82 Z"/>
        <path class="g" d="M34 82 H66"/>
        <path class="g" d="M45 46 L47 36 H53 L55 46"/>
        <path class="gf" d="M46 36 L54 36 L50 27 Z"/>
        <path class="gt" d="M45 33 L31 28 M55 33 L69 28"/>
      </svg><div class="cap">등대 (이정표)</div></div>
  </div>
</body></html>
