<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  @font-face { font-family:'Nanum'; font-weight:400; src:url('fonts/nanum-400.woff2') format('woff2'); }
  @font-face { font-family:'Nanum'; font-weight:700; src:url('fonts/nanum-700.woff2') format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Nanum',sans-serif; background:#0a1c2e; padding:40px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:32px; width:1540px; }
  .card { background:radial-gradient(circle at 50% 42%,#14304c,#0c2137); border-radius:28px;
          border:1px solid rgba(210,178,110,.18); aspect-ratio:1/.86;
          display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .card svg { width:150px; height:150px; }
  .card .cap { margin-top:22px; color:#f4f7fb; font-weight:700; font-size:34px; }
  .card .num { color:#d6b676; font-weight:700; font-size:26px; margin-bottom:8px; letter-spacing:2px; }
  .g   { stroke:#d6b676; stroke-width:6; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .gf  { fill:#d6b676; }
</style></head>
<body>
  <div class="grid">
    <div class="card"><div class="num">1</div>
      <svg viewBox="0 0 100 100">
        <path class="g" d="M50 90 V52"/>
        <path class="gf" d="M50 60 C50 40 66 32 82 34 C80 54 64 62 50 60 Z"/>
        <path class="gf" d="M50 70 C50 54 36 48 22 51 C25 68 40 74 50 70 Z"/>
      </svg><div class="cap">새싹</div></div>

    <div class="card"><div class="num">2</div>
      <svg viewBox="0 0 100 100">
        <circle class="gf" cx="50" cy="40" r="26"/>
        <path class="g" d="M50 62 V90" stroke-width="8"/>
      </svg><div class="cap">나무</div></div>

    <div class="card"><div class="num">3</div>
      <svg viewBox="0 0 100 100">
        <path class="g" d="M50 16 L72 60 L50 92 L28 60 Z"/>
        <path class="g" d="M50 58 V92"/>
        <circle class="gf" cx="50" cy="48" r="6"/>
      </svg><div class="cap">펜촉</div></div>

    <div class="card"><div class="num">4</div>
      <svg viewBox="0 0 100 100">
        <path class="g" d="M16 74 H84"/>
        <path class="g" d="M33 74 A17 17 0 0 1 67 74"/>
        <path class="g" d="M50 40 V31 M30 50 L24 44 M70 50 L76 44"/>
      </svg><div class="cap">해돋이</div></div>

    <div class="card"><div class="num">5</div>
      <svg viewBox="0 0 100 100">
        <circle class="g" cx="50" cy="50" r="34"/>
        <path class="g" d="M35 51 L46 64 L67 37"/>
      </svg><div class="cap">체크</div></div>

    <div class="card"><div class="num">6</div>
      <svg viewBox="0 0 100 100">
        <path class="g" d="M32 18 H68 V86 L50 71 L32 86 Z"/>
      </svg><div class="cap">북마크</div></div>
  </div>
</body></html>
