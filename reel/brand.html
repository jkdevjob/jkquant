<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  @font-face { font-family:'Nanum'; font-weight:400; src:url('fonts/nanum-400.woff2') format('woff2'); }
  @font-face { font-family:'Nanum'; font-weight:700; src:url('fonts/nanum-700.woff2') format('woff2'); }
  @font-face { font-family:'Nanum'; font-weight:800; src:url('fonts/nanum-800.woff2') format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Nanum',sans-serif; background:#222; }
  .art { width:1080px; height:1080px; position:relative; overflow:hidden;
         display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .emblem { margin-bottom:54px; }
  .brand  { font-weight:800; font-size:212px; letter-spacing:-4px; line-height:1; }
  .divider{ height:2px; margin:52px 0; border-radius:2px; }
  .slogan { font-weight:400; font-size:50px; letter-spacing:20px; text-indent:20px; }

  /* ── A: 네이비 + 골드 (프리미엄) ── */
  #a { background:radial-gradient(circle at 50% 42%, #14304c 0%, #0c2137 55%, #071624 100%); }
  #a::after { content:""; position:absolute; inset:0;
              background:radial-gradient(circle at 50% 46%, transparent 52%, rgba(0,0,0,.45) 100%); }
  #a .ring { position:absolute; inset:58px; border:2px solid rgba(210,178,110,.22); border-radius:50%; }
  #a .brand { color:#f4f7fb; }
  #a .divider { width:118px; background:linear-gradient(90deg,transparent,#d2b26e,transparent); }
  #a .slogan { color:rgba(214,182,118,.82); }
  #a .emblem { margin-bottom:34px; }
  #a .emblem .s  { stroke:#d6b676; }
  #a .emblem .st { stroke:rgba(214,182,118,.7); }

  /* ── B: 크림 에디토리얼 (모던) ── */
  #b { background:radial-gradient(circle at 50% 42%, #f6f2ea 0%, #efe9dd 100%); }
  #b .kicker { color:#b0473a; font-weight:700; font-size:40px; letter-spacing:16px;
               text-indent:16px; margin-bottom:30px; }
  #b .brand { color:#1b1813; }
  #b .divider { width:130px; background:#b0473a; }
  #b .slogan { color:#8a7f6f; }
  #b .emblem { margin-bottom:26px; }
  #b .emblem .s  { stroke:#b0473a; }
  #b .emblem .st { stroke:rgba(176,71,58,.7); }
</style></head>
<body>
  <div class="art" id="a">
    <div class="ring"></div>
    <svg class="emblem" width="150" height="150" viewBox="0 0 100 100" fill="none">
      <path class="s" d="M30 46 H62 V60 a13 13 0 0 1 -13 13 H43 a13 13 0 0 1 -13 -13 Z"
        stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="s" d="M62 50 a10 10 0 0 1 0 18" stroke-width="4.5" stroke-linecap="round"/>
      <path class="s" d="M26 82 H68" stroke-width="4.5" stroke-linecap="round"/>
      <path class="st" d="M41 26 q7 6 0 13 M53 26 q7 6 0 13" stroke-width="3.5" stroke-linecap="round"/>
    </svg>
    <div class="brand">은퇴노트</div>
    <div class="divider"></div>
    <div class="slogan">늦지&nbsp;않았습니다</div>
  </div>

  <div class="art" id="b">
    <svg class="emblem" width="150" height="150" viewBox="0 0 100 100" fill="none">
      <path class="s" d="M30 46 H62 V60 a13 13 0 0 1 -13 13 H43 a13 13 0 0 1 -13 -13 Z"
        stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="s" d="M62 50 a10 10 0 0 1 0 18" stroke-width="4.5" stroke-linecap="round"/>
      <path class="s" d="M26 82 H68" stroke-width="4.5" stroke-linecap="round"/>
      <path class="st" d="M41 26 q7 6 0 13 M53 26 q7 6 0 13" stroke-width="3.5" stroke-linecap="round"/>
    </svg>
    <div class="kicker">RETIREMENT&nbsp;NOTE</div>
    <div class="brand">은퇴노트</div>
    <div class="divider"></div>
    <div class="slogan">늦지&nbsp;않았습니다</div>
  </div>
</body></html>
