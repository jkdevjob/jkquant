<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  @font-face { font-family:'Sans'; src:url('fonts/nanum-400.woff2'); font-weight:400; }
  @font-face { font-family:'Sans'; src:url('fonts/nanum-700.woff2'); font-weight:700; }
  @font-face { font-family:'Sans'; src:url('fonts/nanum-800.woff2'); font-weight:800; }
  @font-face { font-family:'Pen'; src:url('fonts/NanumPenScript-Regular.ttf'); }
  :root { --ink:#16130f; --red:#d7261e; --yel:#ffe14d; --blue:#1f4fa8; --gray:#6b6258; --paper:#fbf6ea; --line:#d9e3ef; --navy:#13213a; }
  .mb { --ink:#15171c; --red:#ff4d1f; --yel:#ffd60a; --blue:#1f6fff; --gray:#6e737d; --paper:#ffffff; --line:#eef0f3; --navy:#15171c; } /* 매니악 v2(11/19): 흰 카드 + 주황 띠 */
  .mb .slide { border-top:18px solid #ff6a2b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#222; }
  .slide { width:1080px; height:1350px; position:relative; overflow:hidden; background:var(--paper); color:var(--ink); font-family:'Sans'; letter-spacing:-0.03em; }
  .rn .slide { background-image:repeating-linear-gradient(to bottom, transparent 0 63px, var(--line) 63px 65px); background-position:0 22px; }
  .rn .slide::before { content:""; position:absolute; left:92px; top:0; bottom:0; width:3px; background:#f0a8a3; opacity:.8; }
  .top { position:absolute; left:0; right:0; top:0; height:118px; display:flex; align-items:center; justify-content:space-between; padding:0 64px 0 120px; }
  .tape { background:rgba(255,225,77,.88); color:#16130f; font-family:'Pen'; font-size:46px; padding:6px 26px 2px; transform:rotate(-2deg); box-shadow:0 2px 6px rgba(0,0,0,.12); }
  .mb .tape { font-family:'Sans'; font-weight:800; font-size:30px; border-radius:30px; padding:10px 26px; transform:none; background:#ff6a2b; color:#fff; }
  .pg { font-size:30px; font-weight:700; color:var(--gray); }
  .body { position:absolute; left:120px; right:64px; top:150px; bottom:150px; }
  .t1 { font-size:86px; font-weight:800; line-height:1.12; }
  .t2 { font-size:86px; font-weight:800; line-height:1.12; color:var(--red); margin-top:6px; }
  .t2 em, .t1 em { font-style:normal; background:linear-gradient(transparent 58%, var(--yel) 58%); padding:0 6px; }
  .mb .t2 em, .mb .t1 em { background:linear-gradient(transparent 58%, var(--yel) 58%); color:inherit; }
  .sub { font-size:34px; color:var(--gray); margin-top:22px; font-weight:700; }
  .h { font-size:60px; font-weight:800; line-height:1.15; }
  .h .r { color:var(--red); }
  .vs { display:flex; gap:28px; margin-top:36px; }
  .vs .card { flex:1; background:#fff; border-radius:28px; padding:34px 30px 30px; box-shadow:0 6px 18px rgba(0,0,0,.10); border-top:14px solid var(--c); }
  .vs .lab { font-size:40px; font-weight:800; }
  .vs .big { font-size:104px; font-weight:800; color:var(--c); line-height:1.05; margin:14px 0 8px; letter-spacing:-0.05em; }
  .vs .cap { font-size:36px; font-weight:700; line-height:1.3; }
  .vs .cap b { color:var(--c); }
  .swipe { margin-top:26px; text-align:right; font-size:40px; font-weight:800; color:var(--ink); }
  .swipe span { background:var(--yel); color:#16130f; padding:12px 34px; border-radius:40px; }
  table { width:100%; border-collapse:separate; border-spacing:0; margin-top:34px; background:#fff; border-radius:24px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.10); }
  th { background:var(--navy); color:#fff; font-size:34px; font-weight:800; padding:20px 18px; text-align:left; }
  td { font-size:46px; font-weight:800; padding:19px 18px; border-top:2px solid rgba(0,0,0,.06); }
  td.dim { color:var(--gray); font-size:40px; }
  tr.hi td { background:var(--yel); color:#16130f; }
  tr:nth-child(even):not(.hi) td { background:rgba(0,0,0,.025); }
  .note { font-size:30px; color:var(--gray); margin-top:22px; line-height:1.45; font-weight:700; }
  .box { margin-top:30px; background:#fff; border-radius:24px; padding:30px 34px; box-shadow:0 6px 18px rgba(0,0,0,.10); border-left:14px solid var(--red); }
  .box .bt { font-size:40px; font-weight:800; color:var(--red); margin-bottom:12px; }
  .box p { font-size:36px; font-weight:700; line-height:1.45; }
  ol.list { list-style:none; margin-top:36px; }
  ol.list li { display:flex; gap:24px; align-items:flex-start; background:#fff; border-radius:22px; padding:26px 28px; margin-bottom:22px; box-shadow:0 4px 12px rgba(0,0,0,.08); }
  ol.list .n { flex:0 0 64px; height:64px; border-radius:50%; background:var(--navy); color:#fff; font-size:36px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  ol.list .tx b { display:block; font-size:42px; font-weight:800; line-height:1.25; }
  ol.list .tx span { display:block; font-size:32px; font-weight:700; color:var(--gray); margin-top:6px; line-height:1.35; }
  .foot { position:absolute; left:0; right:0; bottom:0; height:110px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 64px 0 120px; }
  .foot .hd { font-size:38px; font-weight:800; white-space:nowrap; }
  .mb .foot .hd { font-size:32px; }
  .foot .ds { font-size:24px; color:#c9d3e3; text-align:right; line-height:1.35; }
  .cta .big2 { font-size:76px; font-weight:800; line-height:1.2; margin-top:40px; }
  .cta .big2 .r { color:var(--red); }
  .ill { position:absolute; right:0; }
  .bars { margin-top:28px; background:#fff; border-radius:28px; padding:30px 34px 20px; box-shadow:0 6px 18px rgba(0,0,0,.10); }
  .bars .bt { font-size:36px; font-weight:800; margin-bottom:18px; }
  .bar { display:flex; align-items:center; gap:18px; margin-bottom:12px; }
  .bar .bl { flex:0 0 190px; font-size:32px; font-weight:800; }
  .bar .bw { flex:1; height:52px; position:relative; }
  .bar .bf { height:100%; border-radius:12px; background:var(--c); display:flex; align-items:center; justify-content:flex-end; padding-right:16px; color:#fff; font-size:34px; font-weight:800; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:30px; }
  .tile { background:#fff; border-radius:26px; padding:22px 26px 20px; box-shadow:0 6px 18px rgba(0,0,0,.10); border-top:12px solid var(--red); }
  .tile .lab { font-size:34px; font-weight:800; color:var(--gray); }
  .tile .big { font-size:84px; font-weight:800; color:var(--red); line-height:1.08; margin:10px 0 6px; letter-spacing:-0.05em; }
  .tile .cap { font-size:31px; font-weight:700; line-height:1.3; }
  .more { margin-top:36px; }
  .more .mt { font-size:34px; font-weight:800; color:var(--gray); margin-bottom:14px; }
  .more span { display:inline-block; background:#fff; border:3px solid var(--navy); border-radius:40px; padding:10px 24px; margin:0 12px 14px 0; font-size:32px; font-weight:800; }
  /* ── 굵은 글씨 꼴(style:"bold") — 위 그림 절반 + 아래 검은 바탕 큰 흰 글씨(인스타 명언·정보 계정 꼴, 11/19) ── */
  .bold .slide { background:#0b0b0b !important; background-image:none !important; color:#fff; }
  .bold .slide::before { display:none; }
  .bold .top { padding:0 56px; height:96px; }
  .bold .tape { font-family:'Sans'; font-weight:800; font-size:28px; transform:none; border-radius:30px; padding:8px 22px; background:var(--hl); color:#0b0b0b; box-shadow:none; }
  .bold .pg { color:#8d8d8d; }
  .bold .foot { background:transparent; height:84px; padding:0 56px; }
  .bold .foot .hd { font-size:28px; color:#cfcfcf; }
  .bold .foot .ds { color:#7d7d7d; }
  .hero-vis { position:absolute; left:0; right:0; top:0; height:640px; overflow:hidden; background:radial-gradient(ellipse at 40% 30%, #6b4a32 0%, #3a281b 55%, #1d140d 100%); }
  .hero-vis::after { content:""; position:absolute; left:0; right:0; bottom:0; height:160px; background:linear-gradient(transparent, #0b0b0b); }
  .hero-paper { position:absolute; left:110px; top:130px; width:880px; height:620px; background:#fbf6ea; border-radius:6px; transform:rotate(-3deg); box-shadow:0 30px 60px rgba(0,0,0,.55);
    background-image:repeating-linear-gradient(to bottom, transparent 0 61px, #d9e3ef 61px 63px); background-position:0 34px; padding:56px 60px 0 96px; }
  .hero-paper::before { content:""; position:absolute; left:70px; top:0; bottom:0; width:3px; background:#f0a8a3; }
  .hero-paper .pl { font-family:'Pen'; font-size:78px; line-height:63px; color:#1d2a52; white-space:nowrap; }
  .hero-paper .pl.r { color:#c8231c; }
  .hero-paper .pl.hl span { background:linear-gradient(transparent 45%, rgba(255,225,77,.85) 45%); padding:0 8px; }
  .hero-big { position:absolute; left:0; right:0; top:120px; text-align:center; }
  .hero-big .n { font-size:200px; font-weight:800; color:var(--hl); letter-spacing:-0.05em; line-height:1; -webkit-text-stroke:6px #000; paint-order:stroke fill; }
  .hero-big .c { font-size:44px; font-weight:800; color:#fff; margin-top:14px; }
  .hero-txt { position:absolute; left:56px; right:48px; top:640px; bottom:96px; display:flex; flex-direction:column; justify-content:center; }
  .hero-txt .k { font-size:38px; font-weight:800; color:var(--hl); margin-bottom:18px; }
  .hero-txt .tl { font-size:96px; font-weight:800; line-height:1.17; letter-spacing:-0.045em; color:#fff; }
  .hero-txt .tl .r, .hero-txt .tl em { color:var(--hl); font-style:normal; background:none; padding:0; }
  .pt .no { font-size:150px; font-weight:800; color:var(--hl); line-height:1; letter-spacing:-0.04em; }
  .pt .ph { font-size:88px; font-weight:800; line-height:1.18; margin-top:26px; letter-spacing:-0.04em; }
  .pt .ph .r, .pt .ph em { color:var(--hl); font-style:normal; background:none; padding:0; }
  .pt .pb { font-size:44px; font-weight:700; line-height:1.5; color:#d6d6d6; margin-top:34px; }
  .pt .pb b { color:#fff; }
  .pt .vs2 { display:flex; gap:20px; margin-top:44px; }
  .pt .vs2 div { flex:1; border-radius:22px; padding:30px 28px; font-size:42px; font-weight:800; line-height:1.35; }
  .pt .vs2 .bad { background:#2a2a2a; color:#bdbdbd; }
  .pt .vs2 .good { background:var(--hl); color:#0b0b0b; }
  .pt .vs2 small { display:block; font-size:26px; opacity:.8; margin-bottom:8px; }
  .bold .box { background:#1c1c1c; box-shadow:none; }
  .bold .box p { color:#e6e6e6; }
  .bold .h .r, .bold .cta .r { color:var(--hl); }
  .bold .cta .big2 { color:#fff; }
  .psrc { position:absolute; left:0; right:0; bottom:0; font-size:26px; color:#8d8d8d; font-weight:700; }
  /* 마스코트(11/19) — 은퇴노트 '노트쌤' · 매니악 '매니' */
  .pgw { display:flex; align-items:center; gap:14px; }
  .pgw .badge { height:92px; display:block; }
  .msc { position:absolute; z-index:5; }
  .msc img { width:100%; display:block; filter:drop-shadow(0 10px 12px rgba(0,0,0,.28)); }
  .msc .bub { position:absolute; bottom:100%; right:38%; margin-bottom:-4px; background:#fff; color:#16130f; border:5px solid #16130f; border-radius:28px;
    padding:12px 24px; font-family:'Sans'; font-weight:800; font-size:34px; letter-spacing:-0.03em; white-space:nowrap; }
  .msc .bub::after { content:""; position:absolute; right:24px; bottom:-21px; border:11px solid transparent; border-top:15px solid #16130f; }
  .msc .bub.left { bottom:auto; right:100%; top:34px; margin:0 10px 0 0; }
  .msc .bub.left::after { right:-22px; bottom:auto; top:22px; border:11px solid transparent; border-left:15px solid #16130f; }
</style></head>
<body><div id="root"></div>
<script>
const D = window.__DATA__;
const MB = D.brand === "mb";
document.body.className = (MB ? "mb" : "rn") + (D.style === "bold" ? " bold" : "");
document.body.style.setProperty("--hl", D.hl || (MB ? "#ff7a2f" : "#ffe14d"));
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
const rich = (s) => esc(s).replace(/\[(.+?)\]/g, "<em>$1</em>").replace(/\{(.+?)\}/g, '<span class="r">$1</span>').replace(/\*(.+?)\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
const N = D.slides.length;
const foot = () => `<div class="foot"><div class="hd">${MB ? "매니악 브리핑" : "은퇴노트"} · ${esc(D.handle || (MB ? "@maniacbriefing" : "@retire.note"))}</div><div class="ds">${esc(D.disclaimer || "정보 공유용 · 투자 권유 아님")}<br>${esc(D.source || "")}</div></div>`;
const MASC = D.mascot !== false, MSRC = `assets/mascot-${MB ? "mb" : "rn"}.svg`;
const topBar = (i) => `<div class="top"><div class="tape">${esc(D.tape)}</div><div class="pgw">${MASC && i > 0 ? `<img class="badge" src="${MSRC}">` : ""}<div class="pg">${i + 1} / ${N}</div></div></div>`;
const msc = (x, y, size, say, side) => MASC ? `<div class="msc" style="left:${x}px;top:${y}px;width:${size}px">${say ? `<div class="bub ${side || ""}">${rich(say)}</div>` : ""}<img src="${MSRC}"></div>` : "";
const html = D.slides.map((s, i) => {
  let b = "";
  if (s.type === "cover") {
    b = `<div class="t1">${rich(s.t1)}</div><div class="t2">${rich(s.t2)}</div>${s.sub ? `<div class="sub">${rich(s.sub)}</div>` : ""}
      <div class="vs">${(s.cards || []).map((c) => `<div class="card" style="--c:${c.color === "blue" ? "var(--blue)" : "var(--red)"}"><div class="lab">${rich(c.label)}</div><div class="big">${esc(c.big)}</div><div class="cap">${rich(c.cap)}</div></div>`).join("")}</div>
      ${s.tiles ? `<div class="tiles">${s.tiles.map((x) => `<div class="tile"><div class="lab">${rich(x.label)}</div><div class="big">${esc(x.big)}</div><div class="cap">${rich(x.cap)}</div></div>`).join("")}</div>` : ""}
      ${s.bars ? `<div class="bars"><div class="bt">${rich(s.bars.t)}</div>${s.bars.items.map((x) => `<div class="bar" style="--c:${x.color === "blue" ? "var(--blue)" : x.color === "gray" ? "#8a8178" : "var(--red)"}"><div class="bl">${rich(x.label)}</div><div class="bw"><div class="bf" style="width:${Math.round(x.pct / s.bars.max * 100)}%">${esc(x.text)}</div></div></div>`).join("")}</div>` : ""}
      ${s.box ? `<div class="box"><div class="bt">${esc(s.box.t)}</div><p>${rich(s.box.p)}</p></div>` : ""}
      ${s.swipe ? `<div class="swipe"><span>${esc(s.swipe)}</span></div>` : ""}`;
  } else if (s.type === "hero") {
    const v = s.visual || {};
    const vis = v.kind === "big" ? `<div class="hero-big"><div class="n">${esc(v.big)}</div><div class="c">${rich(v.cap || "")}</div></div>`
      : `<div class="hero-paper">${(v.lines || []).map((l, k) => `<div class="pl ${(v.red || []).includes(k) ? "r" : ""} ${(v.hl || []).includes(k) ? "hl" : ""}"><span>${esc(l)}</span></div>`).join("")}</div>`;
    return `<div class="slide" id="s${i}"><div class="hero-vis">${vis}</div>${msc(s.mx ?? 856, s.my ?? 440, s.ms ?? 200, s.say)}${topBar(i)}<div class="hero-txt">${s.kicker ? `<div class="k">${rich(s.kicker)}</div>` : ""}<div class="tl">${(s.title || []).map(rich).join("<br>")}</div></div>${foot()}</div>`;
  } else if (s.type === "point") {
    b = `<div class="pt"><div class="no">${esc(s.no)}</div><div class="ph">${(s.head || []).map(rich).join("<br>")}</div>${s.body ? `<div class="pb">${rich(s.body)}</div>` : ""}
      ${s.vs ? `<div class="vs2"><div class="bad"><small>${esc(s.vs.badLabel || "덜 받는 사람")}</small>${rich(s.vs.bad)}</div><div class="good"><small>${esc(s.vs.goodLabel || "더 받는 사람")}</small>${rich(s.vs.good)}</div></div>` : ""}</div>
      ${s.src ? `<div class="psrc">${esc(s.src)}</div>` : ""}`;
  } else if (s.type === "table") {
    b = `<div class="h">${rich(s.title)}</div>${s.sub ? `<div class="sub">${rich(s.sub)}</div>` : ""}
      <table><tr>${s.head.map((h) => `<th>${esc(h)}</th>`).join("")}</tr>
      ${s.rows.map((r, k) => `<tr class="${(s.hi || []).includes(k) ? "hi" : ""}">${r.map((c, j) => `<td class="${j === 0 && s.dimFirst ? "dim" : ""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</table>
      ${s.note ? `<div class="note">${rich(s.note)}</div>` : ""}${s.box ? `<div class="box"><div class="bt">${esc(s.box.t)}</div><p>${rich(s.box.p)}</p></div>` : ""}`;
  } else if (s.type === "list") {
    b = `<div class="h">${rich(s.title)}</div>${s.sub ? `<div class="sub">${rich(s.sub)}</div>` : ""}
      <ol class="list">${s.items.map((it, k) => `<li><div class="n">${k + 1}</div><div class="tx"><b>${rich(it.b)}</b>${it.t ? `<span>${rich(it.t)}</span>` : ""}</div></li>`).join("")}</ol>`;
  } else if (s.type === "cta") {
    b = `<div class="h">${rich(s.title)}</div><div class="cta">${(s.lines || []).map((l) => `<div class="big2">${rich(l)}</div>`).join("")}</div>
      ${s.box ? `<div class="box"><div class="bt">${esc(s.box.t)}</div><p>${rich(s.box.p)}</p></div>` : ""}
      ${s.more ? `<div class="more"${MASC ? ' style="max-width:600px"' : ""}><div class="mt">${esc(s.more.t)}</div>${s.more.items.map((x) => `<span>${esc(x)}</span>`).join("")}</div>` : ""}`;
  }
  const m = s.type === "point" ? msc(s.mx ?? 830, s.my ?? 118, s.ms ?? 180, s.say, "left")
    : s.type === "cta" ? msc(s.mx ?? 700, s.my ?? 820, s.ms ?? 300, s.say ?? "저장! 팔로우!")
    : s.mascot ? msc(s.mascot.x, s.mascot.y, s.mascot.size || 180, s.mascot.say) : "";
  return `<div class="slide" id="s${i}">${topBar(i)}<div class="body">${b}</div>${m}${foot()}</div>`;
}).join("");
document.getElementById("root").innerHTML = html;
document.fonts.ready.then(() => { window.__READY__ = true; });
</script></body></html>
