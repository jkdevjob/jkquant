<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  @font-face { font-family:'Nanum'; font-weight:400; font-display:block; src:url('fonts/nanum-400.woff2') format('woff2'); }
  @font-face { font-family:'Nanum'; font-weight:700; font-display:block; src:url('fonts/nanum-700.woff2') format('woff2'); }
  @font-face { font-family:'Nanum'; font-weight:800; font-display:block; src:url('fonts/nanum-800.woff2') format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; font-family:'Nanum',sans-serif; }
  #stage { width:1080px; height:1920px; position:relative; display:flex; flex-direction:column;
           justify-content:center; padding:0 108px; }

  /* 테마 */
  body.navy #stage { background:radial-gradient(circle at 50% 34%, #14304c 0%, #0c2137 58%, #071624 100%); }
  body.cream #stage { background:radial-gradient(circle at 50% 34%, #f6f2ea 0%, #efe9dd 100%); }

  .kicker { font-weight:700; font-size:44px; letter-spacing:10px; margin-bottom:44px; }
  .line   { font-weight:800; font-size:78px; line-height:1.34; letter-spacing:-2px; margin:6px 0; }
  .line.sm{ font-weight:700; font-size:52px; line-height:1.4; color:inherit; opacity:.85; }
  .accentword { }
  .foot { position:absolute; left:0; right:0; bottom:150px; text-align:center;
          font-weight:400; font-size:46px; letter-spacing:2px; }
  .slogan { position:absolute; left:0; right:0; bottom:220px; text-align:center;
            font-weight:700; font-size:52px; letter-spacing:8px; }

  body.navy  .kicker { color:#d6b676; }
  body.navy  .line   { color:#f4f7fb; }
  body.navy  .accentword { color:#e2c584; }
  body.navy  .slogan { color:rgba(214,182,118,.9); }
  body.navy  .foot   { color:rgba(255,255,255,.6); }
  body.cream .kicker { color:#b0473a; }
  body.cream .line   { color:#1b1813; }
  body.cream .accentword { color:#b0473a; }
  body.cream .slogan { color:#8a7f6f; }
  body.cream .foot   { color:#9a9184; }

  .rev { opacity:0; transform:translateY(40px); will-change:opacity,transform; }
</style></head>
<body>
  <div id="stage">
    <div class="kicker rev" id="kicker"></div>
    <div id="lines"></div>
    <div class="slogan rev" id="slogan"></div>
    <div class="foot rev" id="foot"></div>
  </div>
<script>
  const D = window.__DATA__ || {
    theme:"navy", kicker:"은퇴노트", lines:["미리보기 카드","두 번째 줄"],
    slogan:"늦지 않았습니다", handle:"@retire.note"
  };
  document.body.className = D.theme || "navy";

  // 강조어(**말**) → accentword 처리
  function fmt(s){ return s.replace(/\*\*(.+?)\*\*/g, '<span class="accentword">$1</span>'); }

  document.getElementById("kicker").textContent = D.kicker || "";
  const linesBox = document.getElementById("lines");
  const els = [];
  (D.lines||[]).forEach((ln)=>{
    const div = document.createElement("div");
    const small = ln.startsWith("~");        // ~로 시작하면 작은 줄
    div.className = "line rev" + (small ? " sm" : "");
    div.innerHTML = fmt(small ? ln.slice(1) : ln);
    linesBox.appendChild(div); els.push(div);
  });
  document.getElementById("slogan").textContent = D.slogan || "";
  document.getElementById("foot").textContent = D.handle || "";

  // 등장 대상: 키커 → 각 줄 → 슬로건 → 핸들
  const seq = [document.getElementById("kicker"), ...els,
               document.getElementById("slogan"), document.getElementById("foot")];
  const START = 0.5, STAGGER = 0.5, DUR = 0.7;
  function ease(x){ return 1 - Math.pow(1 - Math.min(1,Math.max(0,x)), 3); }

  window.renderAt = function(t){
    seq.forEach((el, i)=>{
      const p = ease((t - (START + i*STAGGER)) / DUR);
      el.style.opacity = p;
      el.style.transform = "translateY(" + (40*(1-p)) + "px)";
    });
  };
  window.renderAt(0);
  document.fonts.ready.then(()=>{ window.__READY__ = true; });
</script>
</body></html>
